:root{
  color-scheme:dark;
  --void:#0d0b10;--stone:#15121a;--panel:#1c1823;--panel2:#262030;--edge:#3a3245;--edge2:#574b67;
  --bone:#e4d8c1;--ash:#9a8fa4;--dim:#6d6377;--gold:#e3b341;--blood:#c4463f;--moss:#78ab60;
  --fire:#e0643a;--ice:#8fd0ea;--thunder:#e6d55a;--grass:#6fb35a;--fighting:#c98b5c;--dark:#9b70dc;--physical:#b9b1a3;
  --common:#b9b1a3;--rare:#5f97e3;--epic:#b56fe3;--godlike:#f2a83a;--perfect:#ff5c7a;
}
html,body{background:var(--void);color:var(--bone)}
body{
  font-family:'DsBody',ui-monospace,Menlo,Consolas,monospace;font-size:22px;line-height:1.15;
  padding-inline:16px;padding-block:14px 48px;
  background:radial-gradient(ellipse 120% 60% at 50% -10%,#2b2034 0%,var(--void) 65%) var(--void);
  min-height:100%;
}
*{box-sizing:border-box}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;-webkit-user-drag:none;user-select:none}
h1,h2,h3,.disp{font-family:'DsHead','DsBody',monospace;font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:26px}h3{font-size:22px;color:var(--ash);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
p{margin:0}
b{font-weight:600;color:#fff3dc}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ash)}
.gold{color:var(--gold)}
.warn{color:#f0a070}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.stack{display:flex;flex-direction:column;gap:10px}

/* chrome */
.panel{background:var(--panel);box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--edge);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 20px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.logo{font-size:clamp(22px,6.5vw,32px);color:var(--bone);text-shadow:3px 3px 0 #3a1620}
.sub{color:var(--gold);font-size:22px}
.res{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--stone);box-shadow:inset 0 0 0 2px var(--edge);padding:3px 10px 4px 6px;color:var(--ash)}
.chip b{color:var(--bone)}
.btn{font:inherit;font-size:22px;color:var(--bone);background:var(--panel2);border:0;cursor:pointer;padding:5px 14px 8px;
  box-shadow:inset 0 0 0 2px var(--edge2),inset 0 -4px 0 0 rgba(0,0,0,.4);line-height:1.1}
.btn:hover:not(:disabled){background:#33293f}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--edge2)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.gold{background:#4a3513;color:#ffe7ae;box-shadow:inset 0 0 0 2px var(--gold),inset 0 -4px 0 0 rgba(0,0,0,.4)}
.btn.gold:hover:not(:disabled){background:#5d4318}
.btn.red{background:#4a1a1c;color:#ffc9c2;box-shadow:inset 0 0 0 2px var(--blood),inset 0 -4px 0 0 rgba(0,0,0,.4)}
.btn.small{font-size:20px;padding:2px 9px 5px}
.btn.on{background:#2d3d25;box-shadow:inset 0 0 0 2px var(--moss),inset 0 -4px 0 0 rgba(0,0,0,.4)}
:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
input[type=text]{font:inherit;font-size:24px;background:var(--stone);color:var(--bone);border:0;box-shadow:inset 0 0 0 2px var(--edge2);padding:2px 8px;width:100%;max-width:240px}

/* street */
.street{position:relative;background:linear-gradient(#1a1422 0%,#2a1d2e 70%,#3b2530 100%);box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--edge);padding:18px 10px 0;overflow:hidden}
.street::before{content:"";position:absolute;inset:0;background:
  radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 33% 9%,#fff6 50%,transparent 51%),
  radial-gradient(1px 1px at 58% 22%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 81% 12%,#fff5 50%,transparent 51%),
  radial-gradient(1px 1px at 92% 30%,#fff6 50%,transparent 51%);pointer-events:none}
.moon{position:absolute;right:5%;top:8px;z-index:1;filter:drop-shadow(0 0 10px #d9cfb855)}
.logo small{font-size:20px;color:var(--ash)}
.toplogo{display:inline-block;vertical-align:-4px;margin-left:8px}
.moonbig{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.moonparts{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:20px;min-width:220px}
.moonparts .ok{color:var(--moss)}.moonparts .no{color:var(--ash)}
.buildings{position:relative;display:grid;grid-template-columns:repeat(9,1fr);gap:4px;align-items:end}

.choice{transition:transform .12s steps(2)}

/* ---------- 2.5D look ---------- */
.panel{background:linear-gradient(180deg,#231d2b,#1a1621 60%,#17131d);box-shadow:0 0 0 2px #050408,inset 2px 2px 0 #3f3550,inset -2px -2px 0 #0c0a11,0 6px 0 #050408,0 10px 24px #0008}
.btn{box-shadow:0 0 0 2px #060509,inset 2px 2px 0 rgba(255,255,255,.14),inset -2px -3px 0 rgba(0,0,0,.5);background:linear-gradient(#2e2638,#231d2b)}
.btn:hover:not(:disabled){background:linear-gradient(#3a3046,#2b2335)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 2px #060509,inset -2px -2px 0 rgba(255,255,255,.1),inset 2px 3px 0 rgba(0,0,0,.5)}
.btn.gold{background:linear-gradient(#6a4c18,#4a3513);box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--gold),inset 3px 3px 0 rgba(255,240,180,.25),inset -3px -4px 0 rgba(0,0,0,.4)}
.btn.gold:hover:not(:disabled){background:linear-gradient(#7c5a1e,#5a4116)}
.btn.red{background:linear-gradient(#5a2024,#3e1518)}
.btn.on{background:linear-gradient(#35482c,#26351f)}
.card,.item,.choice,.recipe,.bcard,.shopitem,.upg,.mapcard,.foecard,.stile,.subtab{box-shadow:inset 0 0 0 2px var(--edge),inset 2px 2px 0 #ffffff10,inset -2px -2px 0 #0006}
.card,.item,.recipe,.bcard,.shopitem,.foecard{background:linear-gradient(180deg,#1d1924,#141118)}
.item.r-rare-b{box-shadow:inset 0 0 0 2px #2c4466,inset 2px 2px 0 #ffffff10,inset -2px -2px 0 #0006}
.item.r-epic-b{box-shadow:inset 0 0 0 2px #4d3266,inset 2px 2px 0 #ffffff10,inset -2px -2px 0 #0006}
.item.r-godlike-b{box-shadow:inset 0 0 0 2px #7a5420,inset 2px 2px 0 #ffffff10,inset -2px -2px 0 #0006,0 0 14px #f2a83a22}
.item.r-perfect-b{box-shadow:inset 0 0 0 2px #8a2438,inset 2px 2px 0 #ffffff10,inset -2px -2px 0 #0006,0 0 16px #ff5c7a33}
.card.sel,.item.sel,.choice.cur,.mapcard.cur,.subtab.cur,.foecard.tgt,.stile.pri{box-shadow:inset 0 0 0 2px var(--gold),inset 2px 2px 0 #fff2,inset -2px -2px 0 #0006}
.recipe.ready{box-shadow:inset 0 0 0 2px var(--moss),inset 2px 2px 0 #fff2,inset -2px -2px 0 #0006}
.ibox,.upg-ico,.portrait{box-shadow:inset 0 0 0 2px var(--edge),inset 3px 3px 0 #0008;background:radial-gradient(circle at 50% 35%,#2a2234,#0c0a10)}
/* isometric town */
.iso{position:relative;width:100%;max-width:1100px;margin:0 auto;aspect-ratio:326/214;background:radial-gradient(ellipse 60% 50% at 80% 12%,#3a3450 0%,transparent 60%),linear-gradient(#0a0814 0%,#1a1428 45%,#2a1e30 100%);box-shadow:0 0 0 2px #050408,inset 2px 2px 0 #3f3550,0 8px 0 #050408,0 12px 30px #000a;overflow:hidden}
.iso::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(1px 1px at 8% 10%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 22% 22%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 41% 6%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 57% 16%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 69% 4%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 93% 26%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 33% 30%,#fff4 50%,transparent 51%)}
.isoimg{position:absolute;inset:0;width:100%;height:100%}
.iso-title{position:absolute;left:2.5%;top:3%;display:flex;flex-direction:column;text-shadow:2px 2px 0 #000}
.iso-moon{position:absolute;right:3%;top:1.5%;font:inherit;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 0 18px #d9cfb870)}
.iso-moon img{width:clamp(34px,7vw,74px);height:auto}
.spot{position:absolute;font:inherit;background:none;border:0;cursor:pointer;padding:0;display:flex;align-items:flex-end;justify-content:center}
.spot:hover{background:radial-gradient(ellipse at 50% 70%,#ffd98a22,transparent 70%)}
.spot .plaque{transform:translateY(60%);white-space:nowrap;font-size:clamp(11px,1.9vw,18px);box-shadow:0 0 0 1px #000,inset 1px 1px 0 #fff2;background:#120e18e6;color:var(--bone)}
.spot:hover .plaque{color:var(--gold)}
.spot .alert{left:auto;right:10%;top:8%}
.isohero{position:absolute;transform:translate(-50%,-94%);font:inherit;background:none;border:0;cursor:pointer;padding:0;width:4.4%;line-height:0}
.isohero img{width:100%;height:auto;filter:drop-shadow(0 2px 0 #0009)}
.isohero::after{content:"";position:absolute;left:10%;right:10%;bottom:-3%;height:12%;background:radial-gradient(ellipse,#000a,transparent 70%);z-index:-1}
.isohero .alert{top:-30%;left:60%}
.fireflies{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 30% 60%,#ffe08a 50%,transparent 51%),radial-gradient(2px 2px at 64% 72%,#ffe08a 50%,transparent 51%),radial-gradient(1px 1px at 48% 52%,#fff2b0 50%,transparent 51%);animation:ffly 7s ease-in-out infinite alternate;opacity:.7}
@keyframes ffly{to{transform:translate(12px,-10px);opacity:.3}}
.thumb{width:64px;height:auto;filter:drop-shadow(0 3px 0 #0008)}
@media (max-width:720px){.thumb{width:52px}}
/* battle depth */
.lay{position:absolute;left:0;right:0;background-repeat:repeat-x;image-rendering:pixelated;background-size:auto 100%;pointer-events:none}
.lay.far{bottom:34px;height:112px;animation:pan 480s linear infinite;opacity:.9}
.lay.mid{bottom:30px;height:88px;animation:pan 240s linear infinite}
@keyframes pan{to{background-position-x:-640px}}
.scene .gnd{position:absolute;left:0;right:0;bottom:0;height:40px;background-size:100% 100%;image-rendering:pixelated}
.scene .fo::after{content:"";position:absolute;left:8%;right:8%;bottom:-5px;height:8px;background:radial-gradient(ellipse,#000b,transparent 70%);z-index:-1}
.group .fo:nth-child(2){margin-bottom:14px}.group .fo:nth-child(3){margin-bottom:4px}
.actor{z-index:1}
@media (prefers-reduced-motion:reduce){.lay,.fireflies{animation:none}}

/* ---------- touch, zoom and small screens ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,[data-a]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{zoom:var(--z,1)}
.thumb{aspect-ratio:84/74}
@media (pointer:coarse){.btn.small{min-height:36px}.subtab{min-height:40px}}
@media (max-width:420px){body{padding-inline:10px}.panel{padding:12px 10px}}
.zoomctl{display:inline-flex;align-items:center;gap:4px}
.zoomctl .btn{min-width:34px;padding-inline:8px}
.zoomctl span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- gate: thin length bar ---------- */
.lenbar{display:flex;background:#0f0c13;box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--edge);padding:3px;gap:3px}
.lenopt{flex:1 1 0;min-width:0;font:inherit;font-size:20px;color:var(--ash);background:transparent;border:0;padding:4px 4px 5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.lenopt:hover:not(:disabled){color:var(--bone);background:#221c2b}
.lenopt.cur{color:#1a1206;background:var(--gold)}
.lenopt.dark.cur{background:#6a4a9a;color:#fff}
.lenopt:disabled{opacity:.45;cursor:not-allowed}
.lenopt .ls{display:none}
@media (max-width:520px){.lenopt{font-size:18px;padding-inline:2px;text-overflow:clip}.lenopt .lf{display:none}.lenopt .ls{display:inline}}
.lensum{font-size:20px;color:var(--ash)}
.lensum .ok{color:var(--moss)}

/* ---------- battle screen: one fixed stage, no page scroll ---------- */
body.inbattle{overflow:hidden;overscroll-behavior:none}
.bscreen{position:fixed;left:0;top:0;width:calc(100vw / var(--z,1));height:calc(100dvh / var(--z,1));z-index:10;background:var(--void);overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto auto;grid-template-areas:"hdr" "turn" "stage" "roster" "log" "act";gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.bhdr{grid-area:hdr;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-width:0}
.bhdr .ttl{font-family:'DsHead',monospace;font-size:20px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 140px}
.bhdr .chip{padding:1px 8px 2px 4px;font-size:20px}
.bhdr .btn{font-size:20px;padding:2px 9px 5px}
.tstrip{grid-area:turn;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;align-items:center;min-width:0}
.tstrip::-webkit-scrollbar{display:none}
.tstrip .lbl{font-size:18px;color:var(--ash);text-transform:uppercase;letter-spacing:.08em;flex:none;padding-right:2px}
.tstrip .tb{width:auto;flex-direction:row;gap:3px;padding:2px 6px 2px 3px;font-size:18px}
.tstrip .tb span{max-width:70px}
.scene.stage{grid-area:stage;height:auto;min-height:0;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:28px 2% 10px}
.stage .gnd{height:30%}
.stage .lay.far{bottom:30%;height:42%}
.stage .lay.mid{bottom:29%;height:32%}
.stage .stage-label{font-size:18px;top:6px;left:8px}
.side{position:relative;z-index:1;display:flex;align-items:flex-end;gap:clamp(4px,1.4vw,16px);min-width:0}
.side.heroes{flex-direction:row}
.unit{--us:clamp(46px,7vw,84px);position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:clamp(96px,13vw,150px);color:var(--bone);text-align:center;min-width:0}
.unit.big{--us:clamp(64px,10.5vw,126px)}
.unit.foe.kingv .fo{transform:scale(var(--ks,1));transform-origin:50% 100%;transition:transform .8s ease}
.unit.foe{cursor:pointer}
.unit .fo{line-height:0}
.unit .fo img.px{width:min(calc(var(--us) * 1.275),calc((100cqw - 80px) / 6),calc(100cqh - 22px));height:auto;max-width:none}
.unit.big .fo img.px{width:min(calc(var(--us) * 1.275),calc((100cqw - 80px) / 4),calc(100cqh - 18px))}
body.lay-stack .unit .fo img.px{width:min(calc(var(--us) * 1.275),calc((100cqw - 24px) / 3),calc(60cqh - 14px))}
body.lay-stack .unit.big .fo img.px{width:min(calc(var(--us) * 1.275),calc((100cqw - 24px) / 2.2),calc(64cqh - 10px))}
.unit .pop{bottom:calc(100% + var(--dy,0px))}
.uinfo{width:100%;display:flex;flex-direction:column;gap:2px;background:#0a0810e0;box-shadow:0 0 0 2px #000,inset 0 0 0 1px var(--edge2);padding:3px 4px 4px;min-width:0}
.unit.act .uinfo{box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--gold)}
.unit.act .uname{color:var(--gold)}
.unit.tgt .uinfo{box-shadow:0 0 0 2px #000,inset 0 0 0 2px #e0736c}
.unit.tgt .fo::before{content:"";position:absolute;left:50%;top:-12px;margin-left:-6px;border:6px solid transparent;border-top-color:#e0736c}
.unit.foe:hover .uinfo{background:#1a1422e8}
.unit.down{opacity:.5}
.uname{font-size:18px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uname small{color:var(--ash);font-size:18px}
.uname:has(.ufat){display:flex;align-items:center;gap:4px}.uname .unm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.approach{display:flex;align-items:flex-end;gap:6px;flex:none}.approach .afar{opacity:.55;filter:brightness(.7) saturate(.7);transform:translateY(-10px)}
.bar.fatb i{background:#8a7a5a}.bar.fatb.mid i{background:#c98b3c}.bar.fatb.hi i{background:#c4463f}
.ufat{position:relative;flex:0 0 46px;height:13px;background:#1a1520;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #3a3040;overflow:hidden}
.ufat i{position:absolute;left:0;top:0;bottom:0;background:#8a7a5a}.ufat.mid i{background:#c98b3c}.ufat.hi i{background:#c4463f}
.ufat span{position:relative;display:block;text-align:center;font-size:13px;line-height:13px;color:#f3ead8;text-shadow:1px 1px 0 #000}
body.lay-wide .ufat{flex-basis:58px;height:15px}body.lay-wide .ufat span{font-size:15px;line-height:15px}
.umeta{font-size:18px;line-height:1;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubar{height:14px;background:#0c0a0f;box-shadow:inset 0 0 0 1px #000;position:relative;overflow:hidden}
.ubar i{display:block;height:100%}
.ubar.hp i{background:linear-gradient(#e0574f,#a3302c)}
.ubar.mp i{background:linear-gradient(#6b8fe8,#3c55a8)}
.ubar.xp i{background:linear-gradient(#e3c75a,#a8862a)}
.ubar.xp.thin{height:5px}
.btn .ubar.xp.thin{margin-top:3px}
.ubar.ch i{background:linear-gradient(#e6a64a,#9a5a1a)}
.ubar.ch.full i{background:linear-gradient(#ff7a5a,#b8321e)}
.ubar span{position:absolute;inset:0;font-size:16px;line-height:14px;text-align:center;color:#fff;text-shadow:1px 1px 0 #000;white-space:nowrap}
.utags{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.uknow{display:flex;gap:2px 3px;flex-wrap:wrap;justify-content:center}
.uknow .utag{font-size:14px;padding:0 3px 1px;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 55%,transparent)}
.uknow .utag.kn{background:#ffffff10}
:is(body.lay-stack,body.lay-side) .uknow{justify-content:flex-start}
/* Phone layouts: one line per card (knowledge, weakness, resistances). Everything else is in the target line under the cards. */
:is(body.lay-stack,body.lay-side) .uknow{flex-wrap:nowrap;overflow:hidden}
:is(body.lay-stack,body.lay-side) .uknow .xtra{display:none}
:is(body.lay-stack,body.lay-side) .uknow .utag{font-size:13px;flex:none}
.utag{font-size:16px;line-height:1;padding:1px 4px 2px;box-shadow:inset 0 0 0 1px currentColor}
.blogline{grid-area:log;font:inherit;font-size:18px;line-height:1.15;height:2.35em;overflow:hidden;color:var(--ash);background:#0f0c13;border:0;box-shadow:inset 0 0 0 2px var(--edge);padding:2px 8px;text-align:left;cursor:pointer;min-width:0}
.blogline p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blogline p:first-child{color:#fff3dc}
.actbar{grid-area:act;max-height:48dvh;overflow-y:auto;overscroll-behavior:contain;min-height:132px;display:flex;flex-direction:column;gap:6px;padding:8px 10px;
  background:linear-gradient(180deg,#231d2b,#17131d);box-shadow:0 0 0 2px #050408,inset 2px 2px 0 #3f3550,inset -2px -2px 0 #0c0a11}
.acthead{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:20px}
.acthead .tinfo{color:var(--ash);font-size:18px}
.skgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.skgrid .btn{padding:4px 8px 6px;text-align:left;display:flex;flex-direction:column;gap:1px;font-size:20px;line-height:1.05}
.skgrid .sub2{font-size:18px;color:var(--ash)}
.skgrid .btn>span{max-width:100%}
.hscroll{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;align-items:center;scrollbar-width:thin;padding-bottom:2px}
.hscroll>*{flex:none}
.hscroll .lab{font-size:18px;color:var(--ash)}
.actbar .rewards p{font-size:20px}
.drawer{position:absolute;inset:0;z-index:30;background:var(--void);overflow-y:auto;overscroll-behavior:contain;padding:10px max(10px,env(safe-area-inset-right)) 24px max(10px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px}
.drawer-top{position:sticky;top:-10px;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0d0b10;padding:6px 0}
.drawgrid{display:flex;flex-direction:column;gap:10px;min-width:0;width:100%;max-width:960px;margin:0 auto}
.modal{position:fixed;left:0;top:0;width:calc(100vw / var(--z,1));height:calc(100dvh / var(--z,1));z-index:40;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{max-width:440px;width:100%;max-height:calc(92dvh / var(--z,1));overflow-y:auto}
/* action sections: Fight, then Items */
.asec{display:flex;flex-direction:column;gap:5px}
.asec+.asec{border-top:2px solid var(--edge);padding-top:6px}
.alabel{font-family:'DsHead',monospace;font-size:18px;color:var(--gold);text-transform:uppercase;letter-spacing:.1em}
.alabel span{font-family:'DsBody',monospace;color:var(--ash);text-transform:none;letter-spacing:0;font-size:18px;margin-left:6px}
/* roster: labeled bars under the pixel-art lineup on small screens */
.roster{display:none;grid-area:roster;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.rcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.rcol.hcol{flex-direction:column-reverse}
.rframe.foe{cursor:pointer}
.rframe.act{box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--gold)}.rframe.act .uname{color:var(--gold)}
.rframe.tgt{box-shadow:0 0 0 2px #000,inset 0 0 0 2px #e0736c}
.rframe.down{opacity:.5}
.unit.act .fo img.px{filter:drop-shadow(0 0 3px #e3b341) drop-shadow(0 0 1px #e3b341)}
/* battle layouts are chosen by body class (Settings > Screen, or Auto from the screen size) */
body.lay-stack .bhdr .zoomctl{display:none}
/* stacked (phones): pixel-art fighters across the top, labeled bars in the roster below */
body.lay-stack .bscreen{display:flex;flex-direction:column;gap:5px}
body.lay-stack .bscreen>*{flex:none}
body.lay-stack .bscreen>.stage{flex:1 1 auto;min-height:110px;container-type:size}
body.lay-stack .bscreen>.actbar{flex:0 1 auto;height:clamp(190px,42dvh,340px);min-height:0;max-height:none}
body.lay-stack .bhdr{flex-wrap:nowrap;gap:5px}
body.lay-stack .bhdr .ttl{font-size:18px;flex:1 1 0}
body.lay-stack .bhdr .chip{display:none}
body.lay-stack .blogline{height:1.3em;font-size:17px}
body.lay-stack .acthead .tinfo{font-size:17px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.lay-stack .skgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
body.lay-stack .skgrid .btn{min-width:0}
body.lay-stack .skgrid .btn>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.lay-stack .skgrid .btn{font-size:19px}
body.lay-stack .skgrid .sub2{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.lay-stack .rframe .umeta{display:none}
body.lay-stack .unit .uinfo{display:none}
body.lay-stack .roster{display:grid}
body.lay-stack .scene.stage{padding:24px 4px 6px;gap:4px;min-height:110px}
body.lay-stack .stage .gnd{height:24%}
body.lay-stack .stage .lay.far{bottom:24%}
body.lay-stack .stage .lay.mid{bottom:23%}
body.lay-stack .side{gap:2px}
body.lay-stack .unit{width:auto;--us:clamp(34px,min(14.5cqw,48cqh),120px)}
body.lay-stack .unit.big{--us:clamp(44px,min(18cqw,60cqh),150px)}
body.lay-stack .rframe{padding:2px 4px 3px}
body.lay-stack .rframe .utags{justify-content:flex-start}
/* wide on roomy screens (desktop, unfolded phones): bigger fighters */
@media (min-height:700px){
body.lay-wide .unit{--us:clamp(56px,9vw,120px);width:clamp(110px,14vw,180px)}
body.lay-wide .unit.big{--us:clamp(80px,13vw,170px)}
body.lay-wide .ubar{height:17px}
body.lay-wide .ubar span{font-size:18px;line-height:17px}
body.lay-wide .uname{font-size:20px}
body.lay-wide .umeta{font-size:18px}
}
/* side by side (phones on their side): actions move to the right */
body.lay-side .bscreen{grid-template-columns:minmax(0,1fr) minmax(220px,34%);grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"hdr hdr" "turn act" "stage act" "roster act" "log act"}
body.lay-side .actbar{max-height:none;min-height:0}
body.lay-side .unit .uinfo{display:none}
body.lay-side .roster{display:grid}
body.lay-side .scene.stage{padding:20px 6px 4px;gap:4px;min-height:80px}
body.lay-side .stage .gnd{height:24%}
body.lay-side .stage .lay.far{bottom:24%}
body.lay-side .stage .lay.mid{bottom:23%}
body.lay-side .unit{width:auto;--us:clamp(30px,6vw,52px)}
body.lay-side .unit.big{--us:clamp(40px,8vw,68px)}
body.lay-side .rframe{padding:1px 4px 2px;gap:1px}
body.lay-side .rframe .umeta,body.lay-side .rframe .utags{display:none}
body.lay-side .ubar{height:12px}
body.lay-side .ubar span{font-size:15px;line-height:12px}
body.lay-side .rcol{gap:3px}
body.lay-side .blogline{height:1.3em}
body.lay-side .skgrid{grid-template-columns:1fr}
/* run map */
.map{position:relative;margin:6px 10px 20px 22px}
.mlines{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mlines line{stroke:#574b67;stroke-width:3;stroke-dasharray:6 6;stroke-linecap:round}
.mlines line.hot{stroke:var(--gold);stroke-dasharray:none;stroke-width:4}
.mlines line.past{stroke:#2e2838}
.mrow{position:absolute;left:-22px;transform:translateY(-50%);font-size:18px;color:var(--dim);font-variant-numeric:tabular-nums}
.mrow.now{color:var(--gold)}

/* phone (landscape): shorter stage, the unit bars live inside it, everything tighter */
body.lay-side .bscreen{grid-template-rows:auto auto clamp(120px,44dvh,260px) minmax(0,1fr)!important;grid-template-areas:"hdr hdr" "turn turn" "stage stage" "act log"!important;grid-template-columns:minmax(0,1fr) minmax(170px,32%)!important;gap:4px!important}
body.lay-side .bscreen .roster{display:none!important}
body.lay-side .bscreen .skgrid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
body.lay-side .bscreen .skgrid .btn{font-size:16px}body.lay-side .bscreen .skgrid .sub2{font-size:13px}
body.lay-side .bscreen .blogpanel{font-size:14px}
body.lay-side .bscreen .acthead .tinfo{display:none}
/* damage, heals and crits are drawn over the fighter so they never fall off the top of the stage */
.bscreen .marks{bottom:auto!important;top:4%;flex-wrap:wrap;justify-content:center;max-width:180%;row-gap:2px}
.bscreen .mark{font-size:22px}.bscreen .mark.crit{font-size:34px}

body.lay-side .bscreen .mark{font-size:17px}body.lay-side .bscreen .mark.crit{font-size:27px}

/* Computer: use the whole landscape window */
body.dev-pc .wrap{max-width:min(1680px,100%)}
body.dev-pc .townwrap{grid-template-columns:minmax(0,1fr) minmax(250px,270px)}
body.dev-pc .runlay{grid-template-columns:minmax(0,1fr) 380px}
body.dev-pc .iso{width:min(100%,calc((100dvh - 210px / var(--z,1)) * 326 / 214))}
.linkbtn{white-space:nowrap}
/* Phone (landscape): a slim header, the town and map sized to the short screen */
body.dev-phone{padding-inline:8px;padding-block:6px 20px}
body.dev-phone .wrap{max-width:none;gap:6px}
body.dev-phone .top{flex-wrap:nowrap;gap:6px}
body.dev-phone .top .logo{font-size:18px}body.dev-phone .top .logo small,body.dev-phone .top .sub{font-size:15px}
body.dev-phone .top .toplogo{width:26px;height:26px}
body.dev-phone .top .chip{font-size:16px;padding:0 5px}body.dev-phone .top .chip .lbl{display:none}
body.dev-phone .top .res{flex-wrap:nowrap;gap:4px}body.dev-phone .top .btn.small{font-size:16px;padding:1px 6px 3px}
body.dev-phone .govface img{width:26px;height:39px}
body.dev-phone .townwrap{grid-template-columns:minmax(0,1fr) minmax(230px,28%);gap:6px}
body.dev-phone .hrail{max-height:calc(100dvh / var(--z,1) - 70px)}
body.dev-phone .panel{padding:6px 8px}
body.dev-phone .iso{width:min(100%,calc((100dvh / var(--z,1) - 150px) * 326 / 214));min-width:0}
body.dev-phone .nextstep{padding:4px 10px}body.dev-phone .nextstep b{font-size:18px}
body.dev-phone .runlay{grid-template-columns:minmax(0,1fr) minmax(230px,34%);gap:6px}
body.dev-phone .partycol{max-height:calc(100dvh / var(--z,1) - 90px)}
body.dev-phone.onrun .top{display:none}
body.dev-phone .runhdr{padding:4px 8px}body.dev-phone .runhdr h2{font-size:18px}
body.dev-phone footer{display:none!important}
body.dev-phone .govsay{font-size:16px;line-height:1.25;padding:3px 8px;margin:0 0 6px;flex-wrap:nowrap}body.dev-phone .govsayface{display:none}body.dev-phone .govsaybtns .btn.small{font-size:15px;min-height:30px}

/* ---------- skill animations (see SK_FX) ---------- */
.skfx{position:absolute;inset:0;pointer-events:none;z-index:2;line-height:0}
/* weapon moves */
.wfx{position:absolute;inset:0;pointer-events:none;z-index:3;line-height:0}
.wfx i{position:absolute;display:block;opacity:0}
.fo.pose-slash{animation:poseSlash .5s cubic-bezier(.3,1.3,.5,1);transform-origin:50% 95%}
.fo.pose-slash.big{animation-duration:.6s}
@keyframes poseSlash{0%{transform:none}22%{transform:translateX(-8px) rotate(-7deg)}52%{transform:translateX(34px) rotate(7deg)}100%{transform:none}}
.c-warrior i:nth-child(1){right:-46%;top:-6%;width:80%;height:112%;border-radius:50%;border-right:10px solid var(--c);filter:drop-shadow(0 0 8px var(--c)) drop-shadow(0 0 3px #fff);animation:wSweep .4s .12s ease-out forwards}
.c-warrior i:nth-child(2){right:-38%;top:-4%;width:68%;height:108%;border-radius:50%;border-right:4px solid #ffffffcc;animation:wSweep .4s .18s ease-out forwards}
@keyframes wSweep{0%{opacity:0;transform:translateX(-10px) rotate(-75deg)}25%{opacity:1}100%{opacity:0;transform:translateX(22px) rotate(55deg)}}
.t-warrior i:nth-child(1){left:6%;top:48%;width:88%;height:6px;background:linear-gradient(90deg,transparent,#fff 45%,#fff 55%,transparent);box-shadow:0 0 8px #fff;transform:rotate(-38deg) scaleX(0);animation:wCut .38s .22s ease-out forwards}
.t-warrior i:nth-child(2){left:6%;top:48%;width:88%;height:2px;background:#fff;transform:rotate(-38deg) scaleX(0);animation:wCut .3s .3s ease-out forwards}
@keyframes wCut{0%{opacity:1;transform:rotate(-38deg) scaleX(0)}45%{opacity:1;transform:rotate(-38deg) scaleX(1)}100%{opacity:0;transform:rotate(-38deg) scaleX(1.1)}}
.fo.pose-bow{animation:poseBow .6s ease-out}
@keyframes poseBow{0%{transform:none}40%,56%{transform:translateX(-12px) rotate(-4deg)}64%{transform:translateX(5px) rotate(1deg)}100%{transform:none}}
.c-archer i:nth-child(1),.c-archer i:nth-child(2){right:17%;width:4px;height:31%;background:#fff;box-shadow:0 0 6px #fff,0 0 2px #000}
.c-archer i:nth-child(1){top:18%;transform-origin:50% 0;animation:bowTop .6s ease-out forwards}
.c-archer i:nth-child(2){top:49%;transform-origin:50% 100%;animation:bowBot .6s ease-out forwards}
@keyframes bowTop{0%{opacity:1;transform:none}48%{opacity:1;transform:rotate(38deg)}58%{opacity:1;transform:none}100%{opacity:0}}
@keyframes bowBot{0%{opacity:1;transform:none}48%{opacity:1;transform:rotate(-38deg)}58%{opacity:1;transform:none}100%{opacity:0}}
.c-archer i:nth-child(3){right:-4%;top:47%;width:34%;height:4px;box-shadow:0 0 5px #fff;background:linear-gradient(90deg,transparent,var(--c) 40%,#fff);animation:bowArrow .6s ease-in forwards}
@keyframes bowArrow{0%,55%{opacity:0;transform:none}60%{opacity:1}100%{opacity:0;transform:translateX(70px)}}
.t-archer i:nth-child(1){left:-30%;top:46%;width:80%;height:3px;background:linear-gradient(90deg,transparent,#fff3dc 60%,#fff);box-shadow:0 0 6px #fff3dc;animation:skStreak .3s .32s ease-in forwards}
.t-archer i:nth-child(2){left:40%;top:40%;width:26%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,#fff3dc 45%,transparent 72%);animation:skBurst .35s .55s ease-out forwards}
.fo.pose-staff{animation:poseStaff .55s ease-out;transform-origin:50% 92%}
@keyframes poseStaff{0%{transform:none}30%{transform:translateX(-5px) rotate(-9deg)}62%{transform:translateX(10px) rotate(8deg)}100%{transform:none}}
.c-mage i:nth-child(1){right:-30%;top:-4%;width:56%;height:70%;border-radius:50%;border-top:4px solid var(--c);border-right:4px solid transparent;filter:drop-shadow(0 0 5px var(--c));animation:wSweep .32s .1s ease-out forwards}
.c-mage i:nth-child(2){right:-8%;top:6%;width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 38%,#ffffffaa 55%,transparent 74%);box-shadow:0 0 14px #fff,0 0 22px var(--c);animation:orbShort .62s .2s ease-out forwards}
@keyframes orbShort{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:translateX(64px) scale(.85)}100%{opacity:0;transform:translateX(84px) scale(.4)}}
.c-mage i:nth-child(3){right:4%;top:2%;width:14%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,var(--c) 55%,transparent 72%);animation:skBurst .35s ease-out forwards}
.t-mage i:nth-child(1){left:30%;top:34%;width:40%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,#ffffffaa 42%,transparent 70%);animation:skBurst .4s .5s ease-out forwards;mix-blend-mode:screen}
.mark.skname{color:#fff;background:#2e2440e6;box-shadow:0 0 0 1px #9b70dc;font-size:16px}
body.nomotion .wfx{display:none}
/* targeting */
@keyframes tgtPulse{50%{opacity:.55}}
.unit.foe[data-a="target"]{cursor:pointer}
.unit.foe[data-a="target"]:not(.tgt):hover .fo::after{content:"";position:absolute;left:10%;right:10%;bottom:3px;height:4px;background:#ffd84a88;border-radius:2px}
.unit.foe.noreach .fo{filter:grayscale(.6) brightness(.65)}
.skfx i{position:absolute;display:block;opacity:0}
.skfx::before,.skfx::after{content:"";position:absolute;opacity:0}
.lunge-big{animation:lungeBig .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes lungeBig{0%{transform:none}25%{transform:translateX(-8px) translateY(-4px)}55%{transform:translateX(38px) translateY(-6px)}100%{transform:none}}
.castpose{animation:castPose .6s ease-out}
@keyframes castPose{0%{transform:none}30%{transform:translateY(-8px)}100%{transform:none}}
@keyframes skIn{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes skRing{0%{transform:translate(-50%,-50%) scale(.15);opacity:1}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
@keyframes skRise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
@keyframes skBurst{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
@keyframes skSpin{0%{transform:translate(-50%,-50%) rotate(0) scale(.5);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-50%) rotate(260deg) scale(1.15);opacity:0}}
/* melee: slashes, smashes, the Titan's golden X, the ground-shaking quake */
.t-slash::before,.t-smash::before,.t-titan::before,.t-titan::after{left:-15%;top:46%;width:130%;height:7px;background:linear-gradient(90deg,transparent,#fff 30%,var(--c) 60%,transparent);box-shadow:0 0 10px var(--c);animation:skSlash .45s ease-out forwards}
.t-smash::before{animation-name:skSlashDown}
.t-titan::after{animation-name:skSlashB;animation-delay:.12s}
@keyframes skSlash{0%{transform:rotate(-35deg) scaleX(0);opacity:1}45%{transform:rotate(-35deg) scaleX(1);opacity:1}100%{transform:rotate(-35deg) scaleX(1.1);opacity:0}}
@keyframes skSlashB{0%{transform:rotate(35deg) scaleX(0);opacity:1}45%{transform:rotate(35deg) scaleX(1);opacity:1}100%{transform:rotate(35deg) scaleX(1.1);opacity:0}}
@keyframes skSlashDown{0%{transform:rotate(-70deg) scaleX(0);opacity:1}45%{transform:rotate(-70deg) scaleX(1);opacity:1}100%{transform:rotate(-70deg) scaleX(1.1);opacity:0}}
.t-smash::after,.t-titan i:nth-child(1){left:50%;top:50%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--c) 35%,transparent 70%);animation:skBurst .5s .15s ease-out forwards;mix-blend-mode:screen}
.t-titan i:nth-child(2){left:50%;top:92%;width:160%;height:26%;border-radius:50%;border:4px solid var(--c);animation:skRing .6s .2s ease-out forwards}
.v-stunblow i:nth-child(1),.v-stunblow i:nth-child(2),.v-stunblow i:nth-child(3){top:-6%;width:10px;height:10px;background:#ffe66a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:skStar .8s .2s ease-out forwards}
.v-stunblow i:nth-child(1){left:20%}.v-stunblow i:nth-child(2){left:46%;animation-delay:.28s}.v-stunblow i:nth-child(3){left:72%;animation-delay:.36s}
@keyframes skStar{0%{opacity:0;transform:translateY(8px) scale(.4)}30%{opacity:1;transform:translateY(0) scale(1.3) rotate(90deg)}100%{opacity:0;transform:translateY(-10px) rotate(260deg)}}
.v-coup::before{background:linear-gradient(90deg,transparent,#fff 30%,#c4463f 60%,transparent);box-shadow:0 0 12px #c4463f}
.t-quake::before{left:50%;top:94%;width:170%;height:30%;border-radius:50%;border:4px solid var(--c);box-shadow:0 0 10px var(--c);animation:skRing .6s ease-out forwards}
.t-quake i{bottom:2%;width:9px;height:9px;background:var(--c);box-shadow:inset -2px -2px 0 #0006;animation:skRock .6s ease-out forwards}
.t-quake i:nth-child(1){left:12%}.t-quake i:nth-child(2){left:38%;animation-delay:.05s}.t-quake i:nth-child(3){left:62%;animation-delay:.1s}.t-quake i:nth-child(4){left:84%;animation-delay:.03s}
@keyframes skRock{0%{transform:translateY(0);opacity:1}45%{transform:translateY(-40px) rotate(120deg);opacity:1}100%{transform:translateY(0) rotate(240deg);opacity:0}}
.c-melee::before{right:-8%;top:18%;width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--c) 40%,transparent 70%);animation:skIn .35s .1s ease-out forwards;mix-blend-mode:screen}
.c-melee::after{left:-10%;bottom:0;width:120%;height:14%;background:radial-gradient(ellipse,#ffffff55,transparent 70%);animation:skIn .4s forwards}
/* arrows: a streak flying in, sniper crosshairs, and arrow rain */
.t-shot::before,.t-snipe::before,.t-shot i:nth-child(1){left:-40%;top:46%;width:90%;height:4px;background:linear-gradient(90deg,transparent,var(--c) 60%,#fff);box-shadow:0 0 6px var(--c);animation:skStreak .32s ease-in forwards}
.t-shot i:nth-child(1){display:none;top:34%}.v-double i:nth-child(1){display:block;animation-delay:.14s}
.v-cripple::before{background:linear-gradient(90deg,transparent,#8fcf6f 60%,#fff)}
@keyframes skStreak{0%{transform:translateX(-120%);opacity:1}85%{transform:translateX(40%);opacity:1}100%{transform:translateX(50%);opacity:0}}
.t-shot::after,.t-snipe::after{left:50%;top:48%;width:55%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--c) 38%,transparent 70%);animation:skBurst .4s .28s ease-out forwards;mix-blend-mode:screen}
.t-snipe::before{animation-delay:.3s}.t-snipe::after{animation-delay:.58s;width:80%}
.t-snipe i:nth-child(1){left:50%;top:48%;width:70%;aspect-ratio:1;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 6px var(--c);transform:translate(-50%,-50%);animation:skAim .55s ease-out forwards}
.t-snipe i:nth-child(2),.t-snipe i:nth-child(3){left:50%;top:48%;background:var(--c);animation:skAimLine .55s ease-out forwards}
.t-snipe i:nth-child(2){width:100%;height:2px;transform:translate(-50%,-50%)}.t-snipe i:nth-child(3){width:2px;height:100%;transform:translate(-50%,-50%)}
@keyframes skAim{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}40%{opacity:1}75%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.8);opacity:0}}
@keyframes skAimLine{0%{opacity:0}40%{opacity:.9}90%{opacity:.9}100%{opacity:0}}
.t-rain i{top:-10%;width:3px;height:32%;background:linear-gradient(transparent,var(--c) 60%,#fff);box-shadow:0 0 4px var(--c);animation:skFall .38s ease-in forwards}
.t-rain i:nth-child(1){left:18%}.t-rain i:nth-child(2){left:42%;animation-delay:.1s}.t-rain i:nth-child(3){left:64%;animation-delay:.05s}.t-rain i:nth-child(4){left:84%;animation-delay:.16s}
.t-rain::after{left:50%;top:70%;width:100%;height:30%;border-radius:50%;background:radial-gradient(ellipse,var(--c),transparent 70%);animation:skIn .5s .2s forwards;mix-blend-mode:screen}
@keyframes skFall{0%{transform:translateY(-80px);opacity:1}85%{transform:translateY(60px);opacity:1}100%{transform:translateY(70px);opacity:0}}
.c-bow::before{right:-14%;top:30%;width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,var(--c) 35%,transparent 70%);animation:skIn .4s ease-out forwards;mix-blend-mode:screen}
.c-bow::after{right:-6%;top:22%;width:6px;height:56%;background:var(--c);box-shadow:0 0 8px var(--c);animation:skIn .35s forwards}
/* spells: bolts, storms, chain lightning, hexes, life drain */
.t-blast::before{left:0;top:40%;width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,var(--c) 50%,transparent 72%);box-shadow:0 0 14px var(--c);animation:skOrb .34s ease-in forwards}
@keyframes skOrb{0%{transform:translateX(-260%) scale(.7);opacity:1}100%{transform:translateX(120%) scale(1.1);opacity:1}}
.t-blast::after,.t-storm::after{left:50%;top:50%;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,var(--c) 38%,transparent 70%);animation:skBurst .55s .3s ease-out forwards;mix-blend-mode:screen}
.v-combo i:nth-child(1),.t-storm i:nth-child(1){left:50%;top:50%;width:110%;aspect-ratio:1;border-radius:50%;border:3px dashed var(--c);animation:skSpin .8s ease-out forwards}
.t-storm::before{left:-20%;top:-10%;width:140%;height:120%;background:radial-gradient(ellipse,var(--c),transparent 65%);animation:skIn .7s forwards;mix-blend-mode:screen}
.t-storm::after{animation-delay:.15s}
.t-storm i:nth-child(2),.t-storm i:nth-child(3),.t-storm i:nth-child(4){width:8px;height:8px;background:var(--c);box-shadow:0 0 6px var(--c);animation:skRise .7s ease-out forwards}
.t-storm i:nth-child(2){left:20%;top:70%}.t-storm i:nth-child(3){left:70%;top:60%;animation-delay:.1s}.t-storm i:nth-child(4){left:45%;top:80%;animation-delay:.2s}
.v-cataclysm::before{background:radial-gradient(ellipse,#fff,var(--c) 30%,transparent 70%)}.v-cataclysm i:nth-child(1){border-width:5px}
.t-lightning::before{left:30%;top:-40%;width:40%;height:120%;background:var(--c);box-shadow:0 0 12px var(--c);clip-path:polygon(40% 0,70% 0,52% 38%,78% 38%,30% 100%,44% 52%,20% 52%);animation:skFlick .5s steps(1) forwards}
.t-lightning::after{left:50%;top:50%;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,var(--c) 38%,transparent 70%);animation:skBurst .45s .1s ease-out forwards;mix-blend-mode:screen}
@keyframes skFlick{0%{opacity:1}20%{opacity:.2}35%{opacity:1}60%{opacity:.4}75%{opacity:1}100%{opacity:0}}
.t-hex::before{left:50%;top:55%;width:120%;aspect-ratio:1;border-radius:50%;border:3px dashed var(--c);box-shadow:0 0 10px var(--c),inset 0 0 10px var(--c);animation:skSpin .9s ease-out forwards}
.t-hex::after{inset:0;background:radial-gradient(circle,color-mix(in srgb,var(--c) 60%,transparent),transparent 65%);animation:skIn .8s forwards;mix-blend-mode:screen}
.t-hex i{width:9px;height:9px;border:2px solid var(--c);transform:rotate(45deg);animation:skRise .8s ease-out forwards}
.t-hex i:nth-child(1){left:15%;top:60%}.t-hex i:nth-child(2){left:75%;top:50%;animation-delay:.15s}.t-hex i:nth-child(3){left:45%;top:75%;animation-delay:.3s}.t-hex i:nth-child(4){display:none}
.t-drain::after{inset:0;background:radial-gradient(circle,color-mix(in srgb,var(--c) 70%,transparent),transparent 65%);animation:skIn .8s forwards}
.t-drain i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px #d9a8ff;animation:skPull .75s ease-in forwards}
.t-drain i:nth-child(1){left:40%;top:30%}.t-drain i:nth-child(2){left:55%;top:55%;animation-delay:.12s}.t-drain i:nth-child(3){left:35%;top:70%;animation-delay:.24s}.t-drain i:nth-child(4){left:60%;top:40%;animation-delay:.36s}
@keyframes skPull{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-110px,-10px) scale(.3);opacity:0}}
.c-cast::before{left:50%;top:96%;width:130%;height:26%;border-radius:50%;border:3px dashed var(--c);box-shadow:0 0 8px var(--c);transform:translate(-50%,-50%);animation:skIn .7s forwards}
.c-cast::after{right:-12%;top:-2%;width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,var(--c) 38%,transparent 70%);animation:skPulse .7s ease-out forwards;mix-blend-mode:screen}
@keyframes skPulse{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.2);opacity:1}50%{transform:scale(.9)}75%{transform:scale(1.1);opacity:1}100%{transform:scale(1.4);opacity:0}}
/* heals and revives: light gathers in the hands, then sparkles rise from whoever is healed */
.c-heal::after{left:50%;top:55%;width:70%;aspect-ratio:1;margin:-35% 0 0 -35%;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#ffe9a0 28%,var(--c) 45%,transparent 70%);animation:skPulse .85s ease-out forwards;mix-blend-mode:screen}
.c-heal::before{left:25%;top:-30%;width:50%;height:130%;background:linear-gradient(to top,transparent,#fff5c8aa 40%,transparent);animation:skIn .8s forwards;mix-blend-mode:screen}
.t-heal::before{inset:-10%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 70%,transparent),transparent 65%);animation:skIn .9s forwards;mix-blend-mode:screen}
.t-heal i{width:8px;height:8px;background:#eaffd8;box-shadow:0 0 6px var(--c);clip-path:polygon(38% 0,62% 0,62% 38%,100% 38%,100% 62%,62% 62%,62% 100%,38% 100%,38% 62%,0 62%,0 38%,38% 38%);animation:skRise .9s ease-out forwards}
.t-heal i:nth-child(1){left:18%;top:70%}.t-heal i:nth-child(2){left:62%;top:78%;animation-delay:.12s}.t-heal i:nth-child(3){left:40%;top:60%;animation-delay:.24s}.t-heal i:nth-child(4){left:78%;top:55%;animation-delay:.36s}

<body>
<div class="wrap" id="app"></div>

<script>
(()=>{
/* ---------- crash guard: if anything throws, show what happened and a way out instead of a frozen page ---------- */
let crashShown=false;
function showCrash(msg){
  if(crashShown)return;crashShown=true;
  try{
    const d=document.createElement('div');
    d.setAttribute('role','alertdialog');
    d.style.cssText='position:fixed;inset:0;z-index:9999;background:#000d;display:flex;align-items:center;justify-content:center;padding:16px;font:20px DsBody,monospace;color:#e4d8c1';
    d.innerHTML=`<div style="max-width:520px;width:100%;background:#1c1823;box-shadow:0 0 0 2px #060509,inset 0 0 0 2px #c4463f;padding:16px;display:flex;flex-direction:column;gap:10px">
      <b style="font-size:26px;color:#f0a070">Something went wrong</b>
      <span>The game hit an error. Your town is saved. Try one of these:</span>
      <code style="font-size:15px;color:#9a8fa4;word-break:break-word;max-height:120px;overflow:auto">${String(msg).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]).slice(0,600)}</code>
      <button data-c="reload" style="font:inherit;padding:6px;background:#4a3513;color:#ffe7ae;border:0;box-shadow:inset 0 0 0 2px #e3b341;cursor:pointer">Reload the game</button>
      <button data-c="town" style="font:inherit;padding:6px;background:#262030;color:#e4d8c1;border:0;box-shadow:inset 0 0 0 2px #574b67;cursor:pointer">Return to town (ends the current adventure, heroes come home)</button>
      <button data-c="close" style="font:inherit;padding:6px;background:#262030;color:#e4d8c1;border:0;box-shadow:inset 0 0 0 2px #574b67;cursor:pointer">Close this and keep playing</button></div>`;
    d.addEventListener('click',ev=>{const c=ev.target.dataset&&ev.target.dataset.c;if(!c)return;
      if(c==='close'){d.remove();crashShown=false;return}
      if(c==='town'){try{if(state&&state.run){state.run=null;state.screen='town';state.tab='town';save()}}catch(e){}}
      location.reload()});
    document.body.appendChild(d);
  }catch(e){}
}
window.addEventListener('error',e=>showCrash((e.error&&e.error.stack)||e.message||'Unknown error'));
window.addEventListener('unhandledrejection',e=>showCrash((e.reason&&e.reason.stack)||e.reason||'Unknown error'));
/* ---------- utils ---------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Math.random().toString(36).slice(2,10);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const fmt=n=>Math.round(n).toLocaleString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function weighted(o){let t=0;for(const k in o)t+=o[k];let r=Math.random()*t;for(const k in o){r-=o[k];if(r<0)return k}return Object.keys(o)[0]}

/* ---------- 2.5D pixel renderer ----------
   Everything is drawn into small rasters and scaled up with nearest-neighbor, so edges stay crisp. */
const hexRgb=h=>{h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]};
const lit=(c,f)=>f>=0?c.map(v=>v+(255-v)*f):c.map(v=>v*(1+f));
const mixc=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const hsh=(x,y)=>{let n=(x|0)*374761393+(y|0)*668265263;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295};
function Raster(w,h){this.w=w;this.h=h;this.d=new Uint8ClampedArray(w*h*4)}
Raster.prototype.set=function(x,y,c,a){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;const i=(y*this.w+x)*4;this.d[i]=c[0];this.d[i+1]=c[1];this.d[i+2]=c[2];this.d[i+3]=a==null?255:a};
Raster.prototype.get=function(x,y){const i=(y*this.w+x)*4;return this.d[i+3]?[this.d[i],this.d[i+1],this.d[i+2]]:null};
Raster.prototype.poly=function(P,f){
  const ys=P.map(p=>p[1]),y0=Math.floor(Math.min(...ys)),y1=Math.ceil(Math.max(...ys));
  for(let y=y0;y<y1;y++){const yy=y+.5,xs=[];
    for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];if((a[1]<=yy&&b[1]>yy)||(b[1]<=yy&&a[1]>yy))xs.push(a[0]+(yy-a[1])*(b[0]-a[0])/(b[1]-a[1]))}
    xs.sort((a,b)=>a-b);for(let k=0;k+1<xs.length;k+=2)for(let x=Math.round(xs[k]);x<Math.round(xs[k+1]);x++)this.set(x,y,f(x,y))}
};
// Warm light: pulls lit pixels toward a color, fading with distance.
Raster.prototype.glow=function(cx,cy,r,c,s){
  for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){
    if(x<0||y<0||x>=this.w||y>=this.h)continue;const d=Math.hypot(x-cx,y-cy)/r;if(d>=1)continue;
    const i=(y*this.w+x)*4;if(!this.d[i+3])continue;const t=s*(1-d)*(1-d);
    this.d[i]+=(c[0]-this.d[i])*t;this.d[i+1]+=(c[1]-this.d[i+1])*t;this.d[i+2]+=(c[2]-this.d[i+2])*t}
};
Raster.prototype.url=function(){const c=document.createElement('canvas');c.width=this.w;c.height=this.h;const x=c.getContext('2d'),im=x.createImageData(this.w,this.h);im.data.set(this.d);x.putImageData(im,0,0);return c.toDataURL()};
// Copies a palette sprite into a raster at 1:1.
function blit(R,name,tint,x0,y0){const rows=SPR[name];rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')R.set(x0+x,y0+y,ch==='A'?hexRgb(tint||'#888'):hexRgb(PAL[ch]))}))}
const texWall=(base,f)=>(x,y)=>{let c=lit(base,f);const n=hsh(x,y);if(y%3===0)c=lit(c,-.18);else if((x+(Math.floor(y/3)%2)*2)%5===0)c=lit(c,-.1);if(n<.08)c=lit(c,-.15);else if(n>.95)c=lit(c,.12);return c};
const texRoof=(base,f)=>(x,y)=>{let c=lit(base,f);if(y%2===0)c=lit(c,-.16);if(hsh(x,y)<.1)c=lit(c,.1);return c};

/* ---------- pixel sprites ---------- */
const PAL={k:'#0a0810',S:'#a3a7b3',W:'#efe6d2',B:'#4b3a2c',F:'#d6a47e',G:'#e3b341',R:'#b83a3a',o:'#9fd6ff',b:'#8c6a3c',D:'#241d2c'};
const SPR={
warrior:["....kkkk....","...kSSSSk...","...kSkkSk..W","...kSSSSk.kW","..kkkAAkkk.W",".kSAAAAAASkW",".kSkAAAAkSkk",".kk.AAAA.kk.","....kAAk....","...kBk.kBk..","...kBk.kBk..","..kkk..kkk.."],
archer:["....kkkk....","...kAAAAk...","..kAFFFFAk..","..kAFkFkAk.b","...kFFFFk.kb","..kkAAAAkk.b",".kFAAAAAAFkb",".k.kAAAAk.kb","...kBBBBk..b","...kBk.kBk..","...kBk.kBk..","..kkk..kkk.."],
mage:[".....kk.....","....kAAk...o","...kAAAAk.ko","..kAAAAAAkk.",".kkkkkkkkkkS","...kFkFkk..S","...kFFFFk..S","..kAAAAAAk.S",".kAAAAAAAAkS",".kAAAAAAAAk.","..kAAAAAAk..","..kkkkkkkk.."],
bat:["............","............","k..........k","kk..kkkk..kk","kAk.kAAk.kAk","kAAkAWWAkAAk","kAAAAAAAAAAk",".kAAkAAkAAk.","..kk.kk.kk..","............","............","............"],

const sprCache={};
function sprite(name,tint,scale=4,cls=''){
  const key=name+'|'+tint;
  if(!sprCache[key]){
    // Drawn at 2× with light from above, shadow below and a cool moonlight rim on the right.
    const rows=SPR[name],w=rows[0].length,h=rows.length,Rs=new Raster(w*2,h*2);
    const at=(x,y)=>y<0||y>=h||x<0||x>=w?'.':rows[y][x],edge=ch=>ch==='.'||ch==='k';
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=at(x,y);if(ch==='.')continue;
      if(ch==='k'){for(const [dx,dy] of [[0,0],[1,0],[0,1],[1,1]])Rs.set(2*x+dx,2*y+dy,[10,8,16]);continue}
      const base=hexRgb(ch==='A'?(tint||'#888'):PAL[ch]);let tl=base,tr=base,bl=base,br=base;
      if(edge(at(x,y-1))){tl=lit(tl,.24);tr=lit(tr,.2)}
      if(edge(at(x-1,y))){tl=lit(tl,.12);bl=lit(bl,.06)}
      if(edge(at(x,y+1))){bl=lit(bl,-.3);br=lit(br,-.32)}
      if(edge(at(x+1,y))){tr=mixc(tr,[170,190,255],.3);br=mixc(br,[150,170,240],.24)}
      if(!edge(at(x,y-1))&&!edge(at(x,y+1))&&(x+y)%2===0)br=lit(br,-.07);
      Rs.set(2*x,2*y,tl);Rs.set(2*x+1,2*y,tr);Rs.set(2*x,2*y+1,bl);Rs.set(2*x+1,2*y+1,br)}
    sprCache[key]={url:Rs.url(),w,h};
  }
  const s=sprCache[key];
  return `<img class="px ${cls}" src="${s.url}" width="${s.w*scale}" height="${s.h*scale}" alt="">`;
}

/* Serpents: a coil on the ground and a neck that rears up and strikes. */
DRAW.serpent=(S,fr)=>{
  const g=new ART.Grid(32,32),F=S.feat,atk=fr===2,hurt=fr===3,br=fr===1;
  const thick=F==='magma'?3.4:F==='eel'?2.8:3;
  const sway=br?1:0;
  // the coil: two stacked rings and a tail tip
  const ring=(cx,cy,rx,ry,t)=>{for(let k=0;k<64;k++){const a=k/64*Math.PI*2;g.ell(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,t,t*.9,'A')}};
  if(F!=='eel'&&F!=='cloud'){ring(17,26.5,8.5,2.6,thick*.85);ring(18,23,6,2,thick*.8);g.line(25,27,30,29,'A',0,2);g.px(31,29,'A')}
  // the neck: from the back of the coil up to the head
  let pts=[[21,21],[23,17],[22,13],[18,10],[14,10]];
  if(atk)pts=[[21,21],[20,17],[16,14],[11,13],[6,14]];

  pts=pts.map(([x,y],k)=>[x+(k>1?sway*.5:0),y-(k>1?sway:0)]);
  if(F==='eel'||F==='cloud'){const lift=F==='eel'?2:0;const tail=[[30,26],[26,28],[21,27],[17,24],[17,21-lift]];pts=tail.concat(pts.slice(1)).map(([x,y],k)=>[x,y-lift+Math.sin(k*1.1+fr)*.8])}
  const body=(m,th)=>{for(let k=0;k+1<pts.length;k++){const [x0,y0]=pts[k],[x1,y1]=pts[k+1],t=th*(F==='eel'||F==='cloud'?(k<2?.55+k*.2:1):1);for(let s=0;s<=1;s+=.1)g.ell(x0+(x1-x0)*s,y0+(y1-y0)*s,t,t*.95,m)}};
  if(F==='eel'){for(let k=2;k<pts.length-1;k++){const [x,y]=pts[k];g.poly([[x-1.5,y-thick+.5],[x,y-thick-2.5],[x+1.5,y-thick+.5]],'C')}}
  body('A',thick);
  // belly stripe along the inner side
  for(let k=0;k+1<pts.length;k++){const [x0,y0]=pts[k],[x1,y1]=pts[k+1];for(let s=0;s<=1;s+=.1){const x=x0+(x1-x0)*s,y=y0+(y1-y0)*s;g.px(x-thick*.6,y+thick*.3,'b')}}
  if(F!=='eel'&&F!=='cloud')g.paint((x,y)=>y>=28&&x>9&&x<26,'A','b');

  if(atk){g.poly([[hx-7,hy+2],[hx-2,hy+2],[hx-2,hy+5],[hx-6,hy+4]],'m');g.px(hx-6,hy+2,'w');g.px(hx-4,hy+2,'w');g.px(hx-6,hy+4,'w');
    if(F!=='eel'){g.line(hx-8,hy+3,hx-11,hy+4,'t');g.line(hx-11,hy+4,hx-12,hy+3,'t');g.line(hx-11,hy+4,hx-12,hy+5,'t')}}
  else g.line(hx-6,hy+1.5,hx-2,hy+2,'m');
  if(hurt){g.px(hx-3,hy-1,'k0');g.px(hx-2,hy,'k0')}else{g.px(hx-3,hy-1,'E');g.px(hx-2,hy-1,'E')}
  // features
  if(F==='ice'){for(let k=0;k<4;k++){const x=hx+k*1.4,y=hy-2.5;g.poly([[x-1,y],[x+.5,y-3-(k%2)*1.5],[x+1.5,y]],'C')}g.paint((x,y)=>(x+y)%4===0,'A','a')}
  if(F==='magma'){g.poly([[hx-1,hy-2],[hx+2,hy-6],[hx+2,hy-2]],'h');g.poly([[hx+1,hy-1],[hx+5,hy-4],[hx+4,hy]],'h');g.paint((x,y)=>(x*3+y*5)%9===0,'A','a');
    g.paint((x,y)=>true,'b','C');if(atk){g.line(hx-12,hy+3,hx-15,hy+2,'G');g.px(hx-14,hy+5,'C');g.paint((x,y)=>true,'t','G')}}
  if(F==='cloud'){g.line(hx-6,hy+1,hx-10,hy+5-(fr%2),'w');g.line(hx-5,hy-1,hx-9,hy-3+(fr%2),'w');g.poly([[hx,hy-2],[hx+4,hy-5],[hx+3,hy-1]],'C');
    for(const [x,y] of [[9,27],[22,29],[26,22]]){g.ell(x,y,3.4,1.7,'w');g.ell(x+3,y-.5,2.2,1.4,'w')}g.paint((x,y)=>(x+y*2)%5===0,'A','a')}
  if(F==='vine'){g.paint((x,y)=>(x+y)%3===0,'A','a');for(const [x,y] of [[12,24],[22,22],pts[2]]){g.ell(x+2,y-3,1.6,1,'L');g.px(x+1,y-2,'a')}g.ell(hx+2,hy-3,1.8,1.8,'F');g.px(hx+2,hy-3,'G')}
  if(F==='dune'){g.paint((x,y)=>((x+y)%6===0||(x-y+60)%6===0),'A','a');g.poly([[hx-3,hy-2],[hx-2,hy-5],[hx-1,hy-2]],'h')}
  if(F==='eel'){if(!hurt){g.line(hx-3,hy-3,hx-6,hy-7,'a');g.ell(hx-7,hy-8,1.2,1.2,'G')}g.paint((x,y)=>(x*5+y*3)%13===0,'A','G')}

/* The walking dead: skeletons, each marked by how it died. */
DRAW.skeleton=(S,fr)=>{
  const g=new ART.Grid(32,32),F=S.feat,atk=fr===2,hurt=fr===3,br=fr===1;
  const bx=atk?-2:hurt?2:0,by=br?1:0,cx=16+bx;

  for(const [lx,m] of [[cx+2,'a'],[cx-2,'A']]){g.line(lx,20+by,lx-(m==='A'&&atk?2:0),25,m,0,2);g.line(lx-(m==='A'&&atk?2:0),25,lx-(m==='A'&&atk?2:0),28,m,0,1);g.rect(lx-1-(m==='A'&&atk?2:0),29,3,1,m)}
  // pelvis + spine + ribs
  g.ell(cx,19.5+by,3.2,1.6,'A');g.line(cx,18+by,cx,10+by,'A',0,2);
  for(let k=0;k<4;k++){const y=11+k*2+by,w=4.5-k*.6;g.line(cx-w,y,cx+w,y,'A');g.px(cx-w,y+1,'a');g.px(cx+w,y+1,'a')}
  g.paint((x,y)=>y>=11+by&&y<=18+by&&x!==cx&&x!==cx+1&&(y-by)%2===0,null,'');
  g.line(cx,10+by,cx,18+by,'A');
  // skull
  const sx=cx-1+(atk?-1:hurt?1:0),sy=6+by+(hurt?-1:0);
  g.ell(sx,sy,3.4,3.2,'A');g.rect(sx-2,sy+2,4,2,'A');
  if(hurt){g.px(sx-2,sy,'k0');g.px(sx+1,sy,'k0')}else{g.rect(sx-2,sy,2,2,'D');g.rect(sx+1,sy,2,2,'D');g.px(sx-2,sy,'E');g.px(sx+1,sy,'E')}
  g.px(sx-1,sy+2,'D');g.line(sx-2,sy+3,sx+1,sy+3,'D');if(atk)g.line(sx-2,sy+4,sx+1,sy+4,'D');
  // arms
  const sh=[cx-4,11+by],el=atk?[cx-8,10+by]:[cx-6,15+by],hd=atk?[cx-12,10+by]:[cx-7,19+by];
  g.line(cx+4,11+by,cx+6,16+by,'a');g.line(cx+6,16+by,cx+5,20+by,'a');
  // weapon
  if(F==='bandit'){const tip=atk?[hd[0]-6,hd[1]-1]:[hd[0]-1,hd[1]-8];g.line(hd[0]+1,hd[1]+1,tip[0]+1,tip[1]+1,'K',0,2);g.line(hd[0],hd[1],tip[0],tip[1],'S',0,2);g.px(tip[0],tip[1],'h')}
  if(F==='frozen'||F==='rooted'||F==='charred'){}
  g.line(sh[0],sh[1],el[0],el[1],'A');g.line(el[0],el[1],hd[0],hd[1],'A');g.px(hd[0]-1,hd[1]+1,'A');g.px(hd[0],hd[1]+1,'A');
  // how they died
  if(F==='frozen'){g.ell(cx+5,10+by,2.6,2,'C');g.ell(sx+1,sy-3,2.4,1.2,'C');g.poly([[cx-3,20+by],[cx-1,25],[cx+1,20+by]],'C');g.px(hd[0],hd[1]+2,'C')}
  if(F==='charred'){g.paint(()=>true,'A','a');g.paint((x,y)=>(x*5+y*3)%7===0,'a','A');g.ell(cx,14+by,2,2,'C');g.px(cx,14+by,'G');if(!hurt)for(let k=0;k<3;k++)g.px(cx-6+((k*7+fr*3)%13),3+((k*5+fr*2)%6),'C')}
  if(F==='struck'){g.line(sx-1,sy-3,sx+1,sy-1,'C');g.line(cx-2,12+by,cx+1,15+by,'C');g.line(cx+1,15+by,cx-1,17+by,'C');for(const dx of [-3,-1,1,3])g.line(sx+dx,sy-3,sx+dx*1.5,sy-6-(fr%2),'h');if(!hurt){g.px(cx+8,8+fr,'C');g.px(cx-9,6-fr,'C')}}
  if(F==='rooted'){g.paint((x,y)=>(x+y)%4===0,'A','L');g.line(cx-1,20+by,cx-5,29,'R');g.line(cx+1,20+by,cx+6,29,'R');g.line(cx-4,12+by,cx+4,16+by,'R');g.ell(sx+2,sy-3,1.8,1.4,'L');g.ell(sx+3,sy-4,1,1,'F')}
  if(F==='bandit'){g.rect(sx-3,sy-3,7,2,'r');g.px(sx+4,sy-2,'r');g.px(sx+5,sy-1,'r');g.rect(cx-4,19+by,8,2,'b')}
  if(F==='unlit'){g.poly([[sx-4,sy-1],[sx,sy-6],[sx+4,sy-1],[sx+4,sy+3],[sx-4,sy+3]],'D');g.ell(sx,sy+1,3,3,'A');g.rect(sx-2,sy,2,2,'D');g.rect(sx+1,sy,2,2,'D');if(!hurt){g.px(sx-2,sy,'E');g.px(sx+1,sy,'E')}
    if(!hurt){g.line(hd[0],hd[1],hd[0],hd[1]-4,'w');g.px(hd[0],hd[1]-5,'G');g.px(hd[0],hd[1]-6,'C')}}
  return g;
};

    if(c[1]<ISO.horizon+(hsh(gx*7,gy*3)-.5)*6)continue;

DRAW.villager=(type,fr)=>{
  const g=new ART.Grid(16,20),step=fr===1,cx=8;
  const child=type==='child',top=child?6:2;
  // legs
  if(type==='woman'){g.poly([[cx-4,11],[cx+4,11],[cx+5,18],[cx-5,18]],'A');g.rect(cx-3+(step?1:0),18,2,1,'d');g.rect(cx+1-(step?1:0),18,2,1,'d')}
  else{g.rect(cx-3+(step?1:0),child?14:13,2,child?4:5,'p');g.rect(cx+1-(step?1:0),child?14:13,2,child?4:5,'p');g.rect(cx-3+(step?1:0),18,2,1,'d');g.rect(cx+1-(step?1:0),18,2,1,'d')}
  // body
  g.rect(cx-3,top+6,7,child?6:7,'A');g.rect(cx-3,top+(child?11:12),7,1,'b');
  g.line(cx+3,top+7,cx+4+(step?0:1),top+11,'A');g.px(cx+4+(step?0:1),top+12,'F');
  // head
  g.ell(cx,top+3,2.6,2.8,'F');g.px(cx+1,top+3,'D');
  if(type==='farmer'){g.rect(cx-4,top,9,1,'H');g.rect(cx-2,top-1,5,1,'H')}
  else if(type==='woman'){g.ell(cx-.5,top+1.5,3,2,'H');g.rect(cx-3,top+1,2,4,'H')}
  else if(type==='guard'){g.ell(cx,top+1.5,3,2,'M');g.line(cx+5,top-2,cx+5,18,'b');g.px(cx+5,top-3,'M')}
  else if(type==='elder'){g.ell(cx,top+1,2.6,1.6,'w');g.line(cx-1,top+5,cx+1,top+6,'w');g.line(cx-5,top+8,cx-5,18,'b')}
  else{g.ell(cx,top+1,2.6,1.8,'H')}
  return g;
};

const NPC_COATS=['#7a5a3a','#5a6a8a','#8a3a3a','#4a6a3a','#6a4a6a','#8a7a4a'];
function villagerStrip(type,coat,skin,hair){
  return unitStrip('V|'+type+coat+skin+hair,()=>({url:ART.strip([0,1].map(f=>DRAW.villager(type,f)),{A:coat,b:'#4a3424',p:'#3e3430',d:'#1e1614',F:skin,D:'#1a1018',H:hair,M:'#a4a8b4',w:'#e8e4dc'}),w:16,h:20}));

// Walking loops, in town-map pixels. Each villager visits a few doors and stops in the square; the loop is seeded by week so it stays put between redraws.
function townsfolk(T){
  const open=Object.entries(T.spots).filter(([k,b])=>b.door&&(k==='adventure'||bldOpen(k)));
  const n=Math.min(9,2+open.length+Math.floor(state.week/3)+(state.town&&state.town.week===state.week&&(state.town.ev==='festival'||state.town.ev==='rebuild')?3:0));
  const sq=TOWN_SQUARE,rnd=srng('folk'+state.week);let css='',html='';
  for(let i=0;i<n;i++){
    const pts=[[sq[0]+(rnd()-.5)*40,sq[1]+(rnd()-.5)*18]];
    for(let k=0;k<2+Math.floor(rnd()*2);k++){const d=open[Math.floor(rnd()*open.length)][1].door;pts.push([d[0]+(rnd()-.5)*6,d[1]+3+rnd()*3]);pts.push([sq[0]+(rnd()-.5)*44,sq[1]+(rnd()-.5)*20])}
    const seg=[];let tot=0;for(let k=0;k<pts.length;k++){const a=pts[k],b=pts[(k+1)%pts.length],t=Math.hypot(b[0]-a[0],(b[1]-a[1])*1.6)/7+2.2;seg.push([a,b,t]);tot+=t}
    let acc=0,mv='',fl='';const P=v=>(v/tot*100).toFixed(2);
    for(const [a,b,t] of seg){const pause=2.2,walk=t-pause;
      mv+=`${P(acc)}%{left:${(a[0]/ISO.W*100).toFixed(2)}%;top:${(a[1]/ISO.Hh*100).toFixed(2)}%}${P(acc+pause)}%{left:${(a[0]/ISO.W*100).toFixed(2)}%;top:${(a[1]/ISO.Hh*100).toFixed(2)}%}`;
      fl+=`${P(acc+pause)}%{transform:scaleX(${b[0]<a[0]?-1:1})}`;acc+=t}
    mv+=`100%{left:${(pts[0][0]/ISO.W*100).toFixed(2)}%;top:${(pts[0][1]/ISO.Hh*100).toFixed(2)}%}`;
    const id='np'+i,type=NPC_TYPES[i%NPC_TYPES.length],coat=NPC_COATS[Math.floor(rnd()*NPC_COATS.length)],skin=H_SKIN[Math.floor(rnd()*H_SKIN.length)],hair=H_HAIR[Math.floor(rnd()*H_HAIR.length)];
    const s=villagerStrip(type,coat,skin,hair),delay=-((Date.now()/1000)%tot).toFixed(2);
    css+=`@keyframes ${id}{${mv}}@keyframes ${id}f{${fl}}`;
    html+=`<span class="npc" style="animation:${id} ${tot.toFixed(1)}s linear ${delay}s infinite" aria-hidden="true"><span class="npcf" style="animation:${id}f ${tot.toFixed(1)}s step-end ${delay}s infinite"><img class="px anim walk" src="${s.url}" alt="" width="16" height="20" style="aspect-ratio:16/20"></span></span>`;
  }
  return `<style>${css}</style>${html}`;
}

/* battle backdrops: two parallax layers and a perspective floor per land */
const layerCache={};
function biomeLayers(biome){
  if(layerCache[biome])return layerCache[biome];
  const B=BIOMES[biome],W=320,seedN=[...biome].reduce((a,c)=>a+c.charCodeAt(0),0);
  const wave=(x,amp,k,ph)=>amp*Math.sin(2*Math.PI*k*x/W+ph);
  const far=new Raster(W,60),fc=lit(hexRgb(B.h),-.3);
  for(let x=0;x<W;x++){const top=Math.round(26+wave(x,9,2,seedN)+wave(x,5,5,seedN*.7)+wave(x,2,13,seedN*1.3));
    for(let y=top;y<60;y++){let c=lit(fc,(y-top)*-.006);if(biome==='tundra'&&y<top+3)c=[200,214,226];if(hsh(x,y)<.05)c=lit(c,.1);far.set(x,y,c)}}
  const mid=new Raster(W,50),mc=lit(hexRgb(B.h),.05);
  const tri=(cx,base,w,h,col)=>{for(let y=0;y<h;y++){const hw=Math.round(w*(y+1)/h/2);for(let x=-hw;x<=hw;x++)for(const o of [0,-W,W])mid.set(cx+x+o,base-h+y,x>hw-2?lit(col,-.25):x<-hw+2?lit(col,.12):col)}};
  const rect=(x0,y0,w,h,col)=>{for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)for(const o of [0,-W,W])mid.set(x+o,y,x>x0+w-3?lit(col,-.25):col)};
  for(let i=0;i<14;i++){const x=Math.floor(hsh(i,seedN)*W),s=.6+hsh(seedN,i)*.6;
    if(biome==='tundra'||biome==='forest'){const col=biome==='forest'?[28,52,30]:[40,60,70];tri(x,50,Math.round(14*s),Math.round(24*s),col);tri(x,50-Math.round(9*s),Math.round(10*s),Math.round(18*s),biome==='tundra'?[190,205,215]:lit(col,.1))}
    else if(biome==='island'){if(i===0){tri(x,50,70,34,[60,34,30]);for(let k=0;k<4;k++)mid.set(x-1+k,16,[255,120,40])}else{rect(x,28,2,22,[70,50,36]);tri(x+1,30,12,6,[40,90,50])}}
    else if(biome==='sky'){const y=10+Math.floor(hsh(i,7)*24),w=Math.round(16*s);for(let k=0;k<w/2;k++)rect(x+k,y+k,w-2*k,1,[80,84,110])}
    else if(biome==='badlands'){const w=Math.round(26*s),h=Math.round(20*s);rect(x,50-h,w,h,[110,70,44]);rect(x-2,50-h,w+4,3,[140,94,60])}
    else{tri(x,50,Math.round(8*s),Math.round(40*s),[40,24,56]);mid.set(x,50-Math.round(40*s),[190,140,255])}}
  const gnd=new Raster(160,24),gc=hexRgb(B.g);
  for(let y=0;y<24;y++)for(let x=0;x<160;x++){let c=lit(gc,-.55+y*.022);if([1,3,6,10,15,21].includes(y))c=lit(c,-.18);if(hsh(x,y)<.07+y*.004)c=lit(c,.14);gnd.set(x,y,c)}
  return layerCache[biome]={far:far.url(),mid:mid.url(),gnd:gnd.url()};
}

// Wheel (each beats the next): Thunder → Ice → Fire → Grass → Fighting → Thunder.
// Display order everywhere: Fire, Ice, Thunder, Fighting, Grass. (Who beats whom is set by BEATS, not by this order.)
const ELEMENTS=['fire','ice','thunder','fighting','grass'];
// Item bonus lines: plain bonuses first, then elemental ones in element order (damage before resistance).
const afxRank=a=>{const m=/^(dmg|res)_(.+)$/.exec(a.k);return m&&ELEMENTS.includes(m[2])?100+ELEMENTS.indexOf(m[2])*2+(m[1]==='res'?1:0):0};
const afxOrd=L=>L.map((a,i)=>[a,i]).sort((x,y)=>afxRank(x[0])-afxRank(y[0])||x[1]-y[1]);
const ALL_EL=[...ELEMENTS,'dark'];
const BEATS={thunder:'ice',ice:'fire',fire:'grass',grass:'fighting',fighting:'thunder'};
const EL_COL={fire:'#e0643a',ice:'#8fd0ea',thunder:'#e6d55a',grass:'#6fb35a',fighting:'#c98b5c',dark:'#9b70dc',physical:'#b9b1a3'};
const ELPRE={fire:'Burning',ice:'Frost',thunder:'Storm',grass:'Thorn',fighting:'Brawler’s',dark:'Umbral'};
// Mages exploit weaknesses harder than anyone: 1.75x instead of 1.5x.
const heroMatch=(h,el,type)=>{const m=matchup(el,type);return m>1&&h.cls==='mage'?1.75:m};
function matchup(atk,def){
  if(!atk||!def||atk==='physical'||atk==='dark'||def==='dark'||def==='physical')return 1;
  if(BEATS[atk]===def)return 1.5;
  if(BEATS[def]===atk)return 0.5;
  return 1;
}

  if(x<.03){m=rand(8,12);tier='jackpot'}else if(x<.2){m=rand(2,3);tier='big'}else m=rand(.7,1.3);
  const s=state.run.stage;return {k:'gold',g:Math.max(1,Math.round(goldAmt(6+2.5*s)*m*scale*(1+F/100))),tier};
}
// Chest tiers: map chests, an elite's stash, a boss's hoard and the final boss's treasure.
const CHEST_TIER={
  map:{n:'Chest',gold:1,table:'chest',sure:0},
  elite:{n:'An elite’s stash',gold:1.5,table:'elite',sure:0},
  boss:{n:'A boss’s hoard',gold:2.5,table:'boss',sure:1},
  final:{n:'The final boss’s treasure',gold:3,table:'final',sure:2},
};
function rollChest(tier){
  const T=CHEST_TIER[tier]||CHEST_TIER.map,r=state.run,L=living(),F=eventBonus(),out=[chestGold(T.gold),chestConsumable()];
  const eq=()=>({k:'item',it:makeItem(T.table,ilvl(),pick(L).cls)});
  for(let i=0;i<T.sure;i++)out.push(eq());
  if(!T.sure&&chance(Math.min(.95,(Math.min(90,80+r.stage*.5)+F/10)/100)))out.push(eq());
  // Bonus slots: 60% consumable, 25% equipment, 15% another gold pile.
  for(const p of CHEST_EXTRA){if(!chance(p))break;const x=Math.random();out.push(x<.6?chestConsumable():x<.85?eq():chestGold(.6))}
  return out;
}
function openChest(){

    if(x.k==='gold'){r.gold+=x.g;lines.push(`<b class="gold">${x.g} gold</b>${x.tier==='jackpot'?' <b class="gold">JACKPOT!</b>':x.tier==='big'?' <span class="gold">(a fat purse)</span>':''}`)}

function chooseNode(i){

        <li>${Math.round(O.jack*100)}%: jackpot, win five times your bet (<b class="gold">+${w*4}</b>)</li><li>${Math.round(O.win*100)}%: win, double your bet (<b class="gold">+${w}</b>)</li><li>${100-Math.round(O.jack*100)-Math.round(O.win*100)}%: lose your bet (<b class="warn">−${w}</b>)</li></ul>
        <p><b>Offer blood</b> · ${esc(h.name)} loses ${hh}% of max health (<b class="warn">${hp} HP</b>), then the stranger pays out</p><ul>
        <li>${Math.round(O.item*100)}%: a random piece of gear, often for ${esc(h.name)}’s class (the deeper you are, the better it tends to be)</li><li>${Math.round(O.gold*100)}%: about <b class="gold">${g} gold</b> (${Math.round(g*.8)}–${Math.round(g*1.2)})</li><li>${100-Math.round(O.item*100)-Math.round(O.gold*100)}%: nothing at all</li></ul></div>${chaNote()}`})(),
      choices:[{l:'Wager coin',x:'coin',off:r.gold<2},{l:'Offer blood',x:'blood',off:h.hp<=maxHp(h)*.2},{l:'Walk away',x:'leave'}]};

// The stranger's blood price in gold, before the ±20% roll.
function strangerPay(){const r=state.run,L=living(),n=L.length||1,O=strangerOdds();return Math.round((25+8*r.stage)*LENGTHS[r.length].mult*(1+.25*(n-1))*(1+L.reduce((s,h)=>s+aff(h,'goldfind')+luckRate(h,'gold'),0)/100)*O.pay)}
function strangerOdds(){
  const F=eventBonus(),luck=partyTr('gamble')/100;
  const jack=clamp(.05+F/1000,.02,.1),win=clamp(.45+luck+F/200,.25,.6),item=clamp(.1+F/500,.04,.2),gold=clamp(.5+luck+F/200,.3,.7);
  return {F,jack,win,item,gold,cost:clamp(.2*(1-F/200),.15,.28),pay:1+F/100};
}
function gamble(x){
  const r=state.run,h=runHero(),s=r.stage,O=strangerOdds();let text;
  if(x==='coin'){
    const w=Math.floor(r.gold/2),roll=Math.random();
    if(roll<O.jack){r.gold+=w*4;text=`<b class="gold">JACKPOT.</b> The stranger laughs and pays out ${w*5} gold.`}
    else if(roll<O.jack+O.win){r.gold+=w;text=`The coin lands your way. <b class="gold">+${w} gold</b>.`}
    else{r.gold-=w;text=`The coin lands wrong. You lose <b>${w} gold</b>.`}
  }else if(x==='blood'){
    const cost=Math.round(maxHp(h)*O.cost);h.hp=Math.max(1,h.hp-cost);const roll=Math.random();
    if(roll<O.item){const it=makeItem('elite',ilvl()+1,h.cls);const ln=[];addLoot(it,ln,'');text=`${esc(h.name)} bleeds ${cost} HP. The stranger hands over something wrapped in cloth: ${ln[0]}.`}
    else if(roll<O.item+O.gold){const g=Math.round(goldAmt(25+8*s)*O.pay);r.gold+=g;text=`${esc(h.name)} bleeds ${cost} HP. The stranger pays <b class="gold">${g} gold</b>.`}
    else text=`${esc(h.name)} bleeds ${cost} HP. The stranger smiles and gives nothing.`;
  }else text='You leave the stranger to the dark.';
  r.event={title:'Hooded Stranger',icon:'dice',text};
}

const GOV_GENERAL=[
  `I should only pack what the heroes need. Supplies left behind stay safe in town.`,
  `The bosses guard the best loot. I should scout ahead before we commit.`,
  `A hero who flees keeps their gear. One who falls loses it. I need to remember that.`,
  `Skills cost mana but hit harder than a basic attack. I should tell the heroes to save them for the fights that matter.`,
  `With enough Perception, the heroes can see what the enemy plans next. I should build a sharp-eyed party.`,

];
// At most one thought a week (a promotion waiting is the exception). Tapping my portrait always gives one.
function govTipNow(){
  if(!state.gov||state.gov.unseen||state.run||state.summary||storyNext())return null;
  // stay quiet while a walkthrough is on screen
  if((state.tab==='farm'&&coachOn('farm'))||(state.tab==='witch'&&state.sel.wtab==='mana'&&coachOn('mana'))||(state.tab==='heroes'&&tutBOn()))return null;
  const seen=state.tipsSeen||(state.tipsSeen=[]);
  if(state.lostNote){state.tipCur={id:'lost',t:state.lostNote,go:['adventure','To the Gate']};return state.tipCur}
  if(state.gov.pend&&state.promoWeek!==state.week&&(!state.tipCur||state.tipCur.id!=='promo'))state.tipCur={id:'promo',t:`The roads we conquered have earned me the town’s trust. I can grow into a better governor. How should I?`,go:['@govPromoOpen','Choose promotion']};
  const c=state.tipCur;
  if(c&&c.id==='promo'){if(state.gov.pend&&state.promoWeek!==state.week)return c;state.tipCur=null}
  if(set.govTips===false)return null; // tips switched off in Settings (promotions above still show)
  else if(c&&c.id!=='g'){const T=GOV_TIPS.find(t=>t.id===c.id);if(T&&T.when())return {id:T.id,t:T.t(),go:T.go?T.go():null};state.tipCur=null}
  else if(c)return c;
  if(state.tipWeek===state.week)return null;
  const T=GOV_TIPS.find(t=>!seen.includes(t.id)&&t.when());
  state.tipWeek=state.week;
  if(T){state.tipCur={id:T.id};return {id:T.id,t:T.t(),go:T.go?T.go():null}}
  if(state.week>=2){state.tipCur={id:'g',t:GOV_GENERAL[(state.week*5)%GOV_GENERAL.length],go:null};return state.tipCur}
  return null;
}

function loadoutRow(h){

  return `<div class="loadouts"><span class="muted">Gear sets ${help('Save what this hero wears now as a set. Later, Wear puts every piece of that set back on from the stash and returns what was in its place. Pieces another hero is wearing, sold or lost are skipped.')}</span>${[0,1].map(k=>{const S=sets[k],miss=S?Object.entries(S).filter(([sl,id])=>!(h.gear[sl]&&h.gear[sl].id===id)&&!state.bank.some(x=>x.id===id)).length:0,worn=S&&Object.entries(S).every(([sl,id])=>h.gear[sl]&&h.gear[sl].id===id);
    return `<span class="lset"><b>Set ${k+1}</b>${S?`<small class="muted">${cnt(S)} pieces${miss?` · ${miss} missing`:''}</small><button class="btn small ${worn?'':'gold'}" data-a="setWear" data-x="${h.id}|${k}" ${worn?'disabled':''}>${worn?'Wearing':'Wear'}</button>`:'<small class="muted">empty</small>'}<button class="btn small" data-a="setSave" data-x="${h.id}|${k}">Save</button></span>`}).join('')}</div>`;

function wearSet(h,k){const S=(h.sets||[])[k];if(!S)return;
  for(const [sl,id] of Object.entries(S)){if(h.gear[sl]&&h.gear[sl].id===id)continue;const it=state.bank.find(x=>x.id===id);if(!it||(it.cls&&it.cls!==h.cls))continue;

function dmgRange(h,o,el){
  const b=state.run.battle,C=C_(h);
  let bonus=tr(h,'power')+(el==='physical'?tr(h,'physDmg'):0)+(el!=='physical'&&C.elem?C.elem:0)+posV(h,'dmg')+(el!=='physical'?posV(h,'spell'):0);
  const cbn=cbStacks(h);if(cbn&&(h.cls==='warrior'||(h.cls==='mage'&&el!=='physical')))bonus+=cbn*(h.cls==='warrior'?8:4);
  let d=power(h)*o.mult*HERO_DMG_SCALE*fatDmg(h)*Math.max(.1,1+bonus/100)*(b.warcry?1.25:1)*(b.curse&&b.curse[h.id]!=null?.75:1)*(el!=='physical'?(archSplit(h,el)?ARCH_PHYS+(1-ARCH_PHYS)*(1+aff(h,'dmg_'+el)/100):1+aff(h,'dmg_'+el)/100):1);
  return [Math.max(1,Math.round(d*C.var[0])),Math.max(1,Math.round(d*C.var[1]))];
}

    badlands:{root:N(87.31),scale:[0,1,4,5,7,8,10],bpm:80,pad:'sawtooth',padF:700,lead:'square',mel:.24,prog:[0,1,5,4],bass:.6},
    abyss:{root:N(69.3),scale:[0,1,3,6,7,10],bpm:60,pad:'sawtooth',padF:500,lead:'sine',mel:.18,prog:[0,1,0,4],bass:.8},
    boss:{root:N(73.42),scale:[0,1,3,5,7,8,11],bpm:132,pad:'sawtooth',padF:700,lead:'square',mel:.42,prog:[0,5,6,4],bass:1,drum:2},
  };
  const trackFor=k=>{if(TRACKS[k])return TRACKS[k];const [base,b]=k.split(':'),T=TRACKS[base]||TRACKS.town;return b?{...T,bpm:Math.round(T.bpm*1.45),mel:Math.min(.55,T.mel+.15),drum:1,bass:Math.max(.6,T.bass)}:T};
  const fq=(T,deg,oct=0)=>{const n=T.scale.length,o=Math.floor(deg/n)+oct,i=((deg%n)+n)%n;return T.root*Math.pow(2,o+T.scale[i]/12)};

  function stepAt(S,t){

    if(T.drum){

})();

/* ---------- the Witch: expensive rerolls for heroes and gear ----------
   Every service starts from the same base price. Item rarity raises the starting price, hero level raises it for heroes,
   and each visit makes the next one on that same hero or item 60% more expensive. */
const WITCH_BASE=120;
const WITCH_RAR={common:1,rare:1.5,epic:2.5,godlike:4,perfect:6};
const WITCH_HERO={trait:{n:'Reroll a trait',m:1,d:'Replace one trait with a new random one.'},respec:{n:'Rebalance hero',m:1.5,d:'Reset every attribute point this hero has spent: stats go back to their starting rolls and all the points return to be spent again however you like.'}};
const WITCH_ITEM={full:{n:'Full blessing',m:1.5,d:'Reroll every bonus: new types and new values.'},line:{n:'Reroll one line',m:1,d:'Replace one chosen bonus with a new type and value.'},values:{n:'Rebless values',m:.8,d:'Keep the bonus types, reroll all their values.'},base:{n:'Reforge base',m:.8,d:'Reroll the base damage or armor.'}};
// Resistance rerolls: priced by hero level and by how many times THAT element has been rerolled on this hero (×1.6 each time).
// The roll uses the same odds as a new recruit: 75% a resistance of +5 to +30%, 25% a weakness of −5 to −15%.
const resRerollCost=(h,el)=>Math.round(WITCH_BASE*.8*(1+.15*(h.level-1))*Math.pow(1.6,((h.resRolls||{})[el])||0));
const rollHeroRes=()=>chance(.25)?-ri(5,15):ri(5,30);
const heroWitchCost=(h,k)=>Math.round(WITCH_BASE*WITCH_HERO[k].m*(1+.15*(h.level-1))*Math.pow(1.6,h.witch||0));
const itemWitchCost=(it,k)=>Math.round(WITCH_BASE*WITCH_ITEM[k].m*WITCH_RAR[it.rarity]*Math.pow(1.6,it.witch||0));

function wheelHtml(ev){

/* ---------- traveling merchant: shop in the middle of a run with the gold you carry ---------- */
// Base prices before Charisma. Potions cost a little more than in town; Return Scrolls cost less.
const SHOP_PRICE={potion:20,mpotion:45,gpotion:80,ether:45};
function makeShop(mult){
  const r=state.run,s=r.stage,T=talker(),m=mult||1,stock=[],p=v=>Math.max(1,priced(Math.round(v*m),T));
  stock.push({k:'cons',id:'potion',n:ri(2,4),price:p(SHOP_PRICE.potion)});
  stock.push({k:'cons',id:'mpotion',n:ri(1,3),price:p(SHOP_PRICE.mpotion)});
  if(chance(Math.min(.9,.45+s*.01)))stock.push({k:'cons',id:'gpotion',n:ri(1,2),price:p(SHOP_PRICE.gpotion)});
  if(chance(.6))stock.push({k:'cons',id:'ether',n:ri(1,2),price:p(SHOP_PRICE.ether)});
  stock.push({k:'cons',id:'ebrew',n:({short:[1,2],medium:[1,3],long:[2,4],expedition:[3,6],descent:[3,6]}[r.length]||[1,3]).reduce((a,b)=>ri(a,b)),price:p(CONSUMABLES.ebrew.cost*1.2)});
  stock.push({k:'scroll',n:1,price:p(SCROLL_PRICE*.6)});
  // Gear is not the merchant's usual trade: 30% of the time there are one or two pieces.
  if(chance(.3)){const L=living();for(let i=0;i<(chance(.3)?2:1);i++){const it=makeItem('elite',ilvl(),pick(L).cls);stock.push({k:'item',it,n:1,price:p(sellVal(it)*3)})}}
  return stock;
}

    <div class="shopgrid">${ev.shop.map((x,i)=>{const sold=x.n<=0;
      const ic=x.k==='item'?itemIcon(x.it,3):x.k==='scroll'?`<span class="ibox">${sprite('scroll',null,3)}</span>`:`<span class="ibox">${consIco(x.id,3)}</span>`;

// Traveling merchants pay 40% more than town for loot, and Charisma adds to that.
