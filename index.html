  if(state.b.bag==null)state.b.bag=1;
  if(state.run&&!state.run.ground)state.run.ground=[];
  if(state.tab==='academy'){state.tab='heroes';state.sel.btab='recruit'}
  if(!state.items)state.items={};
  if(!state.mats)state.mats={};
  if(!state.farm)state.farm={lvl:0};
  if(!state.mat2){state.mat2=true;const conv=o=>{if(!o)return;for(const [k,v] of Object.entries(OLD_MAT))if(o[k]){addMat(o,v,o[k]);delete o[k]}};conv(state.mats);if(state.run)conv(state.run.mats)}
  if(state.still==null)state.still=0;
  // Saves from before construction: buildings count as built only if the town had reached the week they used to open.
  if(!state.built||!state.built2){state.built2=true;const b={};for(const [k,w] of Object.entries({bank:2,smith:2,farm:3,witch:3}))if((state.week||1)>=w)b[k]=true;
    const kept=state.built||{};for(const k of Object.keys(kept))if(kept[k]&&!b[k]&&OPEN_WEEK[k])addMat(state.mats,'stone',OPEN_WEEK[k]);state.built=b}
  if(!state.up5){state.up5=true;const cap=it=>{if(it&&it.plus>UP_MAX)it.plus=UP_MAX};for(const it of state.bank)cap(it);for(const h of state.heroes)for(const sl of SLOTS)cap(h.gear[sl]);if(state.run)for(const it of state.run.loot)cap(it)}
  if(state.reachedLong==null)state.reachedLong=state.heroes.some(h=>h.level>=10)||(state.bossKills||0)>0;
  if(!state.ration3){state.ration3=true;for(const [id] of FOODS)delete state.items[id]}if(state.b.potency==null)state.b.potency=0;if(state.b.feed==null)state.b.feed=0;
  if(!state.farm2){state.farm2=true;state.farm.lvl={0:0,1:3,2:4,3:6}[state.farm.lvl]??state.farm.lvl;
    if(state.items.ration){state.items.wheat=(state.items.wheat||0)+state.items.ration*2;delete state.items.ration}
    if(state.items.meal){state.items.fruit=(state.items.fruit||0)+state.items.meal*2;delete state.items.meal}}
  if(state.run&&!state.run.mats)state.run.mats={};
  if(!state.perfectFound)state.perfectFound=[];
  if(!state.ledger)state.ledger={};
  for(const h of [...state.heroes,...state.candidates])if(h.bonusHp||h.bonusMp){const n=(h.bonusHp||0)+(h.bonusMp||0);h.points=(h.points||0)+n;h.spent=Math.max(0,(h.spent||0)-n);h.bonusHp=0;h.bonusMp=0;if(h.baseBonus)h.baseBonus={hp:0,mp:0};h.hp=Math.min(h.hp,maxHp(h));h.mp=Math.min(h.mp,maxMp(h))}
  for(const h of [...state.heroes,...state.candidates])if(!h.baseStats){h.baseStats=Object.fromEntries(STATS.map(k=>[k,h[k]]));h.baseBonus={hp:h.bonusHp||0,mp:h.bonusMp||0};h.spent=0}
  if(!state.recruit1){state.recruit1=true;state.candidates=state.candidates.slice(0,recruitCount())}
  if(!state.pts2){state.pts2=true;for(const h of state.heroes){let add=0;for(let L=2;L<=h.level;L++)add+=pointsFor(L)-oldPointsFor(L);if(add>0)h.points+=add}}
  // Gear v3: capes and shoes are gone (sold automatically); chest and pants are now class-locked.
  if(!state.gear3){state.gear3=true;let refund=0,n=0;const gone=it=>it&&(it.slot==='shoes'||it.slot==='cape');
    const lock=it=>{if(it&&(it.slot==='chest'||it.slot==='pants')&&!it.cls){it.cls=it.wt||pick(Object.keys(CLASSES));delete it.wt}};
    const cull=arr=>arr.filter(it=>{if(gone(it)){refund+=sellVal(it);n++;return false}lock(it);return true});
    state.bank=cull(state.bank||[]);
    for(const h of [...state.heroes,...(state.candidates||[])]){for(const sl of ['shoes','cape'])if(h.gear[sl]){refund+=sellVal(h.gear[sl]);n++;delete h.gear[sl]}
      for(const sl of SLOTS){const it=h.gear[sl];lock(it);if(it&&it.cls&&it.cls!==h.cls){state.bank.push(it);h.gear[sl]=null}}}
    if(state.run){state.run.loot=cull(state.run.loot||[]);if(state.run.ground)state.run.ground=cull(state.run.ground)}
    if(refund){state.gold+=refund;state.gear3Msg=`Capes and shoes were retired: ${n} item${n>1?'s':''} sold for ${refund} gold.`}}
  if(state.unlock==null)state.unlock=3;
  if(!state.recruit2){state.recruit2=true;while(state.candidates.length<recruitCount())state.candidates.push(makeHero(recruitCls()))}
  for(const c of state.candidates)if(!c.dice){for(const k of STATS)c[k]=ri(1,6);c[CLASSES[c.cls].primary]+=2;c.dice=true}
  if(state.tab==='academy'&&!state.run)state.tab='town';
  if(state.run&&!state.run.bag)state.run.bag={};
  if(state.run&&(!state.run.plan||Object.values(state.run.plan).some(P=>!P.cols))&&!state.run.battle&&!state.run.event)arrive();
  else if(state.run&&(!state.run.plan||!state.run.plan[state.run.stage]||!state.run.plan[state.run.stage].cols)){state.run.plan=null;state.run.needMap=true}
  if(state.bossKills==null)state.bossKills=0;
  const r=state.run;
  if(r&&!r.party){r.party=[r.heroId];r.lastStand={};r.fallen=[];r.final=false}
  const b=r&&r.battle;
  if(b&&!b.enemies){b.enemies=[b.enemy];b.target=0}
  for(const h of [...state.heroes,...state.candidates]){
    if(!h.skills||!h.skills.length)h.skills=classSkills(h.cls).sort(()=>Math.random()-.5).slice(0,2);
    if(state.heroes.includes(h))autoLearn(h);
    if(!h.affinity)h.affinity=pick(ELEMENTS);
    for(const k of STATS)if(h[k]==null)h[k]=rollStat(3);
  }
  if(b)for(const e of b.enemies){if(!e.base)e.base=e.name.replace(/ [ABC]$/,'').replace(new RegExp('^('+Object.values(MUT).map(m=>m.n).join('|')+') '),'');if(!e.tier)e.tier=tierOf(e.lvl);if(!e.skills)e.skills=[];if(!e.baseRes)e.baseRes={...e.res}}
  if(b&&!b.over)for(const e of b.enemies)if(e.hp>0&&!e.intent){try{planIntent(e)}catch(x){}}
  if(b){b.dot=b.dot||{};b.curse=b.curse||{};b.fx=b.fx||{};b.opened=b.opened||[];for(const k of ['guard','attune','wards'])b[k]=b[k]||{};if(typeof b.warcry!=='object')b.warcry=null;b.surge=b.surge||{};b.pending=null;b.windup=null;
    if(!b.ct&&!b.over){b.ct={};initTimeline();advance()}
    if(!b.over&&!b.cur){b.busy=false;advance()}else b.busy=false}
  render();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({state}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
})();
</script>

  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()})}
