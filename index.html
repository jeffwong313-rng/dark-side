  const t=document.elementFromPoint(x,y),d=t&&t.closest('[data-drop]');
  if(dnd.over&&dnd.over!==d)dnd.over.classList.remove('dropover');if(d)d.classList.add('dropover');dnd.over=d;
}
function dndEnd(){if(dnd.ghost)dnd.ghost.remove();if(dnd.over)dnd.over.classList.remove('dropover');dnd.ghost=null;dnd.over=null;dnd.active=false;document.body.classList.remove('dragging')}
document.addEventListener('pointerdown',ev=>{
  const el=ev.target.closest&&ev.target.closest('[data-drag]');if(!el||ev.button>0)return;
  Object.assign(dnd,{src:el.dataset.drag,el,start:[ev.clientX,ev.clientY],last:[ev.clientX,ev.clientY],touch:ev.pointerType!=='mouse',active:false});
  clearTimeout(dnd.timer);if(dnd.touch)dnd.timer=setTimeout(()=>{if(dnd.src)dndBegin(dnd.last[0],dnd.last[1])},280);
});
document.addEventListener('pointermove',ev=>{
  if(!dnd.src)return;dnd.last=[ev.clientX,ev.clientY];const dist=Math.hypot(ev.clientX-dnd.start[0],ev.clientY-dnd.start[1]);
  if(!dnd.active){if(dnd.touch){if(dist>10){clearTimeout(dnd.timer);dnd.src=null}return}if(dist<6)return;dndBegin(ev.clientX,ev.clientY)}
  dndMove(ev.clientX,ev.clientY);
});
document.addEventListener('pointerup',ev=>{
  clearTimeout(dnd.timer);
  if(dnd.active){const d=dnd.over,src=dnd.src;dndEnd();dnd.suppress=true;setTimeout(()=>{dnd.suppress=false},60);if(d&&dropItem(src,d.dataset.drop))render()}
  dnd.src=null;
});
document.addEventListener('pointercancel',()=>{clearTimeout(dnd.timer);dndEnd();dnd.src=null});
// Pixel sprites are <img>s; stop the browser's own image dragging so our drag works everywhere.
document.addEventListener('dragstart',ev=>ev.preventDefault());
document.addEventListener('touchmove',ev=>{if(dnd.active)ev.preventDefault()},{passive:false});
document.addEventListener('contextmenu',ev=>{if(dnd.src||dnd.active)ev.preventDefault()});
document.addEventListener('click',ev=>{if(dnd.suppress){ev.stopPropagation();ev.preventDefault()}},true);
/* ---------- save slots and the main menu ----------
   Three slots, each saved automatically. Slot 1 is the original save. */
const SLOT_KEY='dsotm-slot';
const slotKey=i=>i===1?SAVE_KEY:SAVE_KEY+'-slot'+i;
try{ui.slot=+localStorage.getItem(SLOT_KEY)||1}catch(e){ui.slot=1}
function slotInfo(i){try{const o=JSON.parse(localStorage.getItem(slotKey(i))||'null');if(!o||o.v!==1)return null;
  return {week:o.week,gold:o.gold,heroes:(o.heroes||[]).length,top:Math.max(0,...(o.heroes||[]).map(h=>h.level)),moon:Math.round(o.moonMax||0),bosses:o.bossKills||0,run:!!o.run,won:!!o.won,setup:!!o.govSetup,gov:o.gov?((o.gov.name||'Governor')+', '+((GOV_PROFS[o.gov.prof]||{}).n||'')):''}}catch(e){return null}}
function menuView(){
  return `<div class="mainmenu"><div class="mm-title"><span class="disp logo">DARK SIDE <small>OF THE</small> MOON</span>${moonImg(60,4)}</div>
    ${(()=>{const S=ui.erased===ui.slot?null:slotInfo(ui.slot||1);return S?`<div class="row" style="justify-content:center"><button class="btn gold big" data-a="menuContinue">Continue</button><span class="muted">Slot ${ui.slot||1} · Week ${S.week}${S.setup?' · choosing a governor':S.gov?' · Governor '+esc(S.gov.split(',')[0]):''}${S.run?' · <span class="warn">on an adventure</span>':''}</span></div>`:''})()}
    <p class="muted" style="text-align:center">Three towns, each saved automatically as you play. There is no manual saving.</p>
    <div class="slots">${[1,2,3].map(i=>{const S=slotInfo(i),cur=i===ui.slot&&ui.erased!==i;return `<div class="slotcard ${cur?'cur':''}"><div class="row" style="justify-content:space-between"><h2>Slot ${i}</h2>${cur?'<span class="lvpill">Current</span>':''}</div>
      ${S&&S.setup?`<p>New town. The governor hasn’t taken office yet.</p><div class="row"><button class="btn gold" data-a="slotPlay" data-x="${i}">${cur?'Continue':'Load'}</button>${ui.slotDel===i?`<span class="warn">Erase Slot ${i}?</span><button class="btn small red" data-a="slotDelYes" data-x="${i}">Erase</button><button class="btn small" data-a="slotDelNo">Keep</button>`:`<button class="btn small" data-a="slotDel" data-x="${i}">Erase</button>`}</div>`:S?`${S.gov?`<p class="gold">Governor ${esc(S.gov)}</p>`:''}<p>Week ${S.week} · ${S.heroes} hero${S.heroes===1?'':'es'} (best Lv ${S.top})</p><p class="muted">${fmt(S.gold)} gold · moon ${S.moon}% dark · ${S.bosses} boss${S.bosses===1?'':'es'} slain${S.run?' · <span class="warn">on an adventure</span>':''}${S.won?' · <span class="gold">King slain</span>':''}</p>
        <div class="row"><button class="btn gold" data-a="slotPlay" data-x="${i}">${cur?'Continue':'Load'}</button>${ui.slotDel===i?`<span class="warn">Erase Slot ${i} for good?</span><button class="btn small red" data-a="slotDelYes" data-x="${i}">Erase</button><button class="btn small" data-a="slotDelNo">Keep</button>`:`<button class="btn small" data-a="slotDel" data-x="${i}">Erase</button>`}</div>`
      :`<p class="muted">Empty</p><div class="row"><button class="btn gold" data-a="slotPlay" data-x="${i}">New town</button></div>`}</div>`}).join('')}</div></div>`;
}
/* ---------- export / import: move a town between browsers or into the installed app ---------- */
const SAVE_PREFIX='DSOTM1:';
function exportCode(){save();const json=JSON.stringify(state);return SAVE_PREFIX+btoa(unescape(encodeURIComponent(json)))}
function parseSave(txt){
  txt=String(txt||'').trim();if(!txt)throw new Error('Nothing to load.');
  let json=txt;if(txt.startsWith(SAVE_PREFIX))json=(()=>{try{return decodeURIComponent(escape(atob(txt.slice(SAVE_PREFIX.length).replace(/\s+/g,''))))}catch(e){throw new Error('That save code is damaged or incomplete.')}})();
  let o;try{o=JSON.parse(json)}catch(e){throw new Error('That doesn’t look like a save code.')}if(!o||o.v!==1||!Array.isArray(o.heroes))throw new Error('That isn’t a Dark Side of the Moon save.');return o;
}
function switchSlot(i){
  clearTimeout(advTimer);clearTimeout(autoTimer);save();
  ui.slot=i;ui.erased=null;try{localStorage.setItem(SLOT_KEY,String(i))}catch(e){}
  Object.assign(ui,{menu:false,drawer:null,flee:false,prep:false,settings:false,hideResult:false});lastView=null;
  start({});
}

/* ---------- ? rooms (mystery nodes) ----------
   Most are strange encounters with choices; some are ambushes, elites or a stray chest. */
const MYSTERY_OUTCOMES={battle:12,elite:4,chest:4,wheel:14,spring:11,idol:8,ooze:8,trainer:7,tome:7,traveler:9,altar:6,trap:7,merchant:6,moonpool:2};
const WHEEL=[['gold',25,'#e3b341','Gold'],['xp',22,'#6ab0e0','Experience'],['item',15,'#b56fe3','Free item'],['heal',13,'#78ab60','Full heal'],['pain',20,'#c4463f','Pain'],['level',5,'#ff5c7a','Level up']];
const pctHp=(h,p)=>{const v=Math.round(maxHp(h)*p);return v};
const hurtAll=(p,lines)=>{for(const h of living()){const v=Math.min(h.hp-1,pctHp(h,p));h.hp-=Math.max(0,v);lines.push(`${esc(h.name)} −${v} HP`)}};
const healAll=(p,lines)=>{for(const h of living()){const v=Math.round(maxHp(h)*p*healMult(h));h.hp=Math.min(maxHp(h),h.hp+v);lines.push(`${esc(h.name)} +${v} HP`)}};
const xpTo=(h,frac,lines)=>{const x=Math.max(1,Math.round(xpNeed(h.level)*frac));lines.push(`${esc(h.name)} +${x} XP`);gainXp(h,x,lines)};
const levelUp=(h,lines)=>{lines.push(`<b class="gold">${esc(h.name)} is filled with moonlight.</b>`);gainXp(h,xpNeed(h.level)-h.xp,lines)};
const statUp=(h,lines,n)=>{const k=pick(STATS);h[k]+=n||1;if(h.baseStats)h.baseStats[k]+=n||1;lines.push(`<b class="gold">${esc(h.name)} +${n||1} ${STATN[k]} permanently.</b>`)};
const freeItem=(table,lines,pre)=>{const it=makeItem(table,ilvl(),pick(living()).cls);addLoot(it,lines,pre||'Found: ');return it};
function startMystery(){
  const r=state.run,k=weighted(MYSTERY_OUTCOMES),h=runHero(),L=living(),s=r.stage,F=eventBonus();
  const ev=(title,icon,text,choices)=>{r.event={title,icon,text,mystery:k,choices:choices.map(c=>({...c,myst:1}))}};
  if(k==='battle'){startBattle('normal');blog('<span class="warn">Ambush! Something was waiting in the dark.</span>');return}
  if(k==='elite'){startBattle('elite');blog('<span class="warn">It was a lair. A mutated beast turns on you.</span>');return}
  if(k==='chest'){r.event={title:'A forgotten chest',icon:'chest',chest:{opened:false,tier:'map'}};return}
  if(k==='wheel')return ev('The Wheel of Fortune','dice','A painted wheel creaks on a post. A sign reads: <i>“One spin per traveler.”</i>',[{l:'Spin the wheel',x:'spin'},{l:'Walk away',x:'leave'}]);
  if(k==='spring')return ev('Moonlit Spring','drop','Cold, silver water bubbles from the rocks. It smells faintly of iron.',[{l:`Drink (${esc(h.name)})`,x:'drink'},{l:'Fill the waterskins (all heal 20%)',x:'fill'},{l:'Leave it',x:'leave'}]);
  if(k==='idol')return ev('The Golden Idol','crown','A golden idol rests on a pressure plate. The ceiling above is cracked.',[{l:'Grab it (rare+ item, maybe a trap)',x:'grab'},{l:'Leave it',x:'leave'}]);
  if(k==='ooze'){return ev('Scrap Ooze','slime','A sluggish ooze has swallowed something shiny. You could reach in… it stings.',[{l:'Reach in (lose 8% HP each try)',x:'reach'},{l:'Leave it',x:'leave'}])}
  if(k==='trainer'){const cost=Math.round(goldAmt(6+2*s)*(1-F/200));return ev('Wandering Swordmaster','sword',`An old fighter offers to drill your party for <b class="gold">${cost} gold</b>.`,[{l:`Train (${cost}g, everyone +40% of a level in XP)`,x:'train',off:r.gold<cost,cost},{l:'Spar for free (XP, but it hurts)',x:'spar'},{l:'Decline',x:'leave'}])}
  if(k==='tome')return ev('The Whispering Tome','tome','A book bound in pale leather lies open. Its pages pull at the eye.',[{l:`Read 1 page (${esc(h.name)}: +XP, −10% HP)`,x:'read1'},{l:'Read 3 pages (+lots of XP, −30% HP)',x:'read3'},{l:'Close it',x:'leave'}]);
  if(k==='traveler')return ev('Lost Traveler','heart',`A frightened traveler begs for directions home.${chaNote()}`,[{l:'Help them',x:'help'},{l:'Rob them',x:'rob'},{l:'Ignore them',x:'leave'}]);
  if(k==='altar')return ev('Blood Altar','skull','An altar slick with old blood. Something here rewards sacrifice.',[{l:`Offer blood (${esc(h.name)} −30% HP, +1 permanent stat)`,x:'offer',off:h.hp<=maxHp(h)*.3},{l:'Pray instead (heal 15%)',x:'pray'},{l:'Leave',x:'leave'}]);
  if(k==='trap'){const per=bestStat(L,'per'),agi=bestStat(L,'agi');return ev('A Tripwire','eye','A thin wire glints across the path. You could disarm it, or go around the long way.',[{l:`Disarm it (PER ${Math.round(per)}: ${Math.round(clamp(30+per*4,30,95))}% safe, reward inside)`,x:'disarm'},{l:`Leap over (AGI ${Math.round(agi)}: ${Math.round(clamp(40+agi*4,40,95))}% safe)`,x:'leap'},{l:'Go around (everyone −5% HP from the brambles)',x:'around'}])}
  if(k==='merchant'){r.event={title:'Wagon Merchant',icon:'coin',text:'A merchant’s wagon has lost a wheel. He’ll sell cheap to lighten the load.',shop:makeShop(.75)};return}
  if(k==='moonpool')return ev('A Pool of Pure Moonlight','crescent','The air hums. A pool of light, not water, fills a hollow in the stone.',[{l:`Step in (${esc(h.name)})`,x:'bathe'},{l:'Leave it be',x:'leave'}]);
}
function mystChoice(x){
  const r=state.run,ev=r.event;if(!ev||!ev.mystery)return;const k=ev.mystery,h=runHero(),s=r.stage,lines=[],F=eventBonus();
  const done=(text)=>{r.event={title:ev.title,icon:ev.icon,text,wheel:ev.wheel}};
  if(x==='leave')return done('You leave it behind.');
  if(k==='wheel'&&x==='spin'){
    const tot=WHEEL.reduce((a,w)=>a+w[1],0);let roll=Math.random()*tot,i=0;while(roll>WHEEL[i][1]){roll-=WHEEL[i][1];i++}
    let start=0;for(let j=0;j<i;j++)start+=WHEEL[j][1];const land=(start+Math.random()*WHEEL[i][1]*.8+WHEEL[i][1]*.1)/tot*360,deg=360*5+(360-land);
    const res=WHEEL[i][0];
    if(res==='gold'){const g=Math.round(goldAmt(15+5*s)*(chance(.1)?4:1));r.gold+=g;lines.push(`<b class="gold">+${g} gold</b>`)}
    if(res==='xp')for(const x2 of living())xpTo(x2,.35,lines);
    if(res==='item')freeItem('chest',lines,'The wheel pays out: ');
    if(res==='heal')healAll(1,lines);
    if(res==='pain')hurtAll(.2,lines);
    if(res==='level')levelUp(pick(living()),lines);
    ev.wheel={deg,res,fresh:true};return done(`The wheel lands on <b style="color:${WHEEL[i][2]}">${WHEEL[i][3]}</b>.<br>${lines.join('<br>')}`);
  }
  if(k==='spring'){if(x==='fill'){healAll(.2,lines);return done('You drink deep and fill every skin.<br>'+lines.join('<br>'))}
    const roll=Math.random();if(roll<.5){xpTo(h,.3,lines);healAll(.3,lines)}else if(roll<.8)statUp(h,lines);else{const v=pctHp(h,.15);h.hp=Math.max(1,h.hp-v);lines.push(`<span class="warn">The water turns in the stomach. ${esc(h.name)} −${v} HP.</span>`)}
    return done(lines.join('<br>'))}
  if(k==='idol'){const it=makeItem('elite',ilvl(),pick(living()).cls);if(RAR[it.rarity].i<1)it.rarity='rare';addLoot(it,lines,'You grab the idol: ');
    if(chance(.5)){lines.push('<span class="warn">The ceiling gives way! Boulders rain down.</span>');hurtAll(.25,lines)}else lines.push('The plate clicks… and nothing happens. Lucky.');return done(lines.join('<br>'))}
  if(k==='ooze'){ev.tries=(ev.tries||0)+1;const v=pctHp(h,.08);h.hp=Math.max(1,h.hp-v);const p=.25+.12*(ev.tries-1);
    if(chance(p)){freeItem('chest',lines,'Your hand closes on something: ');return done(`${esc(h.name)} −${v} HP. `+lines.join('<br>'))}
    ev.text=`The ooze burns (${esc(h.name)} −${v} HP). Nothing yet… but you can feel something in there. <span class="muted">(${Math.round(Math.min(95,(p+.12)*100))}% chance next try)</span>`;ev.choices[0].off=h.hp<=maxHp(h)*.1;return}
  if(k==='trainer'){if(x==='train'){const c=ev.choices.find(c=>c.x==='train').cost;if(r.gold<c)return;r.gold-=c;for(const x2 of living())xpTo(x2,.4,lines);return done(`Hours of drills.<br>${lines.join('<br>')}`)}
    for(const x2 of living())xpTo(x2,.2,lines);hurtAll(.12,lines);return done(`Bruised but wiser.<br>${lines.join('<br>')}`)}
  if(k==='tome'){const n=x==='read3'?3:1;const v=pctHp(h,.1*n);h.hp=Math.max(1,h.hp-v);xpTo(h,.3*n+(n===3?.2:0),lines);if(n===3&&chance(.15))statUp(h,lines);return done(`${esc(h.name)} reads, and the words bite back (−${v} HP).<br>${lines.join('<br>')}`)}
  if(k==='traveler'){if(x==='help'){const roll=Math.random()+F/100;if(roll>.6){freeItem('chest',lines,'Grateful, they press a gift into your hands: ')}else{const id=pick(['potion','mpotion','ether']);r.bag[id]=(r.bag[id]||0)+1;lines.push(`They give you a ${CONSUMABLES[id].n}.`)}for(const x2 of living())xpTo(x2,.1,lines);return done(lines.join('<br>'))}
    const g=Math.round(goldAmt(10+4*s));r.gold+=g;lines.push(`<b class="gold">+${g} gold</b>. It sits badly with the party.`);if(chance(.35)){lines.push('<span class="warn">Their friends were close by.</span>');hurtAll(.1,lines)}return done(lines.join('<br>'))}
  if(k==='altar'){if(x==='pray'){healAll(.15,lines);return done(lines.join('<br>'))}const v=pctHp(h,.3);h.hp=Math.max(1,h.hp-v);lines.push(`${esc(h.name)} −${v} HP.`);statUp(h,lines);return done(lines.join('<br>'))}
  if(k==='trap'){const L=living();
    if(x==='around'){hurtAll(.05,lines);return done('The long way is thorny.<br>'+lines.join('<br>'))}
    const per=bestStat(L,'per'),agi=bestStat(L,'agi'),ok=x==='disarm'?chance(clamp(30+per*4,30,95)/100):chance(clamp(40+agi*4,40,95)/100);
    if(ok){if(x==='disarm'){const g=Math.round(goldAmt(8+3*s));r.gold+=g;lines.push(`Disarmed. The trap-setter’s stash: <b class="gold">+${g} gold</b>.`);if(chance(.3))freeItem('battle',lines,'And: ')}else lines.push('Everyone clears the wire.');return done(lines.join('<br>'))}
    lines.push('<span class="warn">Snap! Darts fly.</span>');hurtAll(x==='disarm'?.15:.12,lines);return done(lines.join('<br>'))}
  if(k==='merchant'){const i=+x.replace('buy','');const o=ev.offers&&ev.offers[i];if(!o||r.gold<o.price)return;r.gold-=o.price;r.bag[o.id]=(r.bag[o.id]||0)+1;
    ev.text=`Bought a ${CONSUMABLES[o.id].n}. Anything else?`;ev.choices.forEach((c,j)=>{if(ev.offers[j])c.off=r.gold<ev.offers[j].price});return}
  if(k==='moonpool'){levelUp(h,lines);healAll(1,lines);return done(lines.join('<br>'))}
  done('Nothing happens.');
}
function wheelHtml(ev){
  const tot=WHEEL.reduce((a,w)=>a+w[1],0);let acc=0;const stops=WHEEL.map(w=>{const a=acc/tot*360,b=(acc+w[1])/tot*360;acc+=w[1];return `${w[2]} ${a}deg ${b}deg`}).join(',');
  const W=ev.wheel,fresh=W&&W.fresh;if(W)W.fresh=false;
  return `<div class="wheelbox"><div class="wheelptr"></div><div class="wheel ${fresh?'spin':''}" style="background:conic-gradient(${stops});--deg:${W?W.deg:0}deg;${W&&!fresh?`transform:rotate(${W.deg}deg)`:''}"></div>
    <div class="wheelkey">${WHEEL.map(w=>`<span><i style="background:${w[2]}"></i>${w[3]} ${Math.round(w[1]/tot*100)}%</span>`).join('')}</div></div>`;
}

/* ---------- traveling merchant: shop in the middle of a run with the gold you carry ---------- */
// Base prices before Charisma. Potions cost a little more than in town; Return Scrolls cost less.
const SHOP_PRICE={potion:20,mpotion:45,gpotion:80,ether:45};
function makeShop(mult){
  const r=state.run,s=r.stage,T=talker(),m=mult||1,stock=[],p=v=>Math.max(1,priced(Math.round(v*m),T));
  stock.push({k:'cons',id:'potion',n:ri(2,4),price:p(SHOP_PRICE.potion)});
  stock.push({k:'cons',id:'mpotion',n:ri(1,3),price:p(SHOP_PRICE.mpotion)});
  if(chance(Math.min(.9,.45+s*.01)))stock.push({k:'cons',id:'gpotion',n:ri(1,2),price:p(SHOP_PRICE.gpotion)});
  if(chance(.6))stock.push({k:'cons',id:'ether',n:ri(1,2),price:p(SHOP_PRICE.ether)});
  stock.push({k:'cons',id:'ebrew',n:({short:[1,2],medium:[1,3],long:[2,4],expedition:[3,6],descent:[3,6]}[r.length]||[1,3]).reduce((a,b)=>ri(a,b)),price:p(CONSUMABLES.ebrew.cost*1.2)});
  stock.push({k:'scroll',n:1,price:p(SCROLL_PRICE*.6)});
  // Gear is not the merchant's usual trade: 30% of the time there are one or two pieces.
  if(chance(.3)){const L=living();for(let i=0;i<(chance(.3)?2:1);i++){const it=makeItem('elite',ilvl(),pick(L).cls);stock.push({k:'item',it,n:1,price:p(sellVal(it)*3)})}}
  return stock;
}
function shopView(ev){
  const r=state.run,T=talker(),d=Math.round(chaDiscount(T));
  return `<div class="shopwrap"><p class="muted" style="font-size:17px">You carry <b class="gold">${r.gold} gold</b>.${d?` ${esc(T.name)} haggles ${d}% off.`:''} Return Scrolls here cost less than in town (${priced(SCROLL_PRICE,bestHaggler())}g).</p>
    <div class="shopgrid">${ev.shop.map((x,i)=>{const sold=x.n<=0;
      const ic=x.k==='item'?itemIcon(x.it,3):x.k==='scroll'?`<span class="ibox">${sprite('scroll',null,3)}</span>`:`<span class="ibox">${consIco(x.id,3)}</span>`;
      const nm=x.k==='item'?itemName(x.it):x.k==='scroll'?'Return Scroll':CONSUMABLES[x.id].n;
      const desc=x.k==='item'?`${RAR[x.it.rarity].l} ${SLOTN[x.it.slot]}${x.it.cls?' · '+CLASSES[x.it.cls].name+' only':''}`:x.k==='scroll'?'Party returns home safely':CONSUMABLES[x.id].heal?`Heals ${Math.round(CONSUMABLES[x.id].heal*100)}% of one hero`:x.id==='ether'?'Restores 50% mana':x.id==='ebrew'?'Removes 25% fatigue':'';
      return `<div class="shopcard ${sold?'sold':''} ${x.k==='item'?'r-'+x.it.rarity+'-b':''}" ${x.k==='item'?`data-tip="${esc(x.it.name)}"`:''}>${ic}<div class="stack" style="gap:1px;min-width:0"><span class="iname">${nm}</span><span class="meta">${desc}</span><span class="meta">${sold?'Sold out':`${x.n} left`}</span></div>
        <button class="btn small gold" data-a="shopBuy" data-x="${i}" ${sold||r.gold<x.price?'disabled':''}>${x.price}g</button></div>`}).join('')}</div>
    ${ev.shop.some(x=>x.k==='item')?'<details open><summary class="muted">Gear details</summary><div class="items">'+ev.shop.filter(x=>x.k==='item').map(x=>itemCard(x.it)).join('')+'</div></details>':''}
    ${ev.bought?`<p class="gold">${ev.bought}</p>`:''}
    <h3>Sell loot</h3>${(()=>{const L=r.loot.filter(it=>it.rarity!=='perfect');return L.length?`<p class="muted" style="font-size:17px">The merchant pays about 40% more than the shops in town${d?`, plus ${d}% for ${esc(T.name)}’s haggling`:''}.</p><div class="items">${L.map(it=>itemCard(it,`<div class="row"><button class="btn small gold" data-a="shopSell" data-x="${it.id}">Sell · ${merchantPays(it)}g</button><span class="meta">town pays ${sellVal(it)}g</span></div>`)).join('')}</div>`:'<p class="muted" style="font-size:17px">Nothing in the backpack to sell.</p>'})()}</div>`;
}
// Traveling merchants pay 40% more than town for loot, and Charisma adds to that.
const merchantPays=it=>Math.round(sellVal(it)*1.4*(1+chaDiscount(talker())/100));
function shopSell(id){const r=state.run,ev=r.event;if(!ev||!ev.shop)return;const it=r.loot.find(x=>x.id===id);if(!it||it.rarity==='perfect')return;

    for(const k of STATS)if(h[k]==null)h[k]=rollStat(3);
  }
  if(b)for(const e of b.enemies){if(!e.base)e.base=e.name.replace(/ [ABC]$/,'').replace(new RegExp('^('+Object.values(MUT).map(m=>m.n).join('|')+') '),'');if(!e.tier)e.tier=tierOf(e.lvl);if(!e.skills)e.skills=[];if(!e.baseRes)e.baseRes={...e.res}}
  if(b&&!b.over)for(const e of b.enemies)if(e.hp>0&&!e.intent){try{planIntent(e)}catch(x){}}
  if(b){b.dot=b.dot||{};b.curse=b.curse||{};b.fx=b.fx||{};b.opened=b.opened||[];for(const k of ['guard','attune','wards'])b[k]=b[k]||{};if(typeof b.warcry!=='object')b.warcry=null;b.surge=b.surge||{};b.pending=null;b.windup=null;
    if(!b.ct&&!b.over){b.ct={};initTimeline();advance()}
    if(!b.over&&!b.cur){b.busy=false;advance()}else b.busy=false}
  render();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({state}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
})();
</script>

// Offline support and updates: the service worker keeps a copy of the game so it opens without a connection.
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{r.update&&r.update()}).catch(()=>{})});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()})}
