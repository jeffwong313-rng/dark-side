<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b10">
<meta name="description" content="A dark pixel-art roguelike: build a town, send heroes out, and turn the moon to its dark side.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dark Side">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{background:#0d0b10;margin:0}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
<title>Dark Side of the Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
:root{
  color-scheme:dark;
  --void:#0d0b10;--stone:#15121a;--panel:#1c1823;--panel2:#262030;--edge:#3a3245;--edge2:#574b67;
  --bone:#e4d8c1;--ash:#9a8fa4;--dim:#6d6377;--gold:#e3b341;--blood:#c4463f;--moss:#78ab60;
  --fire:#e0643a;--ice:#8fd0ea;--thunder:#e6d55a;--grass:#6fb35a;--fighting:#c98b5c;--dark:#9b70dc;--physical:#b9b1a3;
  --common:#b9b1a3;--rare:#5f97e3;--epic:#b56fe3;--godlike:#f2a83a;--perfect:#ff5c7a;
}
html,body{background:var(--void);color:var(--bone)}
body{
  font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;font-size:22px;line-height:1.15;
  padding-inline:16px;padding-block:14px 48px;
  background:radial-gradient(ellipse 120% 60% at 50% -10%,#2b2034 0%,var(--void) 65%) var(--void);
  min-height:100%;
}
*{box-sizing:border-box}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;-webkit-user-drag:none;user-select:none}
h1,h2,h3,.disp{font-family:'Pixelify Sans','VT323',monospace;font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:26px}h3{font-size:21px;color:var(--ash);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
p{margin:0}
b{font-weight:normal;color:#fff3dc}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ash)}
.gold{color:var(--gold)}
.warn{color:#f0a070}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.stack{display:flex;flex-direction:column;gap:10px}

/* chrome */
.panel{background:var(--panel);box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--edge);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 20px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.logo{font-size:clamp(22px,6.5vw,32px);color:var(--bone);text-shadow:3px 3px 0 #3a1620}
.sub{color:var(--gold);font-size:22px}
.res{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--stone);box-shadow:inset 0 0 0 2px var(--edge);padding:3px 10px 4px 6px;color:var(--ash)}
.chip b{color:var(--bone)}
.btn{font:inherit;font-size:22px;color:var(--bone);background:var(--panel2);border:0;cursor:pointer;padding:5px 14px 8px;
  box-shadow:inset 0 0 0 2px var(--edge2),inset 0 -4px 0 0 rgba(0,0,0,.4);line-height:1.1}
.btn:hover:not(:disabled){background:#33293f}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--edge2)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.gold{background:#4a3513;color:#ffe7ae;box-shadow:inset 0 0 0 2px var(--gold),inset 0 -4px 0 0 rgba(0,0,0,.4)}
.btn.gold:hover:not(:disabled){background:#5d4318}
.btn.red{background:#4a1a1c;color:#ffc9c2;box-shadow:inset 0 0 0 2px var(--blood),inset 0 -4px 0 0 rgba(0,0,0,.4)}
.btn.small{font-size:20px;padding:2px 9px 5px}
.btn.on{background:#2d3d25;box-shadow:inset 0 0 0 2px var(--moss),inset 0 -4px 0 0 rgba(0,0,0,.4)}
:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
input[type=text]{font:inherit;font-size:24px;background:var(--stone);color:var(--bone);border:0;box-shadow:inset 0 0 0 2px var(--edge2);padding:2px 8px;width:100%;max-width:240px}

/* street */
.street{position:relative;background:linear-gradient(#1a1422 0%,#2a1d2e 70%,#3b2530 100%);box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--edge);padding:18px 10px 0;overflow:hidden}
.street::before{content:"";position:absolute;inset:0;background:
  radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 33% 9%,#fff6 50%,transparent 51%),
  radial-gradient(1px 1px at 58% 22%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 81% 12%,#fff5 50%,transparent 51%),
  radial-gradient(1px 1px at 92% 30%,#fff6 50%,transparent 51%);pointer-events:none}
.moon{position:absolute;right:5%;top:8px;z-index:1;filter:drop-shadow(0 0 10px #d9cfb855)}
.logo small{font-size:20px;color:var(--ash)}
.toplogo{display:inline-block;vertical-align:-4px;margin-left:8px}
.moonbig{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.moonparts{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:20px;min-width:220px}
.moonparts .ok{color:var(--moss)}.moonparts .no{color:var(--ash)}
.buildings{position:relative;display:grid;grid-template-columns:repeat(9,1fr);gap:4px;align-items:end}
.bld{font:inherit;background:none;border:0;color:var(--ash);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px 10px;font-size:20px;position:relative}
.bld img{filter:brightness(.8)}
.bld:hover img,.bld.cur img{filter:none}
.bld.cur{color:var(--bone)}
.bld.cur::after{content:"";position:absolute;bottom:0;left:20%;right:20%;height:4px;background:var(--gold)}
.bld .lvl{font-size:18px;color:var(--dim)}
.ground{height:14px;background:#171219;background-image:repeating-linear-gradient(90deg,#231a26 0 6px,#171219 6px 12px);box-shadow:inset 0 2px 0 #3a2a36;margin-inline:-10px}
@media (max-width:720px){.buildings{grid-template-columns:repeat(4,1fr)}.bld{font-size:19px}.street .moon{display:none}}
@media (max-width:480px){.bld{font-size:17px;min-width:0}.bld>span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}

/* hero + item cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--stone);box-shadow:inset 0 0 0 2px var(--edge);padding:12px;display:flex;flex-direction:column;gap:8px}
.card.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.card.major{box-shadow:inset 0 0 0 2px #7a5a20;background:linear-gradient(#1f1a12,var(--stone))}
.hc-top{display:flex;gap:12px;align-items:center}
.portrait{background:#0f0c13;box-shadow:inset 0 0 0 2px var(--edge);padding:6px;flex:none}
.hname{font-family:'Pixelify Sans',monospace;font-size:22px}
.grade{font-family:'Pixelify Sans',monospace;font-size:17px;padding:0 6px;margin-left:6px;box-shadow:inset 0 0 0 2px currentColor;vertical-align:2px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center}
.stats .k{color:var(--ash);font-size:20px}
.stats .k.pri{color:var(--gold)}
.pips{height:8px;background:#0c0a0f;box-shadow:inset 0 0 0 1px var(--edge)}
.pips i{display:block;height:100%;background:var(--edge2)}
.pips.pri i{background:var(--gold)}
.el{color:var(--c);white-space:nowrap}
.resl{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:20px}
.bar{height:14px;background:#0c0a0f;box-shadow:inset 0 0 0 2px #000;position:relative}
.bar i{display:block;height:100%}
.bar.hp i{background:linear-gradient(#e0574f,#a3302c)}
.bar.mp i{background:linear-gradient(#6b8fe8,#3c55a8)}
.bar.xp i{background:linear-gradient(#e3c75a,#a8862a)}
.scout{background:#120f16;box-shadow:inset 0 0 0 2px var(--edge);padding:8px 10px;display:flex;flex-direction:column;gap:4px;margin-top:10px}
.scoutrow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.scoutnode{color:var(--bone);box-shadow:inset 0 0 0 2px var(--edge2);padding:0 6px;font-size:19px}
.gate{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.gate{grid-template-columns:1fr}}
.gate-maps{display:flex;flex-direction:column;gap:8px;position:sticky;top:env(safe-area-inset-top,0px)}
.mapopt{align-items:flex-start;text-align:left;padding:10px 12px}
.gate-main{min-width:0}
.shoprow{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.shopitem{background:var(--stone);box-shadow:inset 0 0 0 2px var(--edge);padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:20px}
.setout{display:flex;flex-direction:column;gap:10px;padding:12px;background:#171320;box-shadow:inset 0 0 0 2px var(--gold)}
.btn.big{font-size:22px;padding:8px 18px 11px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.bcard{font:inherit;color:var(--bone);background:var(--stone);border:0;box-shadow:inset 0 0 0 2px var(--edge);padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer}
.bcard:hover{background:#221c2b;box-shadow:inset 0 0 0 2px var(--edge2)}
.bcard.major{box-shadow:inset 0 0 0 2px #7a5a20}
.notes{display:flex;flex-wrap:wrap;gap:8px}
.note{font:inherit;font-size:20px;color:var(--gold);background:#1f1a12;border:0;box-shadow:inset 0 0 0 2px #7a5a20;padding:4px 10px;cursor:pointer}
.ico{display:inline-block;vertical-align:-3px;margin-right:3px}
.el .ico{margin-right:2px}
.help{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;font-size:17px;color:var(--bone);background:var(--edge);box-shadow:inset 0 0 0 1px var(--edge2);cursor:help;vertical-align:1px}
.ihead{display:flex;gap:10px;align-items:center}
.ibox{flex:none;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:#0f0c13;box-shadow:inset 0 0 0 2px var(--edge)}
.r-rare-bg{box-shadow:inset 0 0 0 2px #2c4466}.r-epic-bg{box-shadow:inset 0 0 0 2px #4d3266}.r-godlike-bg{box-shadow:inset 0 0 0 2px #7a5420;background:#1c150c}.r-perfect-bg{box-shadow:inset 0 0 0 2px #8a2438;background:#1e0c12}
.istat{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.afx{display:flex;align-items:center;gap:2px}
.stiles{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.stile{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px 3px;background:#120f16;box-shadow:inset 0 0 0 2px var(--edge)}
.stile b{font-size:22px;line-height:1}.stile small{font-size:16px;color:var(--ash);letter-spacing:.06em}
.stile.pri{box-shadow:inset 0 0 0 2px var(--gold)}.stile .ico{margin:0}
.portrait.big{position:relative}
.clsbadge{position:absolute;right:-6px;bottom:-6px;background:#0f0c13;box-shadow:inset 0 0 0 2px var(--edge2);padding:2px;line-height:0}
.clsbadge .ico{margin:0}
.plaza{position:relative;background:linear-gradient(#0e0a18 0%,#221a30 55%,#3a2432 100%);box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--edge);overflow:hidden;display:flex;flex-direction:column}
.plaza::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(1px 1px at 12% 14%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 38% 8%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 63% 20%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 88% 30%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 25% 32%,#fff5 50%,transparent 51%)}
.plaza-sky{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px 0}
.plaza-title{display:flex;flex-direction:column}
.plaza-moon{font:inherit;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;filter:drop-shadow(0 0 16px #d9cfb866)}
.moonpct{font-size:18px;color:var(--ash)}
.plaza-row{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;padding:8px 10px;align-items:end}
.pb,.pgate,.ph{font:inherit;background:none;border:0;color:var(--bone);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;padding:4px}
.pb:hover img,.pgate:hover img,.ph:hover img{filter:brightness(1.25) drop-shadow(0 0 6px #e3b34188)}
.plaque{font-size:18px;background:#0f0c13cc;box-shadow:inset 0 0 0 1px var(--edge2);padding:0 6px}
.lvbadge{position:absolute;top:0;right:14%;font-family:'Pixelify Sans',monospace;font-size:17px;background:var(--gold);color:#1a1206;padding:0 5px}
.alert{position:absolute;top:0;left:18%;font-family:'Pixelify Sans',monospace;font-size:17px;background:var(--blood);color:#fff;padding:0 5px;animation:pulse 1s steps(2) infinite}
.plaza-ground{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px;padding:10px 14px 14px;background:#171219;background-image:repeating-linear-gradient(90deg,#231a26 0 6px,#171219 6px 12px);box-shadow:inset 0 3px 0 #3a2a36;min-height:96px}
.ptag{font-size:17px;color:var(--ash)}
.pgate{margin-left:auto}
.nextstep{font:inherit;color:var(--bone);display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(90deg,#3a2a10,#1f1a12);border:0;box-shadow:inset 0 0 0 2px var(--gold),inset 0 -4px 0 #0006;padding:10px 16px;cursor:pointer;text-align:left}
.nextstep:hover{filter:brightness(1.15)}
.nextstep small{display:block;color:var(--gold);font-size:17px;text-transform:uppercase;letter-spacing:.1em}
.nextstep b{font-family:'Pixelify Sans',monospace;font-size:22px}
.nextstep .arrow{margin-left:auto;font-size:28px;color:var(--gold)}
.moonbox{display:flex;flex-direction:column;gap:6px;padding:10px;background:#120f16;box-shadow:inset 0 0 0 2px #6a4a9a}
.moonchecks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px}
.mapcard{font:inherit;color:var(--bone);background:var(--stone);border:0;box-shadow:inset 0 0 0 2px var(--edge2);padding:0 0 8px;cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:left;overflow:hidden}
.mapcard:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--gold)}
.mapcard.cur{box-shadow:inset 0 0 0 3px var(--gold)}
.mapcard.locked{opacity:.6;cursor:not-allowed}
.mscene{display:flex;align-items:center;justify-content:center;height:54px;background:linear-gradient(var(--s1),var(--s2));position:relative}
.mpath{display:flex;gap:5px;align-items:center}
.mpath i{width:6px;height:6px;background:#e4d8c1cc}
.mpath i.b{width:9px;height:9px;background:#e0736c}
.mname{font-family:'Pixelify Sans',monospace;font-size:20px;padding:0 10px}
.mbadges{display:flex;flex-wrap:wrap;gap:4px 10px;padding:0 10px;font-size:18px;color:var(--ash);align-items:center}
.mbadges .ok{color:var(--moss)}
.shopitem{align-items:flex-start}
.bhead{display:flex;gap:14px;align-items:center}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtab{font:inherit;font-size:21px;color:var(--ash);background:var(--stone);border:0;box-shadow:inset 0 0 0 2px var(--edge);padding:6px 14px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.subtab.cur{color:var(--bone);box-shadow:inset 0 0 0 2px var(--gold);background:#221c2b}
.alert-inline{font-family:'Pixelify Sans',monospace;font-size:17px;background:var(--blood);color:#fff;padding:0 5px}
.upgrades{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.upg{display:flex;gap:12px;align-items:center;background:#171320;box-shadow:inset 0 0 0 2px var(--edge2);padding:10px 12px}
.upg.major{box-shadow:inset 0 0 0 2px #7a5a20;background:linear-gradient(#1f1a12,#171320)}
.upg-ico{flex:none;display:flex;align-items:center;justify-content:center;width:64px;height:64px;background:#0f0c13;box-shadow:inset 0 0 0 2px var(--edge)}
.lvpill{font-size:17px;color:#1a1206;background:var(--gold);padding:0 6px;vertical-align:2px}
.nextlv{color:var(--moss);font-size:19px}
.upbtn{display:flex;flex-direction:column;align-items:center;gap:0;flex:none}
.upbtn small{font-size:17px;color:#ffe7ae}
.matbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:#120f16;box-shadow:inset 0 0 0 2px var(--edge);padding:8px 10px}
.matchip{display:inline-flex;align-items:center;gap:2px;font-size:19px;font-variant-numeric:tabular-nums}
.matchip.ok{color:var(--moss)}.matchip.no{color:#e0736c}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.recipe{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--stone);box-shadow:inset 0 0 0 2px var(--edge);padding:10px}
.recipe.ready{box-shadow:inset 0 0 0 2px var(--moss)}
.recipe.wide{flex-direction:row;flex-wrap:wrap;justify-content:space-between;text-align:left}
.needs{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center}
.farmscene{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(#1a2418,#0f140e);box-shadow:inset 0 0 0 2px var(--edge);padding:12px}
.xplabel{display:flex;justify-content:space-between;gap:8px;font-size:19px}
.bar span{position:absolute;inset:0;font-size:17px;line-height:14px;text-align:center;color:#fff;text-shadow:1px 1px 0 #000}
.item{background:var(--stone);box-shadow:inset 0 0 0 2px var(--edge);padding:9px 11px;display:flex;flex-direction:column;gap:3px;font-size:20px;text-align:left;font-family:inherit;color:var(--bone);border:0}
button.item{cursor:pointer}button.item:hover{background:#1f1a27}
.item.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.iname{font-size:22px}
.r-common{color:var(--common)}.r-rare{color:var(--rare)}.r-epic{color:var(--epic)}.r-godlike{color:var(--godlike);text-shadow:0 0 6px #f2a83a66}
.item.r-godlike-b{box-shadow:inset 0 0 0 2px #7a5420}
.r-perfect{color:var(--perfect);text-shadow:0 0 8px #ff5c7a88}
.item.r-perfect-b{box-shadow:inset 0 0 0 2px #8a2438,0 0 12px #ff5c7a33}
.pfx{color:#ffb3c1}
.item.r-epic-b{box-shadow:inset 0 0 0 2px #4d3266}
.item.r-rare-b{box-shadow:inset 0 0 0 2px #2c4466}
.afx{color:#cfe3b8}
.meta{color:var(--dim);font-size:19px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

/* hero detail */
.hdetail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
@media (max-width:800px){.hdetail{grid-template-columns:1fr}}
.dl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:21px}
.dl dt{color:var(--ash)}.dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.gear{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{font:inherit;font-size:19px;background:var(--stone);color:var(--dim);border:0;box-shadow:inset 0 0 0 2px var(--edge);padding:6px 7px;text-align:left;cursor:pointer;min-height:54px;display:flex;flex-direction:column;gap:2px;min-width:0}
.slot:hover{background:#1f1a27}
.slot.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.slot .sl{font-size:17px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.slot .sn{overflow-wrap:anywhere}
.alloc{display:flex;flex-wrap:wrap;gap:6px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}

/* choice cards */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.choice{font:inherit;color:var(--bone);background:var(--stone);border:0;box-shadow:inset 0 0 0 2px var(--edge2),inset 0 -5px 0 rgba(0,0,0,.4);padding:14px 12px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.choice:hover{background:#221c2b;box-shadow:inset 0 0 0 2px var(--gold),inset 0 -5px 0 rgba(0,0,0,.4)}
.choice.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.choice .t{font-family:'Pixelify Sans',monospace;font-size:21px}
.choice .d{color:var(--ash);font-size:19px}

/* run */
.runlay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:860px){.runlay{grid-template-columns:1fr}}
.prog{display:flex;gap:2px;height:10px}
.prog i{flex:1;background:#221c29;min-width:2px}
.prog i.done{background:#6d5a7a}
.prog i.now{background:var(--gold)}
.prog i.boss{background:#5a1f22}
.prog i.boss.done{background:#a3383a}
.scene{position:relative;height:200px;overflow:hidden;background:linear-gradient(var(--s1),var(--s2));box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--edge)}
.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%);pointer-events:none}
.scene .gnd-old{position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--g);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 6px,transparent 6px 12px),linear-gradient(rgba(255,255,255,.08),transparent 6px)}
.scene .hills-old{position:absolute;left:0;right:0;bottom:40px;height:46px;background:var(--h);clip-path:polygon(0 60%,8% 30%,16% 55%,27% 10%,38% 50%,50% 25%,61% 60%,72% 20%,84% 45%,93% 15%,100% 40%,100% 100%,0 100%);opacity:.7}
.actor{position:absolute;bottom:30px;z-index:1}
.actor.hero{left:12%}.actor.foe{right:12%}.actor.mid{left:50%;transform:translateX(-50%)}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.hit{animation:hit .35s steps(3)}
.lunge-r{animation:lungeR .35s steps(4)}
.lunge-l{animation:lungeL .35s steps(4)}
@keyframes lungeR{40%{transform:translateX(26px)}100%{transform:none}}
@keyframes lungeL{40%{transform:translateX(-26px)}100%{transform:none}}
.fo.dying{animation:die .7s steps(5) forwards}
@keyframes die{0%{opacity:1;transform:none;filter:brightness(3)}100%{opacity:.18;transform:translateY(8px) rotate(10deg);filter:grayscale(1)}}
.burst{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--c) 40%,transparent 70%);animation:burst .45s ease-out forwards;pointer-events:none;mix-blend-mode:screen}
.burst.frz{animation-duration:.8s}
@keyframes burst{0%{transform:scale(.3);opacity:1}100%{transform:scale(4);opacity:0}}
.poisoned img{filter:hue-rotate(60deg) saturate(1.4)}
.perfect-aura img{filter:drop-shadow(0 0 4px #ff5c7a)}
.scene.shake{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}
.pop.heal{color:#8fe08a}.pop.miss{color:#bbb;font-size:22px}.pop.lvl{color:var(--gold);font-size:22px;animation-duration:1.6s}
.actor .pop{bottom:calc(100% + var(--dy,0px))}
.enemyturn{animation:pulse 1s steps(2) infinite}
.wind-r .fo{animation:windR var(--wind,.5s) ease-out forwards}
.wind-l .fo{animation:windL var(--wind,.5s) ease-out forwards}
.wind-r .fo img.px,.wind-l .fo img.px{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 2px #e3b341)}
.wind-l .fo img.px{filter:drop-shadow(0 0 4px #ff8a7a) drop-shadow(0 0 2px #c4463f)}
.wind-l.heavy .fo img.px{filter:drop-shadow(0 0 7px #ff4a3a) drop-shadow(0 0 3px #c4463f)}
@keyframes windR{0%{transform:none}70%{transform:translateX(-10px) scale(1.06)}100%{transform:translateX(-8px) scale(1.06)}}
@keyframes windL{0%{transform:none}70%{transform:translateX(10px) scale(1.06)}100%{transform:translateX(8px) scale(1.06)}}
.aimed .fo::after{content:"";position:absolute;inset:8% 14%;border:2px dashed #e0736c;border-radius:50%;animation:aim .5s steps(3) infinite;pointer-events:none}
.hero.aimed .fo::after{border-color:#e0736c}
.foe.aimed .fo::after{border-color:#e3b341}
@keyframes aim{50%{transform:scale(.85);opacity:.6}}
.wbanner{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:6;max-width:92%;padding:4px 12px;background:#0b0a10e6;border:2px solid var(--gold);color:var(--ink,#eee);font-size:1rem;text-align:center;line-height:1.15;box-shadow:0 0 0 2px #000;animation:fadein .15s}
.wbanner.foe{border-color:#e0736c}
.wbanner b{color:var(--gold)}.wbanner.foe b{color:#ff9a8a}
@keyframes pulse{50%{opacity:.55}}
.tb.now{animation:pulse 1.2s steps(2) infinite}
.choice{transition:transform .12s steps(2)}
.choice:hover:not(:disabled){transform:translateY(-3px)}
.r-godlike,.r-perfect{animation:glint 2.4s steps(6) infinite}
@keyframes glint{50%{filter:brightness(1.35)}}
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.7;background-size:120px 120px}
.wx-tundra::before{background-image:radial-gradient(2px 2px at 20px 30px,#fff 50%,transparent 51%),radial-gradient(2px 2px at 80px 70px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 50px 100px,#fff 50%,transparent 51%);animation:fall 6s linear infinite}
.wx-island::before{background-image:radial-gradient(2px 2px at 30px 40px,#ff9a4a 50%,transparent 51%),radial-gradient(1px 1px at 90px 90px,#ffcf6a 50%,transparent 51%);animation:rise 5s linear infinite}
.wx-sky::before{background-image:linear-gradient(170deg,transparent 48%,#9ab4ff55 49% 51%,transparent 52%);background-size:40px 60px;animation:fall 1.2s linear infinite}
.wx-forest::before{background-image:radial-gradient(2px 2px at 40px 20px,#b7e38a 50%,transparent 51%),radial-gradient(1px 1px at 100px 80px,#d8f5a0 50%,transparent 51%);animation:rise 9s linear infinite}
.wx-badlands::before{background-image:radial-gradient(1px 1px at 20px 60px,#e8c79a 50%,transparent 51%),radial-gradient(1px 1px at 70px 20px,#e8c79a 50%,transparent 51%);animation:blow 4s linear infinite}
.wx-abyss::before{background-image:radial-gradient(2px 2px at 60px 60px,#b48cff 50%,transparent 51%),radial-gradient(1px 1px at 20px 100px,#8a6ad6 50%,transparent 51%);animation:rise 12s linear infinite}
@keyframes fall{to{background-position:20px 120px}}
@keyframes rise{to{background-position:-10px -120px}}
@keyframes blow{to{background-position:-120px 10px}}
@keyframes hit{0%{transform:translateX(0);filter:brightness(3)}33%{transform:translateX(6px)}66%{transform:translateX(-6px)}100%{transform:translateX(0)}}
.pop{position:absolute;bottom:100%;left:-20px;right:-20px;text-align:center;z-index:2;font-family:'Pixelify Sans',monospace;font-size:26px;color:#fff;text-shadow:2px 2px 0 #000;animation:pop 1s ease-out forwards}
.pop.crit{color:var(--gold);font-size:32px}
@keyframes pop{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.group{display:flex;align-items:flex-end;gap:10px}.actor.foe.group{right:5%}.actor.hero.group{left:5%}
@media (max-width:560px){.actor.group{gap:4px}.actor.hero.group{transform:scale(.72);transform-origin:bottom left}.actor.foe.group{transform:scale(.72);transform-origin:bottom right}}
.choice.final{background:linear-gradient(#1a1024,#0e0a14);box-shadow:inset 0 0 0 2px #6a4a9a,inset 0 -5px 0 rgba(0,0,0,.4)}
.choice.final:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--dark),inset 0 -5px 0 rgba(0,0,0,.4)}
.choice.final.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.choice.locked{opacity:.6;cursor:not-allowed}
.req{font-size:19px}.req .ok{color:var(--moss)}.req .no{color:#e0736c}
.pcard{padding-bottom:10px;border-bottom:2px solid var(--edge)}
.pcard.cur .hname{color:var(--gold)}
.pcard.down{opacity:.5}
.chip.now{box-shadow:inset 0 0 0 2px var(--gold);color:var(--bone)}
.chip.won{box-shadow:inset 0 0 0 2px var(--dark);color:#d9c8ff}
details summary{cursor:pointer}
.fo{position:relative}
.fo.dead{opacity:.18;filter:grayscale(1)}
.fo.tgt::before{content:"";position:absolute;left:50%;top:-14px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--gold)}
.foelist{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.foecard{font:inherit;color:var(--bone);background:var(--stone);border:0;box-shadow:inset 0 0 0 2px var(--edge);padding:8px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer}
.foecard:disabled{cursor:default}
.foecard.tgt{box-shadow:inset 0 0 0 2px var(--gold)}
.foecard.dead{opacity:.4}
.foecard .bar{display:block}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.trait{font:inherit;font-size:19px;background:#120f16;border:0;padding:1px 8px 3px;cursor:help;position:relative;box-shadow:inset 0 0 0 2px currentColor}
.trait.locked{color:var(--dim);box-shadow:inset 0 0 0 2px var(--edge);border-style:dashed}
.tk-skill{color:#9fc4ee;cursor:help}
.turnbar{display:flex;gap:4px;overflow-x:auto;padding:6px;background:#0f0c13;box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--edge);align-items:stretch}
.turnbar .lbl{font-size:17px;color:var(--ash);writing-mode:vertical-rl;transform:rotate(180deg);text-transform:uppercase;letter-spacing:.1em;flex:none}
.tb{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:58px;padding:4px 2px;font-size:17px;line-height:1;text-align:center;background:var(--stone);box-shadow:inset 0 0 0 2px var(--edge);overflow:hidden}
.tb span{max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb.foe{box-shadow:inset 0 0 0 2px #5a2424;color:#e0a09a}
.tb.now{box-shadow:inset 0 0 0 2px var(--gold);background:#2a2214;color:var(--gold)}
.skillrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.skillbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.skillbtn .sub2{font-size:18px;color:var(--ash)}
.learn{background:#171320;box-shadow:inset 0 0 0 2px var(--gold);padding:8px}
.tk-good{color:#8fcf6f}.tk-neutral{color:#d9c27a}.tk-bad{color:#e0736c}
#tip{position:fixed;z-index:50;max-width:280px;background:#0a0810;color:var(--bone);box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--edge2);padding:7px 10px;font-size:19px;line-height:1.2;pointer-events:none}
[data-tip]{cursor:help}
button[data-tip]{cursor:pointer}
.eltab-wrap{overflow-x:auto}
.eltab{border-collapse:collapse;font-size:18px;font-variant-numeric:tabular-nums;width:100%}
.eltab th,.eltab td{padding:1px 4px;text-align:center;box-shadow:inset 0 -1px 0 var(--edge)}
.eltab thead th{font-family:'Pixelify Sans',monospace;font-size:16px}
.eltab tbody th{color:var(--ash);text-align:left;font-weight:normal}
.eltab td{color:var(--dim)}.eltab td.pos{color:#8fcf6f}.eltab td.neg{color:#e0736c}
.traitdesc{font-size:20px;background:#120f16;box-shadow:inset 0 0 0 2px var(--edge);padding:6px 9px}
.codex summary{cursor:pointer;color:var(--gold);font-size:22px}
.codexlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:3px 16px;font-size:20px}
.stage-label{position:absolute;left:12px;top:10px;z-index:2;font-family:'Pixelify Sans',monospace;font-size:20px;color:#fff;text-shadow:2px 2px 0 #000}
.log{background:#0f0c13;box-shadow:inset 0 0 0 2px var(--edge);padding:8px 10px;font-size:20px;display:flex;flex-direction:column;gap:2px;min-height:130px}
.log p:first-child{color:#fff3dc}
.log p{color:var(--ash)}
.foeinfo{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.tag{font-size:18px;padding:0 6px;box-shadow:inset 0 0 0 2px currentColor;text-transform:uppercase;letter-spacing:.06em}
.summary{box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--gold)}
.summary.dead{box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--blood)}
.grave{display:flex;flex-direction:column;gap:4px;font-size:20px;color:var(--ash)}
.bossmark{color:#e0736c}
@media (prefers-reduced-motion:reduce){.wind-r .fo,.wind-l .fo,.aimed .fo::after,.bob,.hit,.pop,.lunge-r,.lunge-l,.fo.dying,.burst,.scene.shake,.scene::before,.enemyturn,.tb.now,.r-godlike,.r-perfect{animation:none}.pop{opacity:1}.burst{display:none}.fo.dying{opacity:.18}}

/* ---------- 2.5D look ---------- */
.panel{background:linear-gradient(180deg,#231d2b,#1a1621 60%,#17131d);box-shadow:0 0 0 2px #050408,inset 2px 2px 0 #3f3550,inset -2px -2px 0 #0c0a11,0 6px 0 #050408,0 10px 24px #0008}
.btn{box-shadow:0 0 0 2px #060509,inset 2px 2px 0 rgba(255,255,255,.14),inset -2px -3px 0 rgba(0,0,0,.5);background:linear-gradient(#2e2638,#231d2b)}
.btn:hover:not(:disabled){background:linear-gradient(#3a3046,#2b2335)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 2px #060509,inset -2px -2px 0 rgba(255,255,255,.1),inset 2px 3px 0 rgba(0,0,0,.5)}
.btn.gold{background:linear-gradient(#6a4c18,#4a3513);box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--gold),inset 3px 3px 0 rgba(255,240,180,.25),inset -3px -4px 0 rgba(0,0,0,.4)}
.btn.gold:hover:not(:disabled){background:linear-gradient(#7c5a1e,#5a4116)}
.btn.red{background:linear-gradient(#5a2024,#3e1518)}
.btn.on{background:linear-gradient(#35482c,#26351f)}
.card,.item,.choice,.recipe,.bcard,.shopitem,.upg,.mapcard,.foecard,.stile,.subtab{box-shadow:inset 0 0 0 2px var(--edge),inset 2px 2px 0 #ffffff10,inset -2px -2px 0 #0006}
.card,.item,.recipe,.bcard,.shopitem,.foecard{background:linear-gradient(180deg,#1d1924,#141118)}
.item.r-rare-b{box-shadow:inset 0 0 0 2px #2c4466,inset 2px 2px 0 #ffffff10,inset -2px -2px 0 #0006}
.item.r-epic-b{box-shadow:inset 0 0 0 2px #4d3266,inset 2px 2px 0 #ffffff10,inset -2px -2px 0 #0006}
.item.r-godlike-b{box-shadow:inset 0 0 0 2px #7a5420,inset 2px 2px 0 #ffffff10,inset -2px -2px 0 #0006,0 0 14px #f2a83a22}
.item.r-perfect-b{box-shadow:inset 0 0 0 2px #8a2438,inset 2px 2px 0 #ffffff10,inset -2px -2px 0 #0006,0 0 16px #ff5c7a33}
.card.sel,.item.sel,.choice.cur,.mapcard.cur,.subtab.cur,.foecard.tgt,.stile.pri{box-shadow:inset 0 0 0 2px var(--gold),inset 2px 2px 0 #fff2,inset -2px -2px 0 #0006}
.recipe.ready{box-shadow:inset 0 0 0 2px var(--moss),inset 2px 2px 0 #fff2,inset -2px -2px 0 #0006}
.ibox,.upg-ico,.portrait{box-shadow:inset 0 0 0 2px var(--edge),inset 3px 3px 0 #0008;background:radial-gradient(circle at 50% 35%,#2a2234,#0c0a10)}
/* isometric town */
.iso{position:relative;width:100%;max-width:1100px;margin:0 auto;aspect-ratio:326/214;background:radial-gradient(ellipse 60% 50% at 80% 12%,#3a3450 0%,transparent 60%),linear-gradient(#0a0814 0%,#1a1428 45%,#2a1e30 100%);box-shadow:0 0 0 2px #050408,inset 2px 2px 0 #3f3550,0 8px 0 #050408,0 12px 30px #000a;overflow:hidden}
.iso::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(1px 1px at 8% 10%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 22% 22%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 41% 6%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 57% 16%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 69% 4%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 93% 26%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 33% 30%,#fff4 50%,transparent 51%)}
.isoimg{position:absolute;inset:0;width:100%;height:100%}
.iso-title{position:absolute;left:2.5%;top:3%;display:flex;flex-direction:column;text-shadow:2px 2px 0 #000}
.iso-moon{position:absolute;right:3%;top:1.5%;font:inherit;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 0 18px #d9cfb870)}
.iso-moon img{width:clamp(34px,7vw,74px);height:auto}
.spot{position:absolute;font:inherit;background:none;border:0;cursor:pointer;padding:0;display:flex;align-items:flex-end;justify-content:center}
.spot:hover{background:radial-gradient(ellipse at 50% 70%,#ffd98a22,transparent 70%)}
.spot .plaque{transform:translateY(60%);white-space:nowrap;font-size:clamp(11px,1.9vw,18px);box-shadow:0 0 0 1px #000,inset 1px 1px 0 #fff2;background:#120e18e6;color:var(--bone)}
.spot:hover .plaque{color:var(--gold)}
.spot .alert{left:auto;right:10%;top:8%}
.isohero{position:absolute;transform:translate(-50%,-94%);font:inherit;background:none;border:0;cursor:pointer;padding:0;width:4.4%;line-height:0}
.isohero img{width:100%;height:auto;filter:drop-shadow(0 2px 0 #0009)}
.isohero::after{content:"";position:absolute;left:10%;right:10%;bottom:-3%;height:12%;background:radial-gradient(ellipse,#000a,transparent 70%);z-index:-1}
.isohero .alert{top:-30%;left:60%}
.fireflies{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 30% 60%,#ffe08a 50%,transparent 51%),radial-gradient(2px 2px at 64% 72%,#ffe08a 50%,transparent 51%),radial-gradient(1px 1px at 48% 52%,#fff2b0 50%,transparent 51%);animation:ffly 7s ease-in-out infinite alternate;opacity:.7}
@keyframes ffly{to{transform:translate(12px,-10px);opacity:.3}}
.thumb{width:64px;height:auto;filter:drop-shadow(0 3px 0 #0008)}
@media (max-width:720px){.thumb{width:52px}}
/* battle depth */
.lay{position:absolute;left:0;right:0;background-repeat:repeat-x;image-rendering:pixelated;background-size:auto 100%;pointer-events:none}
.lay.far{bottom:34px;height:112px;animation:pan 160s linear infinite;opacity:.9}
.lay.mid{bottom:30px;height:88px;animation:pan 70s linear infinite}
@keyframes pan{to{background-position-x:-640px}}
.scene .gnd{position:absolute;left:0;right:0;bottom:0;height:40px;background-size:100% 100%;image-rendering:pixelated}
.scene .fo::after{content:"";position:absolute;left:8%;right:8%;bottom:-5px;height:8px;background:radial-gradient(ellipse,#000b,transparent 70%);z-index:-1}
.group .fo:nth-child(2){margin-bottom:14px}.group .fo:nth-child(3){margin-bottom:4px}
.actor{z-index:1}
@media (prefers-reduced-motion:reduce){.lay,.fireflies{animation:none}}

/* ---------- touch, zoom and small screens ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,[data-a]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{zoom:var(--z,1)}
.thumb{aspect-ratio:84/74}
@media (pointer:coarse){.btn.small{min-height:36px}.subtab{min-height:40px}}
@media (max-width:420px){body{padding-inline:10px}.panel{padding:12px 10px}}
.zoomctl{display:inline-flex;align-items:center;gap:4px}
.zoomctl .btn{min-width:34px;padding-inline:8px}
.zoomctl span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- gate: thin length bar ---------- */
.lenbar{display:flex;background:#0f0c13;box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--edge);padding:3px;gap:3px}
.lenopt{flex:1 1 0;min-width:0;font:inherit;font-size:20px;color:var(--ash);background:transparent;border:0;padding:4px 4px 5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.lenopt:hover:not(:disabled){color:var(--bone);background:#221c2b}
.lenopt.cur{color:#1a1206;background:var(--gold)}
.lenopt.dark.cur{background:#6a4a9a;color:#fff}
.lenopt:disabled{opacity:.45;cursor:not-allowed}
.lenopt .ls{display:none}
@media (max-width:520px){.lenopt{font-size:18px;padding-inline:2px;text-overflow:clip}.lenopt .lf{display:none}.lenopt .ls{display:inline}}
.lensum{font-size:19px;color:var(--ash)}
.lensum .ok{color:var(--moss)}

/* ---------- battle screen: one fixed stage, no page scroll ---------- */
body.inbattle{overflow:hidden;overscroll-behavior:none}
.bscreen{position:fixed;left:0;top:0;width:calc(100vw / var(--z,1));height:calc(100dvh / var(--z,1));z-index:10;background:var(--void);overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto auto;grid-template-areas:"hdr" "turn" "stage" "roster" "log" "act";gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.bhdr{grid-area:hdr;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-width:0}
.bhdr .ttl{font-family:'Pixelify Sans',monospace;font-size:20px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 140px}
.bhdr .chip{padding:1px 8px 2px 4px;font-size:19px}
.bhdr .btn{font-size:19px;padding:2px 9px 5px}
.tstrip{grid-area:turn;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;align-items:center;min-width:0}
.tstrip::-webkit-scrollbar{display:none}
.tstrip .lbl{font-size:17px;color:var(--ash);text-transform:uppercase;letter-spacing:.08em;flex:none;padding-right:2px}
.tstrip .tb{width:auto;flex-direction:row;gap:3px;padding:2px 6px 2px 3px;font-size:17px}
.tstrip .tb span{max-width:70px}
.scene.stage{grid-area:stage;height:auto;min-height:0;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:28px 2% 10px}
.stage .gnd{height:30%}
.stage .lay.far{bottom:30%;height:42%}
.stage .lay.mid{bottom:29%;height:32%}
.stage .stage-label{font-size:18px;top:6px;left:8px}

.ltile small{font-size:14px;background:#0a0810d9;padding:1px 4px 2px;box-shadow:0 0 0 1px #000;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lootstrip{display:flex;flex-wrap:wrap;gap:10px 12px;padding:8px;background:radial-gradient(ellipse at 50% 30%,#2a2214,#120f16 70%);box-shadow:inset 0 0 0 2px #7a5a20}
.lootstrip .ibox{width:48px;height:48px}
.lt-wrap.fresh,.dropfan.fresh>span{animation:lootpop2 .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes lootpop2{0%{transform:translateY(14px) scale(.3);opacity:0}100%{transform:none;opacity:1}}
.unit .dropfan{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;gap:3px;z-index:4;white-space:nowrap;line-height:1}
.dropfan .ibox{width:32px;height:32px}
.dropfan .ltile small{font-size:12px;max-width:70px}
body.lay-stack .dropfan .ltile small{display:none}
details.rewards summary{cursor:pointer;font-size:17px}
@media (prefers-reduced-motion:reduce){.lt-wrap.fresh,.dropfan.fresh>span{animation:none}}
.unit.down{opacity:1}.unit.down>.fo,.unit.down>.uinfo{opacity:.5}

/* drag and drop */
[data-drag]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.item[data-drag]{cursor:grab}
.dndghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) scale(1.3);filter:drop-shadow(0 4px 8px #000c);line-height:0}
.dndghost img.px{width:48px;height:48px}
body.dragging,body.dragging *{cursor:grabbing!important}
body.dragging [data-drop]{outline:2px dashed #e3b34166;outline-offset:1px}
.dropover{outline:3px solid var(--gold)!important;background:#3a2e14!important}
.dropzone{min-height:40px}
/* main menu */
.mainmenu{max-width:960px;margin:24px auto;display:flex;flex-direction:column;gap:14px}
.mm-title{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.mm-title .logo{font-size:clamp(28px,6vw,46px)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.slotcard{display:flex;flex-direction:column;gap:8px;padding:14px;background:linear-gradient(180deg,#231d2b,#17131d);box-shadow:0 0 0 2px #050408,inset 0 0 0 2px var(--edge2)}
.slotcard.cur{box-shadow:0 0 0 2px #050408,inset 0 0 0 2px var(--gold)}

/* ? rooms */
.qm{font-family:'Pixelify Sans',monospace;font-size:24px;color:var(--gold);text-shadow:1px 1px 0 #000;line-height:1}
.mnode.big .qm{font-size:28px}
.wheelbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative}
.wheel{width:clamp(140px,26vw,200px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 4px #060509,0 0 0 7px #7a5a20,0 8px 20px #000a;image-rendering:pixelated}
.wheel.spin{animation:wheelspin 2.6s cubic-bezier(.15,.8,.2,1) forwards}
@keyframes wheelspin{from{transform:rotate(0)}to{transform:rotate(var(--deg))}}
.wheelptr{position:absolute;left:calc(clamp(140px,26vw,200px)/2 - 10px);top:-12px;z-index:2;border:10px solid transparent;border-top:18px solid var(--bone);filter:drop-shadow(0 2px 0 #000)}
.wheelkey{display:flex;flex-direction:column;gap:3px;font-size:17px}
.wheelkey i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px #000}
.wheelres{animation:fadein .4s 2.5s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.wheel.spin{animation-duration:.01s}.wheelres{animation:none}}

/* merchant */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:6px}
.shopcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;background:linear-gradient(180deg,#1d1924,#141118);box-shadow:inset 0 0 0 2px var(--edge)}
.shopcard .iname{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shopcard .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shopcard.sold{opacity:.45}
.shopcard.r-rare-b{box-shadow:inset 0 0 0 2px #2c4466}.shopcard.r-epic-b{box-shadow:inset 0 0 0 2px #4d3266}.shopcard.r-godlike-b{box-shadow:inset 0 0 0 2px #7a5420}

.govwrap{max-width:860px;margin:18px auto;display:flex;flex-direction:column;gap:14px;align-items:center;padding:12px;text-align:center}
.govscene{position:relative;width:min(100%,640px);aspect-ratio:16/9;box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--gold);overflow:hidden;background:#0b0810}
.govscene img{width:100%;height:100%;display:block;image-rendering:pixelated;animation:govpan 7s ease-out both}
@keyframes govpan{from{transform:scale(1.08)}to{transform:scale(1)}}
.smokefx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% 80%,#1a1020cc,transparent 55%),radial-gradient(ellipse at 80% 70%,#120c18cc,transparent 50%);animation:smoke 6s ease-in-out infinite alternate;mix-blend-mode:multiply}
@keyframes smoke{from{transform:translateX(-4%);opacity:.6}to{transform:translateX(4%);opacity:1}}
.govtext{font-size:22px;max-width:620px;min-height:3.2em;animation:govfade .8s ease both}
@keyframes govfade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.govcreate{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:center;text-align:left}
.govportrait{padding:12px;background:radial-gradient(#2a2135,#140f1b);box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--gold)}
.govportrait img{display:block;image-rendering:pixelated}
.govopt{display:flex;gap:6px;align-items:center}.govopt .lab{width:112px}.govopt b{min-width:170px;text-align:center}
.govopt .btn.on{box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold)}
.govans{display:grid;gap:8px;width:min(100%,620px)}.govans .choice{text-align:left}
.govresult{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:center;text-align:left;padding:16px;box-shadow:0 0 0 2px #060509,inset 0 0 0 3px var(--pc);background:linear-gradient(#1d1726,#140f1b);animation:govfade .8s ease both}
.profname{color:var(--pc);font-size:34px;margin:0}.profbuff{color:var(--gold);font-size:20px}
.govcard{display:flex;gap:10px;align-items:center;padding:8px;margin-bottom:8px;box-shadow:inset 0 0 0 2px var(--pc,#555);background:#120d18;cursor:help}
.govcard .gn{display:flex;flex-direction:column;line-height:1.1}.govcard small{color:var(--pc)}
@media (prefers-reduced-motion:reduce){.govscene img,.smokefx,.govtext,.govresult{animation:none}}

.top{position:relative}
.govbadge{position:relative;align-self:center}
.govface{padding:2px;background:radial-gradient(#2a2135,#140f1b);box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--pc);cursor:pointer;display:block;line-height:0}
.govface img{display:block;image-rendering:pixelated}
.govface:hover{box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--gold)}
.govsay{position:absolute;left:0;top:calc(100% + 12px);z-index:45;width:min(380px,calc(100vw / var(--z,1) - 32px));padding:10px 12px;background:#f1e6cf;color:#241a14;box-shadow:0 0 0 2px #060509,4px 4px 0 #000a;font-size:20px;line-height:1.2;animation:govfade .4s ease both;text-align:left;white-space:normal}
.govsay::before{content:'';position:absolute;left:18px;top:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#f1e6cf}
.govsay .who{font-weight:bold;color:#7a3b1c;font-size:17px}.govsay p{margin:4px 0 8px}

.govrank{position:absolute;right:-6px;bottom:-6px;min-width:20px;height:20px;line-height:20px;text-align:center;background:var(--pc);color:#140f1b;font-size:16px;box-shadow:0 0 0 2px #060509}
.govrank.up{background:var(--gold);animation:govpulse 1s ease-in-out infinite alternate}
@keyframes govpulse{to{transform:scale(1.25)}}
.govface{position:relative}
.govpicks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.govpick{text-align:left;box-shadow:inset 0 0 0 2px var(--pc)!important}.govpick .d{display:block;font-size:18px;color:var(--bone)}

.storycard{max-width:700px;width:calc(100% - 24px);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:govfade .6s ease both}
.storycard h2{margin:0;color:var(--gold)}.storycard .govtext{font-size:20px;min-height:0}

.mirrorwrap{max-width:900px;width:100%;box-sizing:border-box;min-width:0}
.mirrorsay{font-size:24px;min-height:0;margin:0}
.mroom{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;overflow:hidden;box-shadow:0 0 0 2px #060509,inset 0 0 0 2px var(--gold);
  background:linear-gradient(#3a2c34 0 72%,#4a3226 72% 100%)}
.mroom::after{content:'';position:absolute;left:0;right:0;top:72%;height:28%;background:repeating-linear-gradient(90deg,#0000 0 46px,#0003 46px 48px)}
.mwin{position:absolute;left:4%;top:10%;width:18%;height:38%;background:linear-gradient(#f3b36a,#f7d99a 60%,#b9d3e8);box-shadow:0 0 0 4px #2a1c18,inset 0 0 0 3px #2a1c18;overflow:hidden}
.mwin::before{content:'';position:absolute;left:48%;top:0;bottom:0;width:4px;background:#2a1c18;z-index:2}.mwin::after{content:'';position:absolute;top:48%;left:0;right:0;height:4px;background:#2a1c18;z-index:2}
.msun{position:absolute;left:30%;top:40%;width:36%;aspect-ratio:1;border-radius:50%;background:#fff1c4;box-shadow:0 0 20px 8px #ffd98a}
.mbeam{position:absolute;inset:0;background:linear-gradient(115deg,#ffd98a55 8%,#ffd98a22 30%,#0000 55%);pointer-events:none;z-index:3}
.mirror{position:absolute;left:34%;top:6%;width:27%;height:90%;padding:8px;background:linear-gradient(#b08a3e,#7a5a26);box-shadow:0 0 0 3px #1a120c,6px 6px 0 #0006;z-index:1}
.mglass{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#6e6a78 0%,#4a4656 45%,#3a3040 100%);box-shadow:inset 0 0 0 2px #1a120c}
.mglass::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,#fff0 30%,#fff3 38%,#fff0 46%,#fff0 60%,#fff2 64%,#fff0 70%);pointer-events:none}
.mfloor{position:absolute;left:0;right:0;bottom:0;height:22%;background:#4a3226}
.mref{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:62%;height:auto;image-rendering:pixelated}
.mme{position:absolute;right:6%;bottom:-14%;width:30%;height:auto;image-rendering:pixelated;z-index:4;filter:drop-shadow(-6px 0 0 #0005)}
.mdark{position:absolute;inset:0;background:#030206;opacity:0;pointer-events:none;z-index:5}
.mctl{text-align:left}
.dawn .mdark{animation:mdawn 4.5s ease-in .4s both}
.dawn .msun{animation:msun 4.5s ease-out .4s both}
.dawn .mbeam{animation:mfadein 3s ease-in 2.4s both}
.dawn .mref{animation:mfadein 2.2s ease-in 2.6s both}
.dawn .mctl,.dawn .mirrorsay{animation:govfade 1s ease 4.4s both}
@keyframes mdawn{0%{opacity:1}35%{opacity:.9}100%{opacity:0}}
@keyframes msun{from{top:110%;background:#ff9a5a}to{top:40%}}
@keyframes mfadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dawn .mdark,.dawn .msun,.dawn .mbeam,.dawn .mref,.dawn .mctl,.dawn .mirrorsay{animation:none}}
.govhint{font-size:22px;margin:0}.govhint.small{font-size:19px;color:var(--ash)}
.storycard.govresult{flex-direction:column}
.march{gap:8px;flex-wrap:wrap}.mslot{display:flex;flex-direction:column;gap:4px;padding:8px 10px;background:var(--stone);box-shadow:inset 0 0 0 2px var(--edge);min-width:180px;flex:1}
.lands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.land{font:inherit;color:var(--bone);display:flex;gap:8px;align-items:center;padding:6px 10px;border:0;cursor:pointer;background:var(--stone);box-shadow:inset 0 0 0 2px var(--edge);text-align:left}.land span{display:flex;flex-direction:column;line-height:1.05}.land small{color:var(--c)}.land.cur{box-shadow:inset 0 0 0 2px var(--c);background:#241c2c}
.stranger p{margin:6px 0 2px}.stranger ul{margin:0 0 4px 20px;padding:0}.stranger li{font-size:19px;color:var(--ash)}
.spot.mystery{cursor:default}.spot.mystery .plaque{color:var(--ash)}
.scrapline{flex-basis:100%;display:flex;gap:4px 10px;flex-wrap:wrap;justify-content:flex-end;font-size:17px;color:var(--ash);cursor:help}
.scrapline .matchip{display:inline-flex;align-items:center;gap:3px}.scrapline b{color:var(--bone)}.scrapline small{font-size:15px}
.runhdr .scrapline{margin-top:4px}
@keyframes guidepulse{0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 6px 2px #e3b34166}50%{box-shadow:0 0 0 3px #ffe08a,0 0 18px 6px #e3b341aa}}
.guide{animation:guidepulse 1.1s ease-in-out infinite;position:relative;z-index:2}
.spot.guide{border-radius:6px}.spot.guide .plaque{color:#ffe08a;box-shadow:0 0 0 2px var(--gold)}
.guidehint{color:#ffe08a;font-weight:bold;margin:2px 0;animation:govfade .6s ease both}
@media (prefers-reduced-motion:reduce){.guide{animation:none;box-shadow:0 0 0 3px var(--gold)}}
.top:has(> .scrapline){padding-bottom:24px}.top>.scrapline{position:absolute;right:0;bottom:0;left:0}
@media (max-width:700px){.top:has(> .scrapline){padding-bottom:0;flex-wrap:wrap}.top>.scrapline{position:static;flex:1 0 100%}}
.coach{padding:10px 12px;margin:6px 0 10px;background:#f1e6cf;color:#241a14;box-shadow:0 0 0 2px #060509,4px 4px 0 #000a}
.coach .who{font-weight:bold;color:#7a3b1c;font-size:17px}.coach p{margin:0;font-size:20px;line-height:1.2}.coach .btn{color:var(--bone)}
.coach .tk-good{color:#2f7a1e}.coach .tk-neutral{color:#8a6a10}.coach .tk-bad{color:#a8322a}.coach .hpc{color:#a8322a}.coach .mpc{color:#2a4ea8}
.hpc{color:#e0736c}.mpc{color:#7a9ae8}
.card.tut-card{animation:guidepulse 1.1s ease-in-out infinite}
.tut-top [data-tut=top],.tut-vit [data-tut=vit],.tut-traits [data-tut=traits],.tut-skills [data-tut=skills],.tut-xp [data-tut=xp],.tut-stats [data-tut=stats],.tut-el [data-tut=el],.tut-go [data-tut=go]{animation:guidepulse 1.1s ease-in-out infinite;position:relative;z-index:2;border-radius:2px}
.tut-go [data-tut=go] .btn{animation:guidepulse 1.1s ease-in-out infinite}
.bup{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;padding:6px 10px;background:#171320;box-shadow:inset 0 0 0 2px var(--gold);max-width:48%;cursor:help}
.bup .bup-eff{font-size:17px;color:var(--ash)}.bup .needs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
@media (max-width:640px){.bhead{flex-wrap:wrap}.bup{max-width:none;flex:1 0 100%;align-items:stretch;text-align:left}}

/* ===== landscape layouts: Computer (wide) and Phone (side) ===== */
.rotate{display:none}
@media (orientation:portrait) and (max-width:700px){
  .rotate{display:flex;position:fixed;inset:0;z-index:200;background:var(--void);flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
  .rotate p{font-size:28px;color:var(--gold)}.rot-ph{width:46px;height:80px;border:4px solid var(--bone);border-radius:8px;animation:rotph 2s ease-in-out infinite}
  @keyframes rotph{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(90deg)}100%{transform:rotate(90deg)}}
}
/* battle: fighters on top, then actions (left) beside a tall battle log (right) */
body .bscreen{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(240px,34%)!important;
  grid-template-rows:auto auto clamp(200px,40dvh,440px) auto minmax(0,1fr)!important;
  grid-template-areas:"hdr hdr" "turn turn" "stage stage" "roster roster" "act log"!important}
body .bscreen .actbar{grid-area:act;overflow-y:auto;min-height:0}
body .bscreen .blogpanel{grid-area:log;height:auto!important;min-height:0;overflow-y:auto;display:block;cursor:default;white-space:normal;padding:4px 8px;font-size:17px;line-height:1.2}
.blogpanel .blogtitle{display:block;position:sticky;top:-4px;background:#0f0c13;color:var(--gold);font-size:16px;letter-spacing:1px;text-transform:uppercase;padding:2px 0}
.blogpanel p{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;padding:1px 0;border-bottom:1px solid #1f1a26}
.blogpanel p:nth-child(2){color:#fff3dc}.blogpanel p:nth-child(n+8){opacity:.7}
body .bscreen .skgrid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:4px}body .bscreen .skgrid .btn{min-width:0;width:100%}
body .bscreen .skgrid .sub2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal!important}
body .bscreen .skgrid .btn{padding:2px 6px 4px;font-size:18px}
body .bscreen .skgrid .sub2{font-size:15px}
/* phone (landscape): shorter stage, the unit bars live inside it, everything tighter */
body.lay-side .bscreen{grid-template-rows:auto auto clamp(120px,44dvh,260px) minmax(0,1fr)!important;grid-template-areas:"hdr hdr" "turn turn" "stage stage" "act log"!important;grid-template-columns:minmax(0,1fr) minmax(170px,32%)!important;gap:4px!important}
body.lay-side .bscreen .roster{display:none!important}
body.lay-side .bscreen .skgrid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
body.lay-side .bscreen .skgrid .btn{font-size:16px}body.lay-side .bscreen .skgrid .sub2{font-size:13px}
body.lay-side .bscreen .blogpanel{font-size:14px}
body.lay-side .bscreen .acthead .tinfo{display:none}
/* damage, heals and crits are drawn over the fighter so they never fall off the top of the stage */
.bscreen .marks{bottom:auto!important;top:4%;flex-wrap:wrap;justify-content:center;max-width:180%;row-gap:2px}
.bscreen .mark{font-size:22px}.bscreen .mark.crit{font-size:28px;color:#ffd35a;box-shadow:0 0 0 2px var(--gold);animation:markin .35s steps(3),critglow 1s ease-in-out 2}
@keyframes critglow{50%{box-shadow:0 0 0 2px #fff3a0,0 0 12px 3px #e3b341}}
body.lay-side .bscreen .mark{font-size:17px}body.lay-side .bscreen .mark.crit{font-size:21px}

/* Computer: use the whole landscape window */
body.dev-pc .wrap{max-width:min(1680px,100%)}
body.dev-pc .townwrap{grid-template-columns:minmax(0,1fr) minmax(320px,380px)}
body.dev-pc .runlay{grid-template-columns:minmax(0,1fr) 380px}
body.dev-pc .iso{width:min(100%,calc((100dvh - 210px / var(--z,1)) * 326 / 214))}
.linkbtn{white-space:nowrap}
/* Phone (landscape): a slim header, the town and map sized to the short screen */
body.dev-phone{padding-inline:8px;padding-block:6px 20px}
body.dev-phone .wrap{max-width:none;gap:6px}
body.dev-phone .top{flex-wrap:nowrap;gap:6px}
body.dev-phone .top .logo{font-size:18px}body.dev-phone .top .logo small,body.dev-phone .top .sub{font-size:15px}

body.dev-phone .top .chip{font-size:16px;padding:0 5px}body.dev-phone .top .chip .lbl{display:none}
body.dev-phone .top .res{flex-wrap:nowrap;gap:4px}body.dev-phone .top .btn.small{font-size:16px;padding:1px 6px 3px}
body.dev-phone .govface img{width:26px;height:39px}
body.dev-phone .townwrap{grid-template-columns:minmax(0,1fr) minmax(230px,34%);gap:6px}
body.dev-phone .hrail{max-height:calc(100dvh / var(--z,1) - 70px)}
body.dev-phone .panel{padding:6px 8px}
body.dev-phone .iso{width:min(100%,calc((100dvh / var(--z,1) - 150px) * 326 / 214));min-width:0}
body.dev-phone .nextstep{padding:4px 10px}body.dev-phone .nextstep b{font-size:18px}

body.dev-phone .runhdr{padding:4px 8px}body.dev-phone .runhdr h2{font-size:18px}

.unit.tgt .uinfo{box-shadow:0 0 0 2px #000!important}

.intentarrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}

body .bscreen .skgrid.atk4{grid-template-columns:repeat(4,minmax(0,1fr))!important}
.skillbtn.stance{box-shadow:inset 0 0 0 2px #8fa8c8}

let crashShown=false;
function showCrash(msg){
  if(crashShown)return;crashShown=true;
  try{
    const d=document.createElement('div');
    d.setAttribute('role','alertdialog');
    d.style.cssText='position:fixed;inset:0;z-index:9999;background:#000d;display:flex;align-items:center;justify-content:center;padding:16px;font:20px VT323,monospace;color:#e4d8c1';
    d.innerHTML=`<div style="max-width:520px;width:100%;background:#1c1823;box-shadow:0 0 0 2px #060509,inset 0 0 0 2px #c4463f;padding:16px;display:flex;flex-direction:column;gap:10px">
      <b style="font-size:26px;color:#f0a070">Something went wrong</b>
      <span>The game hit an error. Your town is saved. Try one of these:</span>
      <code style="font-size:15px;color:#9a8fa4;word-break:break-word;max-height:120px;overflow:auto">${String(msg).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]).slice(0,600)}</code>
      <button data-c="reload" style="font:inherit;padding:6px;background:#4a3513;color:#ffe7ae;border:0;box-shadow:inset 0 0 0 2px #e3b341;cursor:pointer">Reload the game</button>
      <button data-c="town" style="font:inherit;padding:6px;background:#262030;color:#e4d8c1;border:0;box-shadow:inset 0 0 0 2px #574b67;cursor:pointer">Return to town (ends the current adventure, heroes come home)</button>
      <button data-c="close" style="font:inherit;padding:6px;background:#262030;color:#e4d8c1;border:0;box-shadow:inset 0 0 0 2px #574b67;cursor:pointer">Close this and keep playing</button></div>`;
    d.addEventListener('click',ev=>{const c=ev.target.dataset&&ev.target.dataset.c;if(!c)return;
      if(c==='close'){d.remove();crashShown=false;return}
      if(c==='town'){try{if(state&&state.run){state.run=null;state.screen='town';state.tab='town';save()}}catch(e){}}
      location.reload()});
    document.body.appendChild(d);
  }catch(e){}
}

const sprCache={};
function sprite(name,tint,scale=4,cls=''){
  const key=name+'|'+tint;
  if(!sprCache[key]){
    // Drawn at 2× with light from above, shadow below and a cool moonlight rim on the right.
    const rows=SPR[name],w=rows[0].length,h=rows.length,Rs=new Raster(w*2,h*2);
    const at=(x,y)=>y<0||y>=h||x<0||x>=w?'.':rows[y][x],edge=ch=>ch==='.'||ch==='k';
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=at(x,y);if(ch==='.')continue;
      if(ch==='k'){for(const [dx,dy] of [[0,0],[1,0],[0,1],[1,1]])Rs.set(2*x+dx,2*y+dy,[10,8,16]);continue}
      const base=hexRgb(ch==='A'?(tint||'#888'):PAL[ch]);let tl=base,tr=base,bl=base,br=base;
      if(edge(at(x,y-1))){tl=lit(tl,.24);tr=lit(tr,.2)}
      if(edge(at(x-1,y))){tl=lit(tl,.12);bl=lit(bl,.06)}
      if(edge(at(x,y+1))){bl=lit(bl,-.3);br=lit(br,-.32)}
      if(edge(at(x+1,y))){tr=mixc(tr,[170,190,255],.3);br=mixc(br,[150,170,240],.24)}
      if(!edge(at(x,y-1))&&!edge(at(x,y+1))&&(x+y)%2===0)br=lit(br,-.07);
      Rs.set(2*x,2*y,tl);Rs.set(2*x+1,2*y,tr);Rs.set(2*x,2*y+1,bl);Rs.set(2*x+1,2*y+1,br)}

  const s=sprCache[key];
  return `<img class="px ${cls}" src="${s.url}" width="${s.w*scale}" height="${s.h*scale}" alt="">`;
}

const ISO={T:12,H:6,N:12,W:326,Hh:214,ox:163,oy:60,horizon:63};

function drawBox(R,ox,oy,gx,gy,a,b,h,wall,roof,roofH){

  R.poly([left,bottom,U(bottom),U(left)],texWall(W,-.4));
  R.poly([bottom,right,U(right),U(bottom)],texWall(W,-.08));
  for(let y=Math.round(U(bottom)[1]);y<bottom[1];y++)R.set(bottom[0],y,lit(W,.3));

    const ex=(p,o)=>[p[0]+Math.sign(Math.round(p[0]-c[0]))*o,p[1]+Math.sign(Math.round(p[1]-c[1]))*o*.5];

    if(k==='lastStand')return 'Once per adventure, survives a killing blow with 1 health';
    if(k==='openCrit')return 'First attack in each battle always crits';
    if(k==='firstStrike')return 'Always takes the first turn in battle';
    if(k==='slow')return 'Starts every battle a full turn behind';
    if(k==='chestTrap')return v<0?'Never triggers mimics':`Mimics are ${1+v/100}× as common`;
    if(k==='luck'&&v<0)return `${-v}% chance for loot to roll a rarity lower`;
    if(k.startsWith('res_'))return `${v>0?'+':''}${v}% ${cap(k.slice(4))} resistance`;
    if(k.startsWith('tk_'))return `${v>0?'+':''}${v}% ${cap(k.slice(3))} damage taken`;
    if(k==='tkAll')return `${v>0?'+':''}${v}% damage taken from every element`;
    if(/^(str|agi|int|per|end|cha|lck)Pct$/.test(k))return `${v>0?'+':''}${v}% ${STATN[k.slice(0,3)]}`;
    if(k==='spdPct')return `${v>0?'+':''}${v}% speed`;
    if(k.startsWith('dmg_'))return `${v>0?'+':''}${v}% ${cap(k.slice(4))} damage`;
    const suf=TRAIT_TXT[k];return `${v>0?'+':''}${v}${suf.startsWith('%')||suf.startsWith(' ')?suf:' '+suf}`;
  }).join('. ')+'.';

  const F=eventBonus(),luck=partyTr('gamble')/100;
  const jack=clamp(.05+F/1000,.02,.1),win=clamp(.45+luck+F/200,.25,.6),item=clamp(.1+F/500,.04,.2),gold=clamp(.5+luck+F/200,.3,.7);
  return {F,jack,win,item,gold,cost:clamp(.2*(1-F/200),.15,.28),pay:1+F/100};
}
function gamble(x){
  const r=state.run,h=runHero(),s=r.stage,O=strangerOdds();let text;
  if(x==='coin'){
    const w=Math.floor(r.gold/2),roll=Math.random();
    if(roll<O.jack){r.gold+=w*4;text=`<b class="gold">JACKPOT.</b> The stranger laughs and pays out ${w*5} gold.`}
    else if(roll<O.jack+O.win){r.gold+=w;text=`The coin lands your way. <b class="gold">+${w} gold</b>.`}
    else{r.gold-=w;text=`The coin lands wrong. You lose <b>${w} gold</b>.`}
  }else if(x==='blood'){
    const cost=Math.round(maxHp(h)*O.cost);h.hp=Math.max(1,h.hp-cost);const roll=Math.random();
    if(roll<O.item){const it=makeItem('elite',ilvl()+1,h.cls);const ln=[];addLoot(it,ln,'');text=`${esc(h.name)} bleeds ${cost} HP. The stranger hands over something wrapped in cloth: ${ln[0]}.`}
    else if(roll<O.item+O.gold){const g=Math.round(goldAmt(25+8*s)*O.pay);r.gold+=g;text=`${esc(h.name)} bleeds ${cost} HP. The stranger pays <b class="gold">${g} gold</b>.`}

      for(const x of pool)if(x.it.rarity!=='perfect'&&chance(T.item)){dropped.push(x.it);if(x.h){x.h.gear[x.sl]=null;x.h.hp=Math.min(x.h.hp,maxHp(x.h))}else r.loot=r.loot.filter(y=>y!==x.it)}

      if(spoiled)lines.push(`<span class="muted">${spoiled} unused farm and still ration${spoiled>1?'s':''} spoiled on the way home.</span>`)}
    for(const h of survivors){h.runs++;h.elixir=null;h.draught=null}
    {let n=0;for(const h of survivors)for(const sl of SLOTS)if(h.gear[sl]){state.bank.push(h.gear[sl]);h.gear[sl]=null;n++}if(n)lines.push(`${n} piece${n>1?'s':''} of gear went back to the stash. Equip the party again before the next adventure.`)}
    lines.push(`Brought home <b class="gold">${r.gold} gold</b> and ${r.loot.length} item${r.loot.length===1?'':'s'}.`);

      const can=Object.keys(OPEN_WEEK).filter(canBuild);if(can.length)lines.push(`<b class="gold">The builders can finish the ${listNames(can.map(k=>({bank:'Bank',smith:'Weaponsmith',farm:'Farm',witch:'Witch'})[k]))} with your scrap. Visit it in town.</b>`)}
    if(r.scrolls)lines.push(`${r.scrolls} unused Return Scroll${r.scrolls>1?'s':''} returned to the bank.`);
    if(fallenAll.length)lines.push(`<span class="warn">Lost on the way: ${esc(listNames(fallenAll))}.</span>`);
  }

    lines.push(`<b class="gold">Word of the safe return spreads. ${c==='archer'?'Archers':'A mage'} ${c==='archer'?'have':'has'} come to the Barracks asking to join.</b>`)}
  if(state.hideBld){state.reveal=state.reveal||{};const nb=[];

    {const rk=BADGE_RANK[r.length]||0,got=survivors.filter(h=>(h.badge||0)<rk);for(const h of got)h.badge=rk;
     if(got.length)lines.push(`<b class="gold">${esc(listNames(got.map(h=>h.name)))} earned the ${BADGE_N[rk]} badge!</b> ${rk<4?`${LENGTHS[Object.keys(BADGE_NEED).find(k=>BADGE_NEED[k]===rk)].name} adventures are now open to any party with ${got.length>1?'them':'this hero'}.`:''}`)}
    const G=state.gov;if(G&&['medium','long','expedition'].includes(r.length)&&!(G.miles||[]).includes(r.length)){(G.miles=G.miles||[]).push(r.length);G.pend=(G.pend||0)+1;if(!G.ranks)G.ranks={[G.prof]:1};

  state.summary={outcome,cls:(lead||{cls:'warrior'}).cls,title,sub:`${LENGTHS[r.length].name} · ${sub} A week passes.`,lines};
  for(const h of state.heroes)h.fat=0;

function govTipNow(){
  if(!state.gov||state.gov.unseen||state.run||state.summary||storyNext())return null;
  // stay quiet while a walkthrough is on screen
  if((state.tab==='farm'&&coachOn('farm'))||(state.tab==='witch'&&state.sel.wtab==='mana'&&coachOn('mana'))||(state.tab==='heroes'&&tutBOn()))return null;
  const seen=state.tipsSeen||(state.tipsSeen=[]);
  if(state.gov.pend&&state.promoWeek!==state.week&&(!state.tipCur||state.tipCur.id!=='promo'))state.tipCur={id:'promo',t:`The roads we conquered have earned me the town’s trust. I can grow into a better governor. How should I?`,go:['@govPromoOpen','Choose promotion']};
  const c=state.tipCur;
  if(c&&c.id==='promo'){if(state.gov.pend&&state.promoWeek!==state.week)return c;state.tipCur=null}
  if(set.govTips===false)return null; // tips switched off in Settings (promotions above still show)
  else if(c&&c.id!=='g'){const T=GOV_TIPS.find(t=>t.id===c.id);if(T&&T.when())return {id:T.id,t:T.t(),go:T.go?T.go():null};state.tipCur=null}

  const T=GOV_TIPS.find(t=>!seen.includes(t.id)&&t.when());

  if(T){state.tipCur={id:T.id};return {id:T.id,t:T.t(),go:T.go?T.go():null}}
  if(state.week>=2){state.tipCur={id:'g',t:GOV_GENERAL[(state.week*5)%GOV_GENERAL.length],go:null};return state.tipCur}
  return null;
}

function dmgRange(h,o,el){

function witchReroll(it,k,line){
  const R=RAR[it.rarity],pool=()=>AFFIXES.filter(a=>!it.affixes.some(x=>x.k===a.k));
  if(k==='full'){const n=it.affixes.length;it.affixes=[];for(let i=0;i<n;i++)it.affixes.push(rollAffix(pick(pool()),R.m,it.ilvl));return 'Every bonus has been rewritten.'}
  if(k==='values'){it.affixes=it.affixes.map(a=>rollAffix(AFX[a.k],R.m,it.ilvl));return 'The same bonuses, new strengths.'}
  if(k==='line'){const i=+line;if(!it.affixes[i])return null;const old=AFX[it.affixes[i].k].l,cand=AFFIXES.filter(a=>!it.affixes.some((x,j)=>j!==i&&x.k===a.k)&&a.k!==it.affixes[i].k);it.affixes[i]=rollAffix(pick(cand),R.m,it.ilvl);return `${old} became ${AFX[it.affixes[i].k].l}.`}
  if(k==='base'){if(it.slot==='weapon')it.base=Math.round(WBASE[it.cls]*(1+it.ilvl*.12)*rand(.9,1.05+R.m*.06));else if(ARMOR_BASE[it.slot])it.base=Math.max(1,Math.round(ARMOR_BASE[it.slot]*CLS_ARM[it.cls||it.wt||'archer']*(1+it.ilvl*.1)*rand(.9,1.15)));else return null;return `New base: ${it.base}.`}
  return null;
}

// How many of each supply go along. Default: one of each kind in turn until the Supply Pack is full.
function packPlan(){
  const cap=packCap(),own=Object.fromEntries(Object.entries(state.items||{}).filter(([id,n])=>n>0&&CONSUMABLES[id]));
  if(state.sel.pack){const out={};let room=cap;for(const id of Object.keys(own)){const n=Math.max(0,Math.min(own[id],state.sel.pack[id]||0,room));if(n){out[id]=n;room-=n}}return out}
  const out={};let room=cap,moved=true;while(room>0&&moved){moved=false;for(const id of Object.keys(own))if(room>0&&(out[id]||0)<own[id]){out[id]=(out[id]||0)+1;room--;moved=true}}return out;
}
function packBlock(){
  const plan=packPlan(),cap=packCap(),used=Object.values(plan).reduce((a,n)=>a+n,0),ids=Object.keys(state.items||{}).filter(id=>state.items[id]>0&&CONSUMABLES[id]);
  const free=freeSupplies();
  return `<div class="packblk"><div class="row" style="justify-content:space-between"><h3>Supplies · ${used}/${cap}</h3>${ids.length?`<span class="row" style="gap:6px"><button class="btn small" data-a="packAll" data-x="0">None</button><button class="btn small" data-a="packAll" data-x="1">Fill</button></span>`:''}</div>
    ${ids.length?`<div class="packrows">${ids.map(id=>{const n=plan[id]||0;return `<div class="packrow" data-tip="${esc(CONSUMABLES[id].d)}">${consIco(id,2)}<span class="pn">${CONSUMABLES[id].n}</span><span class="muted">of ${state.items[id]}</span>
      <button class="btn small pm" data-a="packAdj" data-x="${id}|-1" ${n<=0?'disabled':''} aria-label="One fewer">−</button><b class="num pc">${n}</b><button class="btn small pm" data-a="packAdj" data-x="${id}|1" ${n>=state.items[id]||used>=cap?'disabled':''} aria-label="One more">+</button></div>`}).join('')}</div>`:'<p class="muted">No supplies in town. The Witch sells them.</p>'}
    ${free.length?`<p class="muted" style="font-size:17px">Also packed free: ${free.map(([id,q])=>`${consIco(id,2)}${q} ${CONSUMABLES[id].n}`).join(', ')} (no pack space).</p>`:''}
    <p class="muted" style="font-size:17px">Whatever you leave behind stays in storage for later, and unused supplies you bring come home. Bigger Supply Pack: Bank.</p></div>`;
}

function autoEquipParty(){
  const P=(state.sel.party||[]).map(heroById).filter(Boolean);
  for(const h of P)for(const it of state.bank.slice().sort((a,b)=>itemScore(b)-itemScore(a))){
    if(it.cls&&it.cls!==h.cls)continue;const sl=equipSlotFor(it,h);if(itemScore(it)>itemScore(h.gear[sl])){state.bank=state.bank.filter(x=>x!==it);if(h.gear[sl])state.bank.push(h.gear[sl]);h.gear[sl]=it}}
}

/* ---------- drag and drop gear ----------
   Mouse: press and drag. Touch: press and hold for a moment, then drag.
   Sources: data-drag="bank:<id>" | "pack:<id>" | "gear:<heroId>|<slot>".  Targets: data-drop="gear:<heroId>|<slot>" | "bank" | "pack". */
function dropItem(src,dst){
  const [sk,sv]=src.split(/:(.*)/),[dk,dv]=dst.split(/:(.*)/),inRun=!!state.run;
  const take=()=>{if(sk==='bank'){const it=state.bank.find(x=>x.id===sv);return it&&!inRun?{it,from:'bank'}:null}
    if(sk==='pack'){const it=inRun&&state.run.loot.find(x=>x.id===sv);return it?{it,from:'pack'}:null}
    if(sk==='gear'){const [hid,sl]=sv.split('|'),h=heroById(hid);return h&&h.gear[sl]?{it:h.gear[sl],from:'gear',h,sl}:null}return null};
  const S=take();if(!S)return false;
  const detach=()=>{if(S.from==='bank')state.bank=state.bank.filter(x=>x!==S.it);else if(S.from==='pack')state.run.loot=state.run.loot.filter(x=>x!==S.it);else S.h.gear[S.sl]=null};
  const stash=it=>{if(!it)return;if(inRun)state.run.loot.push(it);else state.bank.push(it)};
  if(dk==='gear'){
    const [hid,sl]=dv.split('|'),h=heroById(hid);if(!h||(inRun&&h.hp<=0))return false;
    if(slotType(sl)!==S.it.slot||(S.it.cls&&S.it.cls!==h.cls))return false;
    if(S.from==='bank'&&inRun)return false;if(S.from==='gear'&&S.h===h&&S.sl===sl)return false;
    const old=h.gear[sl],mh=maxHp(h);detach();h.gear[sl]=S.it;
    if(old){if(S.from==='gear'&&slotType(S.sl)===old.slot&&(!old.cls||old.cls===S.h.cls))S.h.gear[S.sl]=old;else if(S.from==='pack')state.run.loot.push(old);else stash(old)}
    if(inRun)h.hp=clamp(h.hp+Math.max(0,maxHp(h)-mh),1,maxHp(h));
    return true;
  }
  if(dk==='bank'&&S.from==='gear'&&!inRun){S.h.gear[S.sl]=null;state.bank.push(S.it);return true}
  if(dk==='pack'&&S.from==='gear'&&inRun){if(state.run.loot.length>=bagCap())return false;S.h.gear[S.sl]=null;state.run.loot.push(S.it);S.h.hp=Math.min(S.h.hp,maxHp(S.h));return true}
  return false;
}
const dnd={src:null};

  document.body.classList.add('dragging');if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
}
function dndMove(x,y){
